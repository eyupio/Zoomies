    <rect x="5"  y="9"  width="13" height="3" rx="1.5" opacity=".45"/>
    <rect x="8"  y="14.5" width="13" height="3" rx="1.5" opacity=".72"/>
    <rect x="5"  y="20" width="13" height="3" rx="1.5" opacity=".45"/>
    <circle cx="24" cy="16" r="3.4"/>
  </g>
</svg>
