<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Zoomies -- GitHub Actions runner fleet controller" />
    <title>Zoomies</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before the first paint. Without this the page
      // flashes light before the app boots, which on a dark-mode dashboard is
      // genuinely unpleasant. Kept inline and tiny on purpose.
      (function () {
        try {
          var t = localStorage.getItem('zoomies.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var n = localStorage.getItem('zoomies.nav.collapsed');
          if (n === '1') document.documentElement.setAttribute('data-nav', 'collapsed');
        } catch (e) {
          /* private mode: fall back to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
