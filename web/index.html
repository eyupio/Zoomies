<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Zoomies -- self-hosted GitHub Actions runner fleet controller. Ephemeral runners by default, GitHub App auth, webhook-driven autoscaling, a single Go binary and SQLite."
    />
    <title>Zoomies</title>

    <!--
      Sharing and discovery.

      A controller is usually private, so this is not about search rankings: it
      is about what an operator's colleagues see when the address gets pasted
      into a chat window, and about the fact that most people meet Zoomies for
      the first time on somebody else's screen. Every one of these tags names
      the project and links back to the site that explains it.

      __ZOOMIES_ORIGIN__ is replaced by server.external_url when the controller
      starts. A scraper cannot resolve a relative address against a page it
      fetched over a private link, so an instance that has been told its own
      address gets absolute URLs and one that has not gets relative ones, which
      is the best either case can do.
    -->
    <meta name="application-name" content="Zoomies" />
    <meta name="author" content="Zoomies contributors" />
    <meta name="generator" content="Zoomies -- https://zoomies.sh" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zoomies" />
    <meta property="og:title" content="Zoomies -- self-hosted Git runners" />
    <meta
      property="og:description"
      content="A GitHub Actions runner fleet controller you host yourself. Ephemeral runners by default, webhook-driven autoscaling, a single Go binary and SQLite."
    />
    <meta property="og:url" content="__ZOOMIES_ORIGIN__/" />
    <meta property="og:image" content="__ZOOMIES_ORIGIN__/brand/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Zoomies logo: a cocker spaniel curling through a circular motion path"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zoomies -- self-hosted Git runners" />
    <meta
      name="twitter:description"
      content="A GitHub Actions runner fleet controller you host yourself. Single Go binary, SQLite, no Kubernetes."
    />
    <meta name="twitter:image" content="__ZOOMIES_ORIGIN__/brand/social-card.png" />
    <meta
      name="twitter:image:alt"
      content="The Zoomies logo: a cocker spaniel curling through a circular motion path"
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image:type" content="image/png" />

    <!--
      Whether this controller wants to be found at all.

      __ZOOMIES_ROBOTS__ is replaced at startup from server.allow_indexing, and
      the default is noindex: a fleet controller is somebody's infrastructure,
      not somebody's website, and /robots.txt says the same thing to a crawler
      that never fetches this page. An operator running a deliberately public
      instance turns it on and gets a startup warning saying what that means.

      The canonical link starts at the root and the router rewrites it on every
      navigation, so a route that has collected filters in its query string
      still names one address rather than a hundred.
    -->
    <meta name="robots" content="__ZOOMIES_ROBOTS__" />
    <link rel="canonical" href="__ZOOMIES_ORIGIN__/" />

    <!--
      What this is, for anything reading the page rather than looking at it: a
      link preview, a bookmarking tool, an assistant asked what is running on
      this host. It names the project's own site, which is where the answer
      actually lives.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Zoomies",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Continuous integration",
        "operatingSystem": "Linux, macOS",
        "browserRequirements": "Requires JavaScript",
        "url": "__ZOOMIES_ORIGIN__/",
        "sameAs": "https://zoomies.sh/",
        "description": "The operator interface for a Zoomies GitHub Actions runner fleet: pools, runners, jobs, hosts and live logs.",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- The paw/swish is the official favicon-scale mark. Larger installed-app
         icons keep the primary circular dog identity. -->
    <meta name="theme-color" content="#080808" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Apply the stored theme before the first paint. Without this the page
      // flashes light before the app boots, which on a dark-mode dashboard is
      // genuinely unpleasant. Kept inline and tiny on purpose.
      (function () {
        try {
          var t = localStorage.getItem('zoomies.theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var n = localStorage.getItem('zoomies.nav.collapsed');
          if (n === '1') document.documentElement.setAttribute('data-nav', 'collapsed');
        } catch (e) {
          /* private mode: fall back to the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        Zoomies needs JavaScript. Everything the interface can do is also available from the REST
        API and the <code>zoomies</code> command-line client, both documented at
        <a href="https://github.com/eyupio/zoomies">github.com/eyupio/zoomies</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
