        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }, style: form, explode: true }
        - { name: conclusion, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - name: unmatched
          in: query
          description: >-
            Only jobs that are still queued and that no enabled pool claims. A job that
            already started or finished was run by something else, so it is not included
            however its labels read, and neither is one whose labels all name GitHub's own
            runners or a hosted-runner vendor's: those run where their labels say.
          schema: { type: boolean }
        - name: managed
          in: query
          description: >-
            Only jobs Zoomies has a hand in: one an enabled pool claims, one that
            ran on a runner this fleet started, and queued jobs no pool claims -- which
            nothing ran, so they belong here too, unless their labels all name somebody
            else's runners. Leave it off to see every job GitHub has reported, including
            those run on hosted runners this fleet does not own.
          schema: { type: boolean }
        - name: failed
          in: query
          description: >-
            Only jobs that went wrong, on either side: a conclusion GitHub counts as a
            failure (failure, timed_out, startup_failure), or a runner of this fleet that
            stopped under the job -- including one GitHub still believes is running.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Frozen IDs; later arrivals are excluded from subsequent actions
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids: { type: array, items: { type: string } }
  /provisioning/bulk:
    post:
      operationId: controlProvisioning
      tags: [jobs]
      summary: Control provisioning for one or more queued items
      description: >-
        Persistent operator controls. Pause and delete suppress new demand; resume restores normal
        demand; run_now resumes and expedites demand within pool priority, bypassing only scale-up delay.
        Existing runners, warm capacity, pool and host limits, quotas, backoff and GitHub jobs are unaffected.
        Completed, running and foreign hosted jobs are skipped with a per-item error. IDs are deduplicated.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, minItems: 1, maxItems: 5000, items: { type: string } }
                action: { type: string, enum: [pause, resume, delete, run_now] }
      responses:
        "200":
          description: Results for each unique selected ID
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Job history
      x-zoomies-role: viewer
      parameters:
        - { name: branch, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - name: run_id
          in: query
          description: >-
            Only the jobs of these workflow runs, by GitHub's run ID -- how the Workflows
            page opens a run to the jobs inside it. Send `repo` with it: a run ID keys a
            run only within its repository.
          schema: { type: array, items: { type: integer, format: int64 } }
          style: form
          explode: true
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }, style: form, explode: true }
        - { name: conclusion, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - name: since
          in: query
          description: Only jobs queued at or after this instant. The start is included.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: >-
            Only jobs queued before this instant. The end is not included, so a window cut
            at one instant -- the last 30 days and the 30 before them -- counts every job
            once.
          schema: { type: string, format: date-time }
        - name: controller_version
          in: query
          description: >-
            Only jobs stamped with one of these controller versions, as `controller_version`
            shows it. `unknown` matches the jobs that were never stamped: recorded before
            the field existed, or never claimed by a pool here.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: host_id
          in: query
          description: Only jobs that ran on one of these hosts, as stamped when a runner took the job.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: size
          in: query
          description: >-
            Only jobs whose runner was this size, as the `size` group of the job statistics
            names it -- `3 CPU / 8 GB`. `unknown` matches the jobs no size was recorded for.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: job_name
          in: query
          description: >-
            Only jobs with exactly this name, unlike `q`, which matches a substring. Repeat
            the parameter for several; commas are not separators, because a matrix job's
            name contains them.
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
        - name: hosted
          in: query
          description: >-
            `true` keeps only jobs whose labels all name somebody else's runners -- GitHub's
            own or a hosted-runner vendor's -- and `false` keeps the rest. Anything else is
            a 400.
          schema: { type: boolean }
        - name: before
          in: query
          description: >-
            A cursor: the `next` of the previous page, passed back unchanged. The page starts
            after the last job that one returned, in the default order (newest queued first,
            then by id), so a job queued while a client is paging cannot move a row from one
            page to the next, as it can with `offset`. Cannot be combined with `offset`,
            `sort` or `order`. An unrecognised value is a 400.
          schema: { type: string }
        - name: include_steps
          in: query
          description: >-
            `true` (the default) returns every job as a full `Job`, steps included.
            `false` returns `JobSummary` items instead: the columns a comparison reads,
            without the step list that is most of a job's size.
          schema: { type: boolean, default: true }
        - name: unmatched
          in: query
          description: >-
            Only jobs that are still queued and that no enabled pool claims. A job that
            already started or finished was run by something else, so it is not included
            however its labels read, and neither is one whose labels all name GitHub's own
            runners or a hosted-runner vendor's: those run where their labels say.
          schema: { type: boolean }
        - name: managed
          in: query
          description: >-
            Only jobs Zoomies has a hand in: one an enabled pool claims, one that
            ran on a runner this fleet started, and queued jobs no pool claims -- which
            nothing ran, so they belong here too, unless their labels all name somebody
            else's runners. Leave it off to see every job GitHub has reported, including
            those run on hosted runners this fleet does not own.
          schema: { type: boolean }
        - name: failed
          in: query
          description: >-
            Only jobs that went wrong, on either side: a conclusion GitHub counts as a
            failure (failure, timed_out, startup_failure), or a runner of this fleet that
            stopped under the job -- including one GitHub still believes is running.
          schema: { type: boolean }
        - name: faulted
          in: query
          description: >-
            Only the failures this fleet caused: the `failed` list narrowed to the jobs
            whose runner never started or stopped under them. This is the list to open
            when somebody says CI is flaky, because it is the half nobody else can fix.
          schema: { type: boolean }
        - name: workflow_failed
          in: query
          description: >-
            The other half: jobs GitHub failed with nothing wrong on this side. Sending
            this and `faulted` together is a 400, because they ask for opposite halves of
            one list.
          schema: { type: boolean }
        - name: cancelling
          in: query
          description: >-
            Narrow by whether a cancellation has been asked of GitHub and not yet
            confirmed. Leaving it off is every job, which is what a history wants;
            `cancelling=false` is what a list of work still in hand wants, because a
            cancelled job is neither waiting for a runner nor running on one. The Jobs
            page sends it with its Running and Queued views for that reason.
          schema: { type: boolean }
        - name: fault
          in: query
          description: >-
            Narrow a fleet failure to particular categories; repeatable. A category this
            build does not know is a 400 rather than a filter that quietly matches
            everything, which would read as a fleet in better shape than it is.
          schema:
            type: array
            items: { $ref: "#/components/schemas/FaultKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          oneOf:
                            - { $ref: "#/components/schemas/Job" }
                            - { $ref: "#/components/schemas/JobSummary" }
                      next:
                        type: string
                        description: >-
                          Pass as `before` to read the page after this one. Absent when this
                          is the last page, and when the listing was sorted other than newest
                          queued first, which a cursor cannot continue.

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Job statistics
      x-zoomies-role: viewer
      description: >-
        Completed jobs counted and timed, grouped by up to two keys, computed from the job
        rows on each request. Selected by when a job was queued, over `[since, until)`;
        `until` defaults to now and `since` to a week before it. A window longer than
        `limits.job_stats_window` (90 days unless set) is a 400 naming the setting.

        Duration percentiles leave out cancelled and skipped jobs, and the response says
        so in `duration_excludes`. Queue wait keeps them. Startup is the runner's container
        start less its creation, so it exists only while the runner's own record is kept.
        Jobs with no stamped release fall into the group `unknown`.

        Jobs live for `retention.jobs` (30 days unless set), so a window reaching further
        back than that describes only what is left.
      parameters:
        - { name: since, in: query, description: Start of the window, included. Defaults to a week before `until`., schema: { type: string, format: date-time } }
        - { name: until, in: query, description: End of the window, not included. Defaults to now., schema: { type: string, format: date-time } }
        - name: group_by
          in: query
          description: >-
            What to group by, at most two, each named once. `controller_version` groups
            releases in the order they were first seen, `day` is the UTC day the job was
            queued, `host` and `pool` are IDs, `size` is the size of the runner the job ran
            on as an operator would say it (`3 CPU / 8 GB`, or `unknown` for a job nothing
            recorded one for), and the values are what the listing's `controller_version`,
            `host_id`, `pool_id`, `job_name` and `size` filters take back. Leave out for one
            group covering the window.
          schema:
            type: array
            maxItems: 2
            items: { type: string, enum: [controller_version, day, host, pool, job_name, size] }
          style: form
          explode: true
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: host_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: controller_version, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: size, in: query, description: "Only jobs whose runner was this size, as `3 CPU / 8 GB`; `unknown` for none recorded.", schema: { type: array, items: { type: string } }, style: form, explode: true }
        - name: job_name
          in: query
          description: Only jobs with exactly this name. Commas are not separators.
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
        - { name: hosted, in: query, description: "`true` keeps only jobs on somebody else's hosted runners, `false` only the rest.", schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStats" }

  /jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cancelJobWorkflow
      tags: [jobs]
      summary: Cancel the GitHub workflow run containing a job
      description: >-
        Asks GitHub to cancel the whole workflow run, not only this job. The
        request is asynchronous; Zoomies keeps the job pending until a webhook
        or the fallback poller confirms its terminal state. Requires the opt-in
        setting and GitHub App Actions write permission.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Bypass conditions that may leave an ordinary cancellation stuck.
      responses:
        "202":
          description: GitHub accepted the cancellation request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, force, run_id]
                properties:
                  accepted: { type: boolean }
                  force: { type: boolean }
                  run_id: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/rerun:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: rerunJobWorkflow
      tags: [jobs]
      summary: Ask GitHub to run this run's failed jobs again
      description: >-
        The remedy for a job the fleet broke. A job whose runner died did not fail on
        its merits, and running it again is the ordinary fix; this saves finding the run
        on GitHub to press the button there.

        GitHub has no job-level rerun, so this re-runs **every failed job in the run**,
        not only this one. The request is asynchronous and nothing local is changed: the
        rerun arrives as new deliveries with a higher `run_attempt`, through the same
        webhook path as everything else.

        It refuses a job that has not finished and a job that did not fail, and it does
        not check whose fault the failure was -- an operator who has looked at one and
        decided to run it again is entitled to. The `fault_domain` on the job is what
        decides where the action is offered, not whether it is allowed. Needs the GitHub
        App's Actions write permission.
      x-zoomies-role: operator
      responses:
        "202":
          description: GitHub accepted the re-run request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, run_id]
                properties:
                  accepted: { type: boolean }
                  run_id: { type: integer, format: int64 }
                  fault_domain:
                    type: string
                    enum: [fleet, workflow]
                    description: Whose the failure being re-run was, echoed back for a script's log.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobEvents
      tags: [jobs]
      summary: A job's timeline
      description: >-
        What Zoomies observed and did about one job, oldest first, each entry a sentence
        an operator can read. Entries are written from what each delivery changed rather
        than from the delivery itself, so GitHub redelivering one adds nothing. Every
        change to the timeline is accompanied by a `job.updated` frame on the event
        stream, which is when a client refetches it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/explanation:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJobExplanation
      tags: [jobs]
      summary: Why this job is where it is
      description: >-
        One answer to "why is this job not running?", computed on the controller from the
        last scheduler plan, the pool it was claimed by, and the runner and host behind
        it. It is a separate endpoint rather than a field on the job because it is
        computed from the fleet around the job rather than from its row, so a cached copy
        of the job delivered by the event stream would carry a stale one. The drawer, the
        CLI and the support bundle render this same answer, so they cannot disagree.
      x-zoomies-role: viewer
      parameters:
        - name: logs
          in: query
          description: >-
            How many of the runner's last lines to quote in `log_excerpt`, ending on the
            line that decided the class. Default 12; `0` quotes none and leaves
            `log_excerpt` null; more than the fleet keeps (40) is read as 40. A value that
            is not a whole number is a 400.
          schema: { type: integer, minimum: 0, default: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExplanation" }
        "400":
          description: "`logs` is not a whole number. `error.field` names it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/facets:
    get:
      operationId: getJobFacets
      tags: [jobs]
      summary: Distinct values for the job filter menus
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos: { type: array, items: { type: string } }
                  workflows: { type: array, items: { type: string } }
                  conclusions: { type: array, items: { type: string } }

  /workflow-runs:
    get:
      operationId: listWorkflowRuns
      tags: [jobs]
      summary: Workflow runs, with their jobs summed up
      description: >-
        One row per workflow run -- the "#1009" GitHub's Actions tab lists -- summing up
        the jobs GitHub reported under it, over the latest attempt of each job, the way
        GitHub's own run page does. Nothing is stored for a run: it is derived from its
        jobs, so a run and the jobs `GET /jobs?repo=&run_id=` lists for it cannot
        disagree. Takes `/jobs`'s filters, read at the run's level. `state`,
        `conclusion`, `failed`, `faulted`, `workflow_failed` and `cancelling` name the
        run's own status -- a run with one job running and another queued is running,
        and a run whose only failure was re-run to success has not failed. Every other
        filter keeps a run whenever any job of it matches, so a run arrives whole rather
        than reduced to the job that matched.
      x-zoomies-role: viewer
      parameters:
        - { name: branch, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: provisioning, in: query, schema: { type: array, items: { type: string, enum: [ready, expedited, paused, deleted] } }, style: form, explode: true }
        - { name: repo, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: workflow, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: pool_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: runner_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: run_id, in: query, schema: { type: array, items: { type: integer, format: int64 } }, style: form, explode: true }
        - name: state
          in: query
          description: The run's own state, worked out from its jobs.
          schema: { type: array, items: { $ref: "#/components/schemas/JobState" } }
          style: form
          explode: true
        - name: conclusion
          in: query
          description: The run's own conclusion, worst outcome of its jobs first.
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - { name: label, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: unmatched, in: query, description: Runs with a job that is still queued and that no enabled pool claims., schema: { type: boolean } }
        - { name: managed, in: query, description: Runs Zoomies has a hand in, through any job of theirs., schema: { type: boolean } }
        - { name: failed, in: query, description: Runs with a job that went wrong on either side, counting only the latest attempt of each job., schema: { type: boolean } }
        - { name: faulted, in: query, description: Runs with a failure this fleet caused., schema: { type: boolean } }
        - { name: workflow_failed, in: query, description: Runs GitHub failed with nothing wrong on this side. Sending this and `faulted` together is a 400., schema: { type: boolean } }
        - { name: cancelling, in: query, description: Narrow by whether a cancellation of the run has been accepted by GitHub and not yet confirmed., schema: { type: boolean } }
        - name: fault
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/FaultKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WorkflowRun" }

  /workflow-runs/cancel:
    post:
      operationId: cancelWorkflowRun
      tags: [jobs]
      summary: Cancel a workflow run
      description: >-
        What the Workflows page's own run rows call, rather than reaching for one of the
        run's jobs' IDs the way `POST /jobs/{id}/cancel` does -- a run has no ID of its
        own, only `repo` + `github_run_id`, so this takes both directly. Behaves exactly
        like cancelling through a job of the run: the request is asynchronous, every
        queued or running job of the run is stopped locally once GitHub accepts it, and
        Zoomies keeps them pending until a webhook or the fallback poller confirms their
        terminal state. Requires the opt-in setting and GitHub App Actions write
        permission.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, run_id]
              properties:
                repo: { type: string, description: "The repository, as owner/name." }
                run_id: { type: integer, format: int64, description: GitHub's own ID for the run. }
                force:
                  type: boolean
                  default: false
                  description: Bypass conditions that may leave an ordinary cancellation stuck.
      responses:
        "202":
          description: GitHub accepted the cancellation request
          content:
            application/json:
              schema:
                type: object
                required: [accepted, force, repo, run_id, jobs]
                properties:
                  accepted: { type: boolean }
                  force: { type: boolean }
                  repo: { type: string }
                  run_id: { type: integer, format: int64 }
                  jobs: { type: integer, description: How many of the run's jobs this fleet knows about. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workflow-runs/provisioning:
    post:
      operationId: controlWorkflowRunProvisioning
      tags: [jobs]
      summary: Pause, resume or expedite every queued job of a workflow run
      description: >-
        `POST /provisioning/bulk` for a whole run: what the Workflows page's own run rows
        call, since a run has no ID of its own to select by, only `repo` + `github_run_id`.
        Acts on the run's queued jobs this fleet has a hand in, in every provisioning state
        but removed -- a job an operator deleted from the queue was stood down on purpose,
        and is restored from the Queue page's Removed view rather than swept back in by a
        Run now on its run. The actions mean what they mean on `/provisioning/bulk`, and
        delete is not one of them: a removal is a decision about one job. Returns the same
        per-job results. `404` for a run this fleet has never heard of; `409` when it knows
        the run but no job of it is waiting for a runner here.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo, run_id, action]
              properties:
                repo: { type: string, description: "The repository, as owner/name." }
                run_id: { type: integer, format: int64, description: GitHub's own ID for the run. }
                action: { type: string, enum: [pause, resume, run_now] }
      responses:
        "200":
          description: A result per queued job of the run the action reached
          content:
            application/json:
              schema:
                type: object
                required: [results, repo, run_id]
                properties:
                  repo: { type: string }
                  run_id: { type: integer, format: int64 }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ==========================================================================
  # Hosts
  # ==========================================================================
  /hosts:
    get:
      operationId: listHosts
      tags: [hosts]
      summary: List hosts
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Host" }

  /hosts/samples:
    get:
      operationId: listHostSamples
      tags: [hosts]
      summary: Per-host minute samples for the capacity map
      description: >-
        One row per host per minute: its slots, what its agent measured (CPU,
        the one-minute load average, available memory), what the scheduler had
        promised away on it, and its disk. A measurement the host had not made,
        or one older than 90 seconds when the minute was sampled, is absent
        rather than zero, so a host that stopped reporting draws a gap rather
        than a flat line. Kept for `retention.samples`, like the fleet samples.
      x-zoomies-role: viewer
      parameters:
        - name: window
          in: query
          schema: { type: string, default: "1h" }
        - name: since
          in: query
          description: An exact instant to resume from. Wins over `window` when both are given.
          schema: { type: string, format: date-time }
        - name: host_id
          in: query
          description: One host's samples only. Left out, every host's.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HostSample" }

  /hosts/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getHost
      tags: [hosts]
      summary: Get a host
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateHost
      tags: [hosts]
      summary: Update a host's name, capacity, labels, reserve or runner profile
      description: >-
        A `size` label is the host's size class while `scheduler.size_routing` or
        `scheduler.auto_pools` is not `off`, and is refused with 422 unless it is
        `small`, `medium` or `large`; with both off it is an ordinary label.
        Refused with 409 when the reserve, the labels or the runner profile described
        would leave a pool that runs here today with no host in the fleet that could
        ever run it. The message names the pool and the limit -- a host minimum above a
        size the pool states, or a host standard below the floor of a pool that takes
        its size from the host; confirm=true saves it anyway, which is right when the
        pool is on its way out. Changing the capacity, the reserve or the runner profile
        lifts the host's throttle, as the operator answering the pressure that raised it.
      x-zoomies-role: operator
      parameters:
        - name: confirm
          in: query
          description: Accept leaving a pool with nowhere to run.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Every field is optional and independent; what is not named is left alone.
                The reserve is what this machine keeps for itself, in the units the host
                reports its own figures in. A reserve on a figure the host has never
                reported, or one that would leave nothing to place on, is refused rather
                than clamped.
              properties:
                name:
                  type: string
                  maxLength: 128
                  description: >-
                    What the host is called. Surrounding whitespace is trimmed; it must be
                    non-empty, free of control characters and backticks (a backtick pair is
                    drawn as a command to copy in the problems list) and not used by another
                    host (422 otherwise). An agent's configured name is read only when it first
                    joins, so a heartbeat does not undo a rename.
                capacity: { type: integer, minimum: 0 }
                labels: { type: object, additionalProperties: { type: string } }
                reserve_cpus: { type: integer, minimum: 0 }
                reserve_memory_mb: { type: integer, format: int64, minimum: 0 }
                reserve_disk_mb: { type: integer, format: int64, minimum: 0 }
                runner_profile:
                  allOf: [{ $ref: "#/components/schemas/RunnerProfile" }]
                  description: >-
                    How big a runner is on this host. It replaces the whole profile: leave it
                    out to change nothing, send `{}` to clear it so the host follows the
                    fleet's settings again, and a field left out of a profile that is sent
                    follows the fleet too. A size below a quarter of a core or 512 MB, a
                    minimum above the standard, a ceiling below it, or a size the machine
                    could never give once its reserve is held back is refused with the field
                    named; a host that has reported nothing about itself has nothing to
                    compare against, so its profile is saved and used once it does.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteHost
      tags: [hosts]
      summary: Remove a host
      description: Refused while the host still has live runners, unless forced.
      x-zoomies-role: admin
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }

  /hosts/{id}/cordon:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: cordonHost
      tags: [hosts]
      summary: Cordon or uncordon a host
      description: A cordoned host keeps its existing runners and accepts no new ones.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cordoned]
              properties:
                cordoned: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }

  /hosts/{id}/health-check:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: checkHostHealth
      tags: [hosts]
      summary: Ask a host's agent to check itself now
      description: >-
        Queues one request for the host's agent to run its read-only OS checks once and send the
        report back, instead of waiting for its next periodic report. Nothing on the host is
        changed, and the controller never dials the agent: the request goes out on the agent's
        own poll. The answer is the host straight away, carrying `health_check.state` of `asked`;
        the report arrives later as an ordinary `host.updated` event. Only a native Linux agent
        (a systemd or bare-process install, or the agent inside a natively installed controller)
        that advertises `host-check` can answer. An agent in a container, including the Compose
        deployment with the host-health service, a host that is not Linux and an agent older
        than this feature are refused with 409 and a sentence saying so, as is a host that is not
        connected. A host asked within the last 15 seconds answers 429 with `Retry-After`; asking
        again while a request is still waiting for its answer changes nothing and answers the
        host. Audited as `host.check_requested` only when a request was queued. Takes no body.
      x-zoomies-role: operator
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /hosts/{id}/update:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: requestHostUpdate
      tags: [hosts]
      summary: Update a host to this controller's release
      description: >-
        Asks the host's agent to have its update helper replace the agent's binary with the
        release this controller runs. It answers 202 with the host, whose `update` block holds the
        attempt as `requested`: the task goes out on the agent's own poll, because the controller
        never dials an agent, and the host is updated once its agent reports that release, which
        the page learns from the host's `host.updated` events. Everything that can refuse does so
        before anything is written, so a refusal leaves nothing in flight. A host can be asked when
        its `update.can_update` is true: updating is on, its agent offers to update itself (it does
        only once the update helper is installed on the host), it is behind the controller's
        release, and no attempt for it is open. The agent inside the controller is updated with
        the controller, and is refused with `update.host_cannot_update`, as is a host that is not
        behind. A host that is not there is a 404. Takes no body; a field sent is a 422 naming it.
        Audited as `update.host_requested` once it is accepted, and not before. Below the
        `platform` role the text of a failed attempt in the answer is a fixed sentence for its
        state.
      x-zoomies-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: Asked for. The host's `update` is `requested`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UpdateRefused" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /hosts/{id}/check-acceptances:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    put:
      operationId: acceptHostCheck
      tags: [hosts]
      summary: Accept a host's warning as deliberate
      description: >-
        Stops Zoomies counting one warning on one host, for a reason a person gives and until
        a date at most 365 days away. It changes nothing on the host: the controller never runs
        a command there, and the host's own `zoomies doctor` still lists the check. Only a
        counted warning on a check this build has can be accepted -- never an error, a skip,
        a suggestion, the pending reboot or the two disk checks, each refused with 422 and the
        reason -- and only while the check still reads `seen_current`, or the answer is 409.
        The value kept is the stored report's, so it ends sooner if the check reads anything
        else. Deciding the same thing again renews it. The reason is shown to everyone who can
        see the host and goes in the audit log as `host.check_accepted`. The answer is the host.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostCheckAcceptanceInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /hosts/{id}/check-acceptances/{check_id}:
    parameters:
      - { $ref: "#/components/parameters/PathID" }
      - { name: check_id, in: path, required: true, schema: { type: string, examples: [files.service] } }
    delete:
      operationId: revokeHostCheck
      tags: [hosts]
      summary: Take back an accepted warning
      description: >-
        Any operator may revoke any acceptance: it only makes Zoomies stricter, so the check
        counts again straight away. Revoking one that is not there is not an error, so two
        people pressing the button agree; only a revoke that ended something is audited, as
        `host.check_revoked`. The answer is the host.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }

  /hosts/{id}/throttle/clear:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: clearHostThrottle
      tags: [hosts]
      summary: Lift a host's throttle
      description: |
        Lifts the throttle the controller has this host on, whatever rung it is on:
        the host takes its configured capacity again on the next scheduling pass and
        every runner here with a CPU limit is restored to its full quota on the agent's
        next heartbeat. Nothing pins it the other way -- if the pressure is still there,
        the next heartbeat steps it back up -- so this is for a host whose cause is
        known and fixed, not a way to switch throttling off. A host on no rung is
        returned unchanged. Audited as `host.throttle_clear` under the caller's identity.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }

  /join-tokens:
    get:
      operationId: listJoinTokens
      tags: [hosts]
      summary: List join tokens
      description: The secret itself is never returned; only its prefix, for identification.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JoinToken" }
    post:
      operationId: createJoinToken
      tags: [hosts]
      summary: Mint a join token
      description: |
        Returns the plaintext token **once**, along with a ready-to-paste
        command for the new host. Single-use, and short-lived by default.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl: { type: string, default: "15m", examples: ["15m", "1h"] }
                capacity:
                  type: integer
                  default: 2
                  minimum: 0
                  description: 0 lets the agent decide from the host's CPU count.
                labels: { type: object, additionalProperties: { type: string } }
                connection:
                  type: string
                  enum: [direct, tailcat]
                  default: direct
                  description: Tailcat creates a private encrypted agent connection and supplies its address in the returned commands.
                controller_url:
                  type: string
                  format: uri
                  description: |
                    The address the new host should join on, used in the
                    returned command in place of `server.external_url`. The
                    UI sends the address the browser reached Zoomies
                    on, which is the one a machine beside it can usually reach
                    too. Must be an absolute http or https URL.
                  examples: ["https://zoomies.example.com"]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/JoinToken"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Shown once. Only its hash is stored.
                      join_command:
                        type: string
                        description: Command for an existing binary. Contains credentials; shown only in this response.
                      command:
                        type: string
                        description: The one-liner to run on the new host.
                        examples: ["curl -fsSL https://zoomies.sh/install.sh | sh -s -- --mode agent --controller https://zoomies.example.com --join-token zoojoin_... --version v1.0.0"]
                      controller_version:
                        type: string
                        description: The concrete controller build the command was generated by.
                        examples: ["main-sha-abc1234 (abc1234)"]
                      install_tag:
                        type: string
                        description: The binary and image channel selected for the new host.
                        examples: ["dev"]
                      version_note:
                        type: string
                        description: >-
                          Why the command could not be pinned to this instance's build, or
                          absent when it was. Main builds use the rolling dev asset; only local
                          or otherwise unpublished builds have no matching install tag.
        "409": { $ref: "#/components/responses/LimitReached" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /join-tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getJoinToken
      tags: [hosts]
      summary: Get a join token
      description: |
        The token's state, never its secret. Once a host has redeemed it,
        `used_by_id` is that host's id -- which is how the Add-a-host page
        knows the machine it is waiting for has arrived.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinToken" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteJoinToken
      tags: [hosts]
      summary: Revoke an unused join token
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Providers and machines
  # ==========================================================================
  /kennel:
    get:
      operationId: getKennelOverview
      tags: [kennel]
      summary: Kennel Club's overview
      description: >-
        Counts by standing and by severity, the check each open finding belongs to, how far
        each source could be read, the repositories needing attention and any installation
        whose reads are not getting through. It answers 200 with `enabled: false` and nothing
        else while Kennel Club is off, because the page needs a document to explain itself
        with and "off" is a state and not a failure.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelOverview" }

  /kennel/checks:
    get:
      operationId: listKennelChecks
      tags: [kennel]
      summary: What Kennel Club checks
      description: >-
        The catalogue: each check's code, area and usual severity, the sentence that says what
        it detects, and the GitHub permission each source it reads takes. It is built from the
        registry the evaluator runs, so it cannot disagree with it, and it answers while Kennel
        Club is off because it is what the off page explains.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KennelCatalogueEntry" }

  /kennel/repositories:
    get:
      operationId: listKennelRepositories
      tags: [kennel]
      summary: Repositories Kennel Club has looked at
      description: >-
        Each is a repository this fleet has served, or under the installation scope one the App
        can see. The default order puts the repository with the most errors first, then warnings,
        then notes, then by name. `sort` is `severity`, `name` or `evaluated_at`. A repository
        Kennel Club has been told not to look at is listed too, with `tracking.tracked` false and
        nothing evaluated for it; `tracked` narrows the list to the ones it is or is not.
      x-zoomies-role: viewer
      parameters:
        - { name: q, in: query, description: Substring match on the repository's name., schema: { type: string } }
        - { name: severity, in: query, description: Only repositories with an open finding of this severity., schema: { $ref: "#/components/schemas/KennelSeverity" } }
        - { name: code, in: query, description: Only repositories with an open finding of this check., schema: { type: string, examples: [exposure.fork_code_ran] } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/KennelState" } }
        - { name: installation, in: query, description: Only this installation's repositories., schema: { type: string } }
        - { name: incomplete, in: query, description: "`true` keeps the repositories that are only partly checked: `partial` or `pending`. It is what the Overview's Partly checked count adds up, which counts only the repositories being tracked, so add `tracked=true` to match it. It cannot be combined with `state`.", schema: { type: boolean } }
        - { name: waived, in: query, description: "`true` keeps the repositories with at least one waived finding; `false` keeps the ones with none.", schema: { type: boolean } }
        - name: active
          in: query
          description: >-
            `true` keeps the repositories this fleet has had a hand in a job for within Kennel
            Club's window, which is thirty days or as long as the fleet keeps its jobs if that is
            shorter; `false` keeps the ones it has not. Left out, both are listed. It is asked of
            the jobs, not of when Kennel Club last looked at the repository, so under the
            installation scope it still tells a busy repository from one the App merely sees.
            Anything but a boolean is a 400.
          schema: { type: boolean }
        - name: tracked
          in: query
          description: >-
            `true` keeps the repositories Kennel Club is looking at; `false` keeps the ones it has
            been told not to. Left out, both are listed. Anything but a boolean is a 400.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/KennelRepository" }
        "400":
          description: A filter is not a value this list accepts. `error.field` names the parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }

  /kennel/repositories/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getKennelRepository
      tags: [kennel]
      summary: One repository, with its findings
      description: >-
        The same document the event stream's `kennel.updated` frames carry. Every finding is a
        title, a detail and a fix written from a fixed template, so none of it is text a
        repository's author wrote; a name appears only in `evidence`, typed, and is to be rendered
        as text.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelRepository" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /kennel/repositories/{id}/agent-guidance:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: previewKennelGuidance
      tags: [kennel]
      summary: Inspect agent guidance and preview proposed changes
      description: >-
        Requires Kennel Club and kennel.agent_guidance to be enabled and the repository to be
        tracked. Pins the default branch, reads bounded instruction files and command manifests,
        and returns issues and before/after file contents. Contents read permission is sufficient.
        Repository text is untrusted and must be rendered as text. An incomplete inventory answers
        409; it cannot produce a repair proposal.
      x-zoomies-role: admin
      responses:
        "200":
          description: A proposal, including an empty files array when changes require manual review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelGuidancePreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      operationId: createKennelGuidancePR
      tags: [kennel]
      summary: Open a draft pull request for reviewed agent guidance
      description: >-
        Recomputes the proposal and requires its exact plan_hash. Refuses changes after review.
        Needs Contents write and Pull requests write, without Workflows write. Uses a deterministic
        branch and reconciles retries without overwriting edited proposals or reopening closed PRs.
        Changes no workflows, installs no AI Context and grants no assistant access.
        Audited as kennel.guidance_pr. Merge the PR, then request Recheck to refresh the findings.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_hash]
              properties:
                plan_hash: { type: string }
      responses:
        "200":
          description: The proposal and its draft pull request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelGuidancePreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /kennel/repositories/{id}/recheck:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: recheckKennelRepository
      tags: [kennel]
      summary: Ask for a repository to be read from GitHub again
      description: >-
        Makes the repository due and wakes the loop; it reads nothing itself, so it waits on the
        same request budget and the same rate-limit hold as everything else. A repository can be
        asked for once every five minutes: a second request answers 429 with `Retry-After`. A
        repository Kennel Club is not tracking has nothing to read, and answers 409.
      x-zoomies-role: operator
      responses:
        "202":
          description: Accepted. The repository as it now stands, with its reads due.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelRepository" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /kennel/repositories/{id}/waivers:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    put:
      operationId: waiveKennelFinding
      tags: [kennel]
      summary: Decide that a finding is acceptable here
      description: >-
        A waiver is a person's recorded decision, with a reason, an owner and a mandatory end of
        at most 365 days. It is for a finding that exists: a code and subject that match nothing
        open on the repository are refused. Making the same decision again renews it and keeps its
        ID. Waiving an **error** finding needs `kennel.waive_error` (the administrator role) and
        answers 403 naming it; a warning or a note is the operator's. The answer is the repository,
        already worked out again. A repository Kennel Club is not tracking has no findings, and
        answers 409.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KennelWaiverInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelRepository" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /kennel/repositories/{id}/waivers/{waiver_id}:
    parameters:
      - { $ref: "#/components/parameters/PathID" }
      - { name: waiver_id, in: path, required: true, schema: { type: string, examples: [kcw_k3f9qz2m] } }
    delete:
      operationId: unwaiveKennelFinding
      tags: [kennel]
      summary: End a waiver
      description: >-
        Any operator may end any waiver, an administrator's included: ending one only makes
        Kennel Club stricter, because the finding is open again. The waiver must belong to this
        repository, or the answer is 404. The answer is the repository, worked out again.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelRepository" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /kennel/repositories/{id}/tracking:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    put:
      operationId: setKennelTracking
      tags: [kennel]
      summary: Stop Kennel Club looking at a repository, or start again
      description: >-
        Every repository is tracked until somebody says otherwise. One that is not tracked is not
        read from GitHub and not evaluated, raises no finding and no problem, and is counted
        apart from the Overview's totals as `not_tracked`; it stays in the list, and everything
        the fleet knows about it still shows. Its waivers are kept and do nothing until it is
        tracked again.


        Stopping silences the repository's errors, so it needs `kennel.untrack` (the
        administrator role) and a `reason` of 10 to 500 characters, and answers 403 naming the
        action without it. Starting again needs only `kennel.track` (an operator), because it can
        only make Kennel Club stricter, and makes the repository due at once. It is a PUT
        because it sets a state: asking for the one the repository is already in answers 200
        and changes nothing, the first decision's reason, person and time included, and writes
        no audit row. `reason` is read only when stopping. The answer is the repository as it
        now stands, and a repository that is not tracked is as if nothing had looked at it:
        `state` is `pending` and it has no findings, counts or coverage.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KennelTrackingInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KennelRepository" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /provider-setups:
    post:
      operationId: createProviderSetup
      tags: [providers]
      summary: Generate a one-time Proxmox host setup command
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                controller_url: { type: string, description: Optional HTTPS callback address. Omit to use the private Tailcat controller connection. }
      responses:
        "201":
          description: Setup command; keep private and run within one hour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /provider-setups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProviderSetup
      tags: [providers]
      summary: Wait for the Proxmox host connection without reading its secrets
      x-zoomies-role: admin
      responses:
        "200":
          description: Pending or ready connection. Secrets are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /provider-setups/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeProviderSetup
      x-internal: true
      tags: [providers]
      summary: Upload the host connection with the connection-bound setup capability
      description: >-
        Uses only the setup command's bearer token, not a user session or runner join
        token. Uploads are sealed at rest. Identical retries are acknowledged; a completed
        connection cannot be replaced. This route cannot create providers or hosts.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, endpoint, credential, ca_pem, tailcat_address]
              properties:
                name: { type: string }
                endpoint: { type: string }
                credential: { type: string, writeOnly: true }
                ca_pem: { type: string }
                tailcat_address: { type: string, writeOnly: true }
                templates: { type: array, items: { $ref: "#/components/schemas/ProxmoxSetupTemplate" } }
      responses:
        "204": { description: Connection accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List infrastructure providers
      description: >-
        A provider is one place machines can be rented from. The credential is never in
        the response and has no field it could be in: `credentials_configured` says
        whether one is sealed in the row, which is all a form needs to know.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      operationId: createProvider
      tags: [providers]
      summary: Configure a provider
      description: >-
        The credential is sealed with the instance key before the row is written. A
        provider is created renting nothing - `max_machines` defaults to zero - so that
        nothing starts spending money on the strength of a connection test.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /providers/validate:
    post:
      operationId: validateProvider
      tags: [providers]
      summary: Check a draft provider without saving it
      description: >-
        A dry run over a draft, for the wizard's review step. It writes nothing and dials
        nothing - a driver's own validator is offline by contract - so it can be run as
        somebody types. It always answers 200: whether the draft is valid is in the body.
        Pass `?id=` when the draft is an edit to an existing provider, so the name check
        does not refuse it about itself. `POST /providers/{id}/check` is the call that
        talks to the hypervisor.
      x-zoomies-role: admin
      parameters:
        - { name: id, in: query, schema: { type: string }, description: The provider this is a dry run of an edit to. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderValidation" }

  /providers/discover:
    post:
      operationId: discoverProviderDraft
      tags: [providers]
      summary: Ask a draft provider what its credential can see
      description: >-
        The same lists as `GET /providers/{id}/discovery`, for a provider that has not been
        saved yet, so the wizard can offer nodes, storages, bridges and templates as a
        menu before there is a row. The draft is checked exactly as a create would check
        it and refused with the same field errors, so nothing is asked about a body that
        could not be saved. A hypervisor that does not answer or refuses the token is
        200 with empty lists and the reason in `unavailable`: halfway through a wizard
        that is the expected state, and the form asks for identifiers instead.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDiscovery" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /providers/kinds:
    get:
      operationId: listProviderKinds
      tags: [providers]
      summary: What this build can rent machines from
      description: >-
        Every driver this build ships, its capabilities, and the questions its
        configuration form has to ask. The wizard renders its form from this, so a setting
        a driver gained cannot be missing from the form that collects it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderKind" }

  /providers/pairings:
    get:
      operationId: listProviderPairings
      tags: [providers]
      summary: Which providers would rent machines for which pools
      description: >-
        Every provider against every pool, and whether the provider would rent a machine for
        it. A rental needs three things: the provider's `pool_selector` allows the pool, the
        pool's `provider_selector` allows the provider, and the machine the provider builds
        is one the pool's runners could be placed on. `by` says which selector refused, and
        `why` and `fix` say what did not match and what to change, so an operator looking at
        a pool nobody rents for can see whose setting says so.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderPairing" }

  /providers/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Change a provider's settings, shape or ceilings
      description: >-
        Every field is optional and independent; what is not named is left alone. A
        credential of `""` leaves the stored one alone, so a form with a blank password
        box does not erase it. A provider's kind cannot be changed: the machines it
        already owns are that kind.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Remove a provider
      description: >-
        Refused while any of its machines still believes it holds a resource, naming how
        many. The rows are the only record of what was rented, so the machines go first.
      x-zoomies-role: admin
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/check:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: checkProvider
      tags: [providers]
      summary: Run the live preflight
      description: >-
        Asks the provider what it would refuse, changing nothing there. The result is
        recorded on the row as well as returned, so a check run in a terminal quiets the
        warning the UI is showing. Audited, because it uses the credential.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCheck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/discovery:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProviderDiscovery
      tags: [providers]
      summary: What this credential can actually see
      description: >-
        The nodes, storages, bridges and templates a provider offers, so the form presents
        a menu rather than asking somebody to go and look an identifier up. A driver that
        cannot list them answers 409 and the form asks for the identifiers instead.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderDiscovery" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /providers/{id}/orphans:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getProviderOrphans
      tags: [providers]
      summary: Rows and resources that disagree
      description: >-
        The three ways a machine row and a real resource can fail to agree: a resource
        wearing this fleet's naming that no row accounts for, a row that holds nothing,
        and a machine whose ownership nothing has been able to confirm. Nothing here is
        ever acted on automatically.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderOrphans" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: pauseProvider
      tags: [providers]
      summary: Stop this provider buying new machines
      description: >-
        The kill switch. It blocks new machines only: draining, deleting, recovering and
        verifying ownership all continue, because a switch that stopped those would strand
        running machines nobody is watching. Pressing it twice is not an error.
      x-zoomies-role: operator
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Why, for the card and the audit row. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: resumeProvider
      tags: [providers]
      summary: Let this provider buy machines again
      description: Pressing it twice is not an error.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant/chat:
    post:
      operationId: assistantChat
      tags: [assistant]
      summary: Ask the assistant's model a question
      description: |
        Answers a conversation as a `text/event-stream`: `delta` frames carrying
        `{"text": ...}` as the model writes, one `usage` frame with
        `{"input_tokens", "output_tokens"}` when the provider reports them, and a final
        `done` frame with the provider's name and the model, or an `error` frame with a
        `message` if the answer failed after it began (the status had gone out with the
        first byte by then).

        The controller keeps nothing between requests: send the conversation so far,
        ending in the person's question, and send it again with the next one. Only
        `user` and `assistant` messages are accepted. The model is told what Zoomies
        is and that it cannot see this fleet or change anything; no tool is offered
        and no fleet data is attached.

        Everything that can be refused is refused before the stream opens: a conversation
        that is empty, too long or does not end in a user message is a 422 naming the
        message; an instance with no enabled provider, or a named one that is not, is a
        409; a model that would not answer at all (the address was refused, the key was
        wrong) is a 502 with code `assistant.provider_failed`.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantChatRequest" }
      responses:
        "200":
          description: The answer, as it is written
          content:
            text/event-stream:
              schema: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502":
          description: The model would not answer. The code is `assistant.provider_failed` and the message says why in words that never carry the request or the key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /assistant/providers:
    get:
      operationId: listAssistantProviders
      tags: [assistant]
      summary: List the assistant's providers
      description: >-
        One row per model the assistant may talk to. The key is never in the response and
        has no field it could be in: `key_configured` says one is sealed on the row.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AssistantProvider" }
    post:
      operationId: createAssistantProvider
      tags: [assistant]
      summary: Add a provider
      description: >-
        The key is sealed with the instance key before the row is written. A base URL on
        this machine or a private network is refused unless `assistant.allow_private_provider`
        is on; the 422 names the switch.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantProviderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProvider" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /assistant/providers/check:
    post:
      operationId: checkAssistantDraft
      tags: [assistant]
      summary: Test a provider before saving it
      description: >-
        Runs the check against the body as a form has it, with the key the form holds, so a
        key need not be saved to be tested. Nothing is written. A check that fails is still
        a 200: the verdict is in the body.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProviderCheck" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /assistant/providers/models:
    post:
      operationId: listAssistantModels
      tags: [assistant]
      summary: List the models a provider serves
      description: >-
        Asks the provider, as the body has it, which models it serves, with the key the form
        holds (or the saved row's, when `id` names one and the key is blank), so the Add form
        can offer a list and not a box to type a spelling into. The model need not be chosen
        yet. Nothing is written. A provider that would not answer is a 502 with code
        `assistant.provider_failed`; one that has no list to give is a 409, and its model is
        typed.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantProviderInput" }
      responses:
        "200":
          description: The model names, sorted and without repeats
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502":
          description: The provider would not answer. The code is `assistant.provider_failed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /assistant/providers/kinds:
    get:
      operationId: listAssistantProviderKinds
      tags: [assistant]
      summary: The kinds of provider a person may add
      description: >-
        Each kind with the address a hosted one has, or an empty string for the kind whose
        address has to be typed.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, default_base_url]
                      properties:
                        kind: { $ref: "#/components/schemas/AssistantProviderKind" }
                        default_base_url: { type: string }

  /assistant/providers/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getAssistantProvider
      tags: [assistant]
      summary: One provider
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAssistantProvider
      tags: [assistant]
      summary: Change a provider
      description: >-
        Every field is optional and independent. An empty or absent `api_key` leaves the
        sealed key alone; a non-empty one replaces it. The default is not changed here.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantProviderInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProvider" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteAssistantProvider
      tags: [assistant]
      summary: Remove a provider
      description: >-
        The body carries the provider's name, typed to confirm; a name that does not match
        is a 409 and nothing is removed. Removing the default leaves no default.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /assistant/providers/{id}/check:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: checkAssistantProvider
      tags: [assistant]
      summary: Test a provider
      description: >-
        Runs the provider's check and one token of completion, and records the result on
        the row, so the page shows it after a reload and not only in the tab that pressed
        Test. A check that fails is still a 200; `ok` and `error` say so. Audited, because
        it uses the key.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProviderCheck" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant/providers/{id}/default:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: setDefaultAssistantProvider
      tags: [assistant]
      summary: Make this the provider that answers
      description: One provider is the default at a time; this one becomes it and the previous one stops being it, in one write.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantProvider" }
        "404": { $ref: "#/components/responses/NotFound" }

  /machines:
    get:
      operationId: listMachines
      tags: [providers]
      summary: List rented machines
      description: >-
        There is deliberately no POST. A machine exists because demand asked for one: one
        creation path means one accounting path, and a machine made by hand would be
        supply the reconciler would then decide to delete.
      x-zoomies-role: viewer
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Order" }
        - { name: provider, in: query, schema: { type: string }, description: Repeatable, or comma-separated. }
        - { name: pool, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/MachineState" } }
        - { name: q, in: query, schema: { type: string } }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false }, description: Keep machines whose resource is confirmed gone. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Machine" }

  /machines/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getMachine
      tags: [providers]
      summary: Get a machine, with the phases it has reached
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMachine
      tags: [providers]
      summary: Destroy a machine and the resource behind it
      description: >-
        Records the intent and answers with the machine in `deleting`: a delete is
        finished when the resource can no longer be found, not when the provider returns.
        Refused while runners are still going unless forced. A quarantined machine is
        never deletable, forced or not - its resource may belong to somebody else - and
        the escape hatch there is release.
      x-zoomies-role: admin
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /machines/{id}/drain:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: drainMachine
      tags: [providers]
      summary: Cordon a machine and let its runners finish
      description: >-
        Reversible right up until the delete starts: demand coming back takes a draining
        machine to ready again rather than paying for a new one.
      x-zoomies-role: operator
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /machines/{id}/release:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: releaseMachine
      tags: [providers]
      summary: Forget a machine without touching its resource
      description: >-
        For the machine nobody can safely delete: a quarantined one whose resource turned
        out to be somebody else's, or a row for a resource that was removed by hand. The
        machine's name must be in the body to confirm. If the resource does still exist it
        goes on running, so the audit row keeps the provider's identifiers for it after
        the database has stopped holding them.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: The machine's name, typed to confirm. }
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Migrations
  # ==========================================================================
  /migrations/plan:
    post:
      operationId: planMigration
      tags: [migrations]
      summary: What moving these repositories onto Zoomies would change
      description: |
        Reads the workflow files in the repositories a GitHub App installation
        can see, and reports the `runs-on` lines it would rewrite, the ones it
        would leave alone and why, and a unified diff of each change.

        It writes nothing. Everything it returns is a proposal for the operator
        to edit before `POST /migrations/pull-requests` acts on it.

        With no `mapping`, the server proposes one from the pools that exist,
        matching each GitHub-hosted label against the pool that promises the
        same operating system and architecture. A label with no plausible pool
        is left unmapped rather than mapped approximately, and appears in
        `unmapped`.

        `mapping` is one answer per label for every repository, which is what
        most fleets want. `overrides` are the exceptions to it: each names one
        job in one workflow file in one repository and sends it somewhere else,
        or -- with an empty `to` -- leaves that one job on GitHub's runners.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: Limits the plan to these repositories. Empty means every repository the installation can see, up to the server's limit.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                  description: >-
                    Hosted label to the runs-on value that replaces it, e.g.
                    {"ubuntu-latest": "zoomies-linux-x64"}. Empty asks the server to propose one.
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`, each naming one job in one workflow file in one
                    repository. Empty is the common case: most fleets want one answer per
                    hosted-runner label everywhere.
                cursor:
                  type: string
                  description: >-
                    The page of repositories to read: the `next_cursor` a previous plan
                    returned, which is the full name of the last repository it listed.
                    Empty starts at the first page. Ignored when `repos` names repositories.
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /migrations/pull-requests:
    post:
      operationId: openMigrationPullRequests
      tags: [migrations]
      summary: Open the pull requests a plan described
      description: |
        Opens one pull request per repository, each on its own branch, changing
        only the workflow files whose `runs-on` the mapping covers.

        The plan is recomputed here from the repositories' current contents
        rather than taken from the client: the workflows may have changed since
        the review step, and accepting file contents from a browser would make
        this a way to write arbitrary files into any repository the App can
        reach. Every file is committed against the blob SHA it was read at, so a
        push that lands in between is a conflict rather than a silent revert.

        The App needs three permissions the rest of Zoomies does not:
        Contents (write), Pull requests (write) and Workflows (write). The plan
        endpoint reports which are missing before anything is attempted.
      x-zoomies-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, repos]
              properties:
                installation_id: { type: string }
                repos:
                  type: array
                  items: { type: string }
                  description: The repositories to open pull requests on. Required; this endpoint never defaults to every repository an App can see.
                mapping:
                  type: object
                  additionalProperties: { type: string }
                overrides:
                  type: array
                  items: { $ref: "#/components/schemas/MigrationOverride" }
                  description: >-
                    Exceptions to `mapping`. A request with no mapped label is accepted when at
                    least one override carries a `to`, because pointing three jobs at a pool by
                    name is a migration too.
                workflows:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                  description: >-
                    Narrows a repository to these workflow files, keyed by repository, e.g.
                    {"acme/widgets": [".github/workflows/ci.yml"]}. A repository left out of
                    the map gets every file the mapping would change. A path that is not
                    directly under .github/workflows is rejected.
                title: { type: string, description: Overrides the default pull request title. }
                body: { type: string, description: Overrides the generated body, which lists what moved and what was left alone. }
                commit_message: { type: string, description: Overrides the default commit message. }
                badge:
                  type: boolean
                  default: true
                  description: >-
                    Whether each pull request also adds the "CI has the Zoomies" badge to the
                    repository's README, at the end of the row of badges it already has or on
                    its own line under the title. On unless you say otherwise; a README that is
                    missing, not Markdown, or already carries the badge is left alone and the
                    result says so. The badge never stops a pull request being opened.
      responses:
        "200":
          description: What happened to each repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationOutcome" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Audit
  # ==========================================================================
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: The audit log
      x-zoomies-role: viewer
      parameters:
        - { name: actor_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: action, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }

  /audit/actions:
    get:
      operationId: listAuditActions
      tags: [audit]
      summary: Distinct action names, for the filter menu
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: string } }

  # ==========================================================================
  # Administration
  # ==========================================================================
  /users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 12, format: password, description: Omit for an account that will sign in through OIDC. }
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      operationId: getUser
      tags: [admin]
      summary: Get a user
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      description: Refused if it would leave the instance with no enabled administrator.
      x-zoomies-role: admin
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Reset a user's password
      description: Sets `must_change_password`, so the user picks their own on next sign-in.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 12, format: password }
      responses:
        "204": { description: Reset }

  /users/{id}/two-step:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: resetUserTwoStep
      tags: [admin]
      summary: Reset a user's two-step verification
      description: >-
        For somebody who has lost their authenticator and their recovery codes. Removes the
        key and the codes and ends the account's sessions; audited as `user.two_step_reset`.
      x-zoomies-role: admin
      responses:
        "204": { description: Reset }
        "404": { $ref: "#/components/responses/NotFound" }

  /tokens:
    get:
      operationId: listTokens
      tags: [admin]
      summary: List API tokens
      description: >-
        Metadata only. The token value exists in plaintext exactly once, at creation.
        Your own tokens; everybody's with `tokens:read`, which is the administrator role.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    post:
      operationId: createToken
      tags: [admin]
      summary: Create an API token
      description: |
        A token carries no more than the caller that made it: the role may not
        exceed the caller's, and a caller narrowed by scopes may only mint a
        token narrowed at least as far. The token is attributed to the account
        behind the caller -- the signed-in user, or the owner of the token in
        use -- so disabling or deleting that account ends it too. A token with
        no owner cannot mint tokens; anything wider than the caller is a 422.
        Anybody signed in may mint their own, never above their own role.
        Audited as `token.create`.
      x-zoomies-role: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string, examples: ["prometheus"] }
                role: { $ref: "#/components/schemas/Role" }
                scopes:
                  type: array
                  items: { type: string, examples: ["pools:read", "runners:write"] }
                  description: Optional narrowing within the role. Empty means whatever the role allows.
                expires_in: { type: string, examples: ["2160h"], description: Omit for a token that never expires, which is worth avoiding. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIToken"
                  - type: object
                    properties:
                      token: { type: string, description: Shown once. }

  /tokens/purge:
    post:
      operationId: purgeTokens
      tags: [admin]
      summary: Delete every revoked or expired API token
      description: |
        Removes spent tokens for good: the caller's own by default, one
        account's with `user_id`, or every one the caller can see with `all`.
        A token that still works is never touched, so this is safe to run
        without reading the list first. Each deletion is audited as
        `token.delete`, naming the token's prefix and never its value.
        Giving both `user_id` and `all` is ambiguous and answered with a 422.
        Below administrator only your own may be purged; `user_id` naming
        somebody else, or `all`, is a 403.
      x-zoomies-role: viewer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, description: Purge this account's spent tokens rather than the caller's. }
                all: { type: boolean, description: Purge every spent token the caller can see. }
      responses:
        "200":
          description: The tokens that were deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tokens/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: revokeToken
      tags: [admin]
      summary: Revoke an API token, or delete a spent one
      description: |
        Without `purge`, revokes: the token stops working at once and its row
        stays, marked `revoked`. With `purge=true`, removes a token that is
        already revoked or expired; one that still works is a 409, because
        deleting is tidying up after a revocation and never a quieter way to
        do one. Both are audited (`token.revoke`, `token.delete`) by prefix.
        Below administrator only your own; anybody else's is a 404, as if it
        were not there.
      x-zoomies-role: viewer
      parameters:
        - name: purge
          in: query
          required: false
          schema: { type: boolean }
          description: Delete a revoked or expired token instead of revoking it.
      responses:
        "204": { description: Revoked, or deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /mcp-clients:
    get:
      operationId: listMCPClients
      tags: [admin]
      summary: List MCP clients
      description: >-
        Every OAuth client that may ask for an MCP connection: those an administrator created, those
        that registered themselves, and those named by a client ID metadata document. Secrets are
        never returned after creation.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MCPClient" } }
    post:
      operationId: createMCPClient
      tags: [admin]
      summary: Create an MCP client
      description: >-
        A client ID -- and, when `confidential`, a secret shown once -- to type into an MCP client's
        OAuth settings, such as Claude's custom connector form. Redirect URIs default to Claude's,
        `https://claude.ai/api/mcp/auth_callback`; each must be https or http to loopback. A
        confidential client proves its secret at the token endpoint and still uses PKCE.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: ["Claude"] }
                redirect_uris:
                  type: array
                  items: { type: string, examples: ["https://claude.ai/api/mcp/auth_callback"] }
                confidential: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPClient" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /mcp-clients/{id}/secret:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      operationId: rotateMCPClientSecret
      tags: [admin]
      summary: Rotate a confidential MCP client's secret
      description: The old secret stops working at once; the new one is in this response and nowhere else.
      x-zoomies-role: admin
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPClient" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /mcp-clients/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: revokeMCPClient
      tags: [admin]
      summary: Revoke an MCP client
      description: The client can no longer ask, and every connection it holds ends. Audited as `mcp_client.revoke`.
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /mcp-connections:
    get:
      operationId: listMCPConnections
      tags: [admin]
      summary: Everybody's MCP connections
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MCPConnection" } }

  /mcp-connections/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    delete:
      operationId: revokeMCPConnection
      tags: [admin]
      summary: End somebody's MCP connection
      x-zoomies-role: admin
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /recovery:
    get:
      operationId: getRecovery
      tags: [recovery]
      summary: Whether this fleet is held for recovery
      description: >-
        A restored database is marked for recovery, and a controller that reads that mark
        decides as normal and applies none of it: no runner is created, drained or
        removed, nothing is reaped from GitHub, and the fallback poller does not sweep.
        The plan is still computed and published, so an operator can see exactly what
        would happen the moment the fence is lifted -- and can tell "nothing to do" from
        "not allowed to". A fenced instance answers `/readyz` with 503; liveness is
        unaffected, so its container runtime does not restart it.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  /recovery/unfence:
    post:
      operationId: unfence
      tags: [recovery]
      summary: Lift the recovery fence
      description: >-
        A person saying that a recovered fleet has been checked and may act on the world
        again. It is audited under its own action, because the audit log is where somebody
        later asks who decided that and when. Lifting an unfenced instance succeeds and
        changes nothing: two operators recovering one fleet will both press it.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recovery" }

  # ==========================================================================
  # Backups
  # ==========================================================================
  # Every route here is admin, and a backup is the whole database: every
  # account's password hash and every sealed credential. The upload is bounded
  # by its own handler rather than the API's ordinary body limit.
  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: Every backup, and the state of the schedule
      description: >-
        The backups in `backup.directory` and the copies the store took before
        migrating, newest first, each with what its manifest says and whether a
        restore of it would be refused; the schedule and its last outcome; the
        restore waiting for a restart, if any; and what became of the last one.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backups" }
    post:
      operationId: takeBackup
      tags: [backups]
      summary: Take a backup now
      description: >-
        A consistent copy of the live database, taken with `VACUUM INTO`, checked
        with `PRAGMA integrity_check`, and written with its manifest into
        `backup.directory`. Retention (`backup.keep`) runs afterwards. Refused with
        409 while another backup is being taken.
      x-zoomies-role: admin
      responses:
        "201":
          description: Taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { $ref: "#/components/responses/Conflict" }

  /transfers/preparation:
    get:
      operationId: getTransferPreparation
      tags: [backups]
      x-zoomies-role: platform
      summary: Follow complete instance preparation
      responses:
        "200":
          description: Current drain and cleanup progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferProgress" }
    post:
      operationId: prepareInstanceTransfer
      tags: [backups]
      x-zoomies-role: platform
      summary: Drain this instance for transfer
      description: >-
        Stops new runner and machine demand without changing saved pool settings. Busy jobs finish naturally. Idle runners withdraw safely, cleanup continues, and the recovery fence is raised automatically when no work is in flight. Preparation survives a restart. Requires process operator authority.
      responses:
        "202":
          description: Preparation started or already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferProgress" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelInstanceTransfer
      tags: [backups]
      x-zoomies-role: platform
      summary: Cancel preparation before cutover
      description: >-
        Once fenced, use the explicit recovery action after checking no destination is running.
      responses:
        "204":
          description: Preparation cancelled
        "409": { $ref: "#/components/responses/Conflict" }

  /transfers/export:
    post:
      operationId: exportInstanceTransfer
      tags: [backups]
      x-zoomies-role: platform
      summary: Export a complete portable instance
      description: >-
        Requires a drained, fenced source. All database records and fleet credentials travel under a disposable transfer key inside the encrypted archive. The source encryption key and configuration file do not travel. Stop the source controller before cutover and keep it stopped while the destination runs. Requires process operator authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, format: password, minLength: 8, maxLength: 4096 }
      responses:
        "200":
          description: The encrypted portable archive
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /transfers/import:
    post:
      operationId: importInstanceTransfer
      tags: [backups]
      x-zoomies-role: platform
      summary: Prepare a portable instance for this destination
      description: >-
        Authenticates an encrypted archive, verifies the database and re-seals secrets under this destination's key. Returns inventory counts and a prepared backup without replacing the database. Stage it using the restore endpoint with source_stopped=true, then restart to apply. The destination must be empty and keep its own operator access. Source operator authority and sign-in configuration are invalidated at apply. The imported instance remains fenced. Requires process operator authority.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, passphrase]
              properties:
                file: { type: string, format: binary }
                passphrase: { type: string, format: password, maxLength: 4096 }
      responses:
        "201":
          description: Verified and sealed for this destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "413": { description: The upload is over the limit. }

  /backups/upload:
    post:
      operationId: uploadBackup
      tags: [backups]
      summary: Bring a backup here
      description: >-
        A `multipart/form-data` form with the archive in `file` -- a `.tar.gz` a
        download produced, or the `.tar.gz.enc` an encrypted download produced with
        its `passphrase` in a second part. The archive is unpacked into a staging
        directory, verified as a restore would verify it, and then listed under the
        name its manifest gives it, with its source recorded as uploaded. An upload
        is never counted or removed by retention.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                passphrase: { type: string, format: password }
      responses:
        "201":
          description: Unpacked and verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "413": { description: The upload is over the limit. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/restore:
    delete:
      operationId: cancelRestore
      tags: [backups]
      summary: Cancel the staged restore
      description: Forgets the restore waiting for a restart. Cancelling when none is staged succeeds.
      x-zoomies-role: admin
      responses:
        "204": { description: Cancelled }

  /backups/restore/apply:
    post:
      operationId: applyRestore
      tags: [backups]
      summary: Restart the controller to apply the staged restore
      description: >-
        Stops Zoomies so that its service manager starts the next one,
        which applies the staged restore before it opens the database. The response
        is written before the process stops. Refused with 409 when nothing is
        staged, because a restart with nothing to apply is an outage. Whether the
        process comes back is up to whatever started it; a systemd unit and a
        container with a restart policy both bring it back, and a controller run
        by hand needs starting by hand.
      x-zoomies-role: admin
      responses:
        "202":
          description: Stopping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Restarting" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/restore/outcome:
    delete:
      operationId: dismissRestoreOutcome
      tags: [backups]
      summary: Dismiss what became of the last restore
      x-zoomies-role: admin
      responses:
        "204": { description: Dismissed }

  /backups/offsite:
    post:
      operationId: shipBackups
      tags: [backups]
      summary: Copy the backups to every remote now
      description: >-
        Makes each enabled destination under `backup.remotes` hold what the backup
        directory holds: the remote is listed, whatever it is missing is sent oldest
        first, and its own retention is applied afterwards. It is the pass the
        controller runs by itself after every backup and once an hour; this is the
        way to run it now, which is what an operator who has just fixed a credential
        wants. A destination that refuses is reported in `error` while the others
        still go. Refused with 409 while a pass is already running.
      x-zoomies-role: admin
      responses:
        "200":
          description: The pass ran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupShipment" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/prune:
    post:
      operationId: pruneBackups
      tags: [backups]
      summary: Apply retention now
      description: >-
        Deletes the copies beyond `backup.keep` from the backup directory, and the
        ones beyond each destination's own `keep` from its bucket. Retention
        otherwise runs as part of taking a backup, which leaves a fleet that has
        just lowered `backup.keep` holding the old number until the next one,
        and on a fleet with `backup.interval` off, holding it forever. A copy that
        was uploaded here or fetched back out of a bucket is never counted and
        never removed. The answer lists what went, per destination, and a bucket
        that refused is reported against its own name while the others are still
        pruned. Refused with 409 while a backup or an offsite pass is running.
      x-zoomies-role: admin
      responses:
        "200":
          description: Retention was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPruning" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/remotes:
    post:
      operationId: createBackupRemote
      tags: [backups]
      summary: Add a backup remote
      description: >-
        Stores an S3-compatible destination this fleet copies every backup to.
        The secret key and the passphrase are sealed with the instance encryption
        key before anything else happens to them, and no response ever carries
        them back; the page is told whether each is set, which is the only thing
        it can act on. A destination `backup.remotes` in `zoomies.yaml` already
        names is refused: the file has the last word, and two rows that disagree
        would be worse than one that cannot be added.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRemoteInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRemote" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/remotes/check:
    post:
      operationId: checkDraftBackupRemote
      tags: [backups]
      summary: Test a backup remote before it is saved
      description: >-
        Lists one key under the destination described in the body, so that a
        secret key is proved before it is stored rather than after. A body with
        no `secret_access_key` falls back to the one stored under that name,
        which is how a saved destination is re-tested after its bucket or prefix
        is changed. A destination that refuses is a `200` with `ok: false` and
        the service's own words.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRemoteInput" }
      responses:
        "200":
          description: The check ran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteBackupCheck" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/remotes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: The remote's name, e.g. `offsite`.
    patch:
      operationId: updateBackupRemote
      tags: [backups]
      summary: Change a stored backup remote
      description: >-
        Only the fields the body carries are changed. The two secrets follow the
        credential convention: absent leaves what is stored, a value replaces it,
        and an explicit empty string clears it, which is how a passphrase is
        removed from a destination that should send the plain archive. A
        destination described in `zoomies.yaml` answers `409`: it is changed in
        the file.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRemoteInput" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRemote" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      operationId: deleteBackupRemote
      tags: [backups]
      summary: Remove a stored backup remote
      description: >-
        Forgets the destination. What its bucket holds is left alone: forgetting
        where the copies are is not the same as deciding they should not exist,
        and each one can be deleted from the listing first.
      x-zoomies-role: admin
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/remotes/{name}/copies:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: The remote's name, as `backup.remotes` gives it, e.g. `offsite`.
    get:
      operationId: listRemoteBackups
      tags: [backups]
      summary: What one backup remote holds
      description: >-
        The archives in the remote's bucket and prefix, newest first, read live
        rather than from anything the controller remembers -- the question this
        answers is whether the offsite copy is actually there, and a remembered
        yes is worth nothing. Anything under the prefix that this fleet did not
        write is ignored: a bucket may be shared.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteBackupCopies" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/remotes/{name}/check:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: checkBackupRemote
      tags: [backups]
      summary: Test that a backup remote can be reached
      description: >-
        Lists one key under the remote's prefix, which is the whole of what has to
        work for a backup to reach it: the endpoint resolves, TLS agrees, the
        signature is accepted, the bucket exists and the policy allows reading it.
        A remote that refuses is a 200 with `ok: false` and the service's own
        refusal in `error` -- the check ran, and what it found is the result.
      x-zoomies-role: admin
      responses:
        "200":
          description: The check ran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteBackupCheck" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/remotes/{name}/copies/{id}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The backup's id, e.g. `zoomies-20260916-120000`.
    delete:
      operationId: deleteRemoteBackup
      tags: [backups]
      summary: Remove one copy from a backup remote
      description: >-
        Deletes the archive from the bucket. Audited like deleting a local backup,
        and for a stronger reason: the offsite copy is the one that exists because
        the local ones might not.
      x-zoomies-role: admin
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/remotes/{name}/copies/{id}/fetch:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: fetchRemoteBackup
      tags: [backups]
      summary: Bring one copy back from a backup remote
      description: >-
        Downloads the archive, decrypts it with the remote's passphrase -- or the
        one in the body, for an archive sealed with a passphrase this configuration
        no longer carries -- and unpacks it into the backup directory, verified
        exactly as an upload is. It is then an ordinary backup, restorable through
        the same staging as any other. There is deliberately no "restore from the
        bucket": a restore swaps the database this fleet runs on, and the copy it
        swaps in should be one somebody has seen land and verified first.
      x-zoomies-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                passphrase: { type: string, format: password }
      responses:
        "201":
          description: Fetched and verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The backup's directory name, e.g. `zoomies-20260916-120000`.
    get:
      operationId: getBackup
      tags: [backups]
      summary: One backup
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBackup
      tags: [backups]
      summary: Delete a backup
      description: Refused with 409 while the backup is staged to be restored.
      x-zoomies-role: admin
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /backups/{id}/verify:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyBackup
      tags: [backups]
      summary: Re-read a backup and check it
      description: >-
        Compares the database's digest with the one the manifest recorded, opens it,
        runs `PRAGMA integrity_check`, and says whether this build could restore it.
        A POST because it reads the whole file.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupVerification" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadBackup
      tags: [backups]
      summary: Download a backup as a gzipped tar
      description: >-
        The backup's directory -- manifest, database and, only when it was taken
        with it, the encryption key -- as `<id>.tar.gz`. Audited: it is the whole
        database leaving the machine.
      x-zoomies-role: admin
      responses:
        "200": { description: The archive, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: downloadBackupEncrypted
      tags: [backups]
      summary: Download a backup encrypted with a passphrase
      description: >-
        The same archive, encrypted as `<id>.tar.gz.enc`: the passphrase is run
        through argon2id and the archive through AES-256-GCM in chunks, so a file
        cut short or altered does not open as a shorter backup. The upload route
        takes the same passphrase to bring it back.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: { type: string, format: password, minLength: 8 }
      responses:
        "200": { description: The encrypted archive, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /backups/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: stageRestore
      tags: [backups]
      summary: Stage a restore of this backup for the next restart
      description: >-
        Nothing is restored by this call. The controller cannot swap the database it
        is running on, so every check a restore makes is made now -- the copy is
        sound, this build can read it, and this host's encryption key is the one that
        sealed it -- and the restore is written down beside the database for the next
        controller to apply before it opens anything. `POST /backups/restore/apply`
        is the restart that does it. The restored fleet comes back fenced, with
        every session ended and every unredeemed join token removed; the two options
        go further, as `zoomies restore`'s flags do.
      x-zoomies-role: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source_stopped: { type: boolean, description: Required for complete transfers; confirm the source controller is stopped and will remain stopped. }
                revoke_api_tokens: { type: boolean, description: Revoke every API token as well. }
                reset_agent_tokens: { type: boolean, description: Forget every host's agent credential, so each agent joins again. }
      responses:
        "202":
          description: Staged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StagedRestore" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /diagnostics/bundle:
    get:
      operationId: getSupportBundle
      tags: [diagnostics]
      summary: A support bundle for this instance
      description: >-
        Everything a bug report needs about this instance in one JSON document: the
        build and the process, the effective configuration and its findings, the current
        problems, the fleet's installations, pools, hosts and runners, the work in flight
        with the controller's own explanation for each of it, and the recent scheduler
        decisions. It is assembled from the same renderings the other routes serve, so a
        section that is secret-free on its own route is secret-free here.


        It never carries workflow log bodies. There is no redaction pass for them and
        there cannot be a reliable one, so the bundle carries runner ids and the download
        route instead and an operator attaches logs deliberately.


        Assembly is section by section: a section that fails costs its own contents and
        lands in `errors` rather than failing the whole document, because the moment a
        bundle is taken is the moment a query is most likely to fail. Sections are capped
        by row count and the whole document by bytes; anything shortened says so in
        `truncated`.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportBundle" }

  /settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: The effective configuration, key by key
      description: >-
        Every key with its value, its kind, the layer it came from and whether it
        can be changed here, plus the same configuration as a nested object. No
        secret's value is ever sent. The validator's findings are included so the
        UI can show each one next to the setting it concerns.
      x-zoomies-role: admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Change this fleet's settings
      description: |
        Keys may be sent nested (`{"retention":{"jobs":"720h"}}`) or dotted
        (`{"retention.jobs":"720h"}`). A `null` value clears the stored setting,
        so the key goes back to whatever the configuration file or the built-in
        default says.

        Every key is checked before any is written, and the whole request is
        refused if one fails, including when the result would be a controller
        that will not start, which the validator is asked about before anything
        is stored.

        An accepted change is always kept. One the running process can apply
        does so at once; one it cannot (rebinding the listener, rebuilding the
        backends) is stored and named in `pending_restart`.

        Refused: a key that is read before the database opens, one that belongs
        to a standalone agent's own host, and one an environment variable is
        pinning. Each refusal says which it is and what to do instead.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /settings/export:
    get:
      operationId: exportSettings
      tags: [admin]
      summary: Every setting somebody has set, as a file
      description: >-
        Stored here, set in the configuration file, or pinned by the environment;
        never a default, because those are computed on the host that reads them,
        and never a secret's value. `format=json` wraps the tree with when it was
        taken, where from, and which secrets were configured but not exported;
        `format=yaml` is the tree alone, in the shape zoomies.yaml takes, so the
        download can be started from. Audited.
      x-zoomies-role: admin
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, yaml], default: json } }
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsExport" }
            application/yaml:
              schema: { type: string }

  /settings/import:
    post:
      operationId: importSettings
      tags: [admin]
      summary: Read an export or a zoomies.yaml back, previewing first
      description: >-
        Every key in the document is planned through the checks a PATCH makes and
        reported as `change`, `unchanged`, `unset` or `refused` with the reason. A
        dry run reports and writes nothing. A real run refuses the whole document
        with 422 while any key is refused, so an import is one change or none;
        `skip` names the keys to leave out. Applying returns the settings page too.
      x-zoomies-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsImportRequest" }
      responses:
        "200":
          description: The preview, or the result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsImport" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ==========================================================================
  # Updates
  # ==========================================================================
  /updates:
    get:
      operationId: getUpdates
      tags: [updates]
      summary: What an update would take
      description: >-
        The update mode and soak, the build that is running, the newest release that can be
        installed on this system, whether that is newer than the build, and when the mode
        would take it, with the sentence that says why. It answers 200 whatever the mode:
        with `mode: off` it names no release and says how to turn updating on, and until the
        list of releases has been read it says that, because a list nobody has read and a
        list with nothing in it that can be installed are different things to be told. A
        build that is not from a release is left alone, and the sentence says so. It changes
        nothing. The same document is the payload of the `updates.updated` event. Below the
        `platform` role the text of the controller's last attempt is a fixed sentence for its
        state, in the response and in the event alike, because the real text can name a path
        on the controller's host.
      x-zoomies-role: viewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }

  /updates/check:
    post:
      operationId: checkForUpdates
      tags: [updates]
      summary: Ask GitHub for the release list now
      description: >-
        Reads the list of releases from GitHub instead of waiting for the scheduled check, and
        answers with the status it leaves. At most one request goes to GitHub a minute: a press
        inside the minute is not an error, and answers the status as it stands. Refused with
        `update.check_disabled` while `updates.check_interval` is `0`, which is the setting that
        keeps this controller from ever asking, and with `update.check_failed` (502) when GitHub
        or the network to it would not let the read finish. Takes no body.
      x-zoomies-role: admin
      responses:
        "200":
          description: The status once the list has been read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/UpdateRefused" }
        "502": { $ref: "#/components/responses/UpdateCheckFailed" }

  /updates/controller:
    post:
      operationId: updateController
      tags: [updates]
      summary: Update the controller
      description: >-
        Asks the update helper installed on the controller's host to replace the controller's
        binary with the newest release that can be installed on this system, or with `tag`. It
        answers 202 with the status, which holds the attempt it opened: the helper answers on its
        own time, and the page follows the attempt in `updates.updated`. Everything that can
        refuse does so before anything is written, so a refusal leaves nothing in flight. The
        release has to be one in the list the controller last read, complete for this system and
        newer than the running build; `check` reads the list again. Audited as
        `update.controller_requested` once it is accepted, and not before.
      x-zoomies-role: platform
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateControllerRequest" }
      responses:
        "202":
          description: Asked for. The `controller` attempt is `requested`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/UpdateRefused" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /updates/hosts:
    post:
      operationId: startHostRollout
      tags: [updates]
      summary: Update the hosts, one at a time
      description: >-
        Starts a rollout that takes every host behind this controller's release to it, or only
        the hosts `host_ids` names. It answers 202 with the status, whose `rollout` is the one
        just started: nothing is asked of a host here, and the controller moves the rollout on
        from its next pass, one host at a time, waiting for each to report the release before it
        asks the next. A host's failed or timed-out update halts the rollout until an
        administrator resumes or cancels it. Refused with `update.rollout_halted` while a halted
        rollout waits for a person, `update.in_progress` while one is running,
        `update.nothing_newer` when no host asked for is behind, and `update.host_cannot_update`
        when none of those behind can update itself. An id that names no host is a 422 on
        `host_ids` whose message names it, and so is an empty list or an empty id. Audited as
        `update.rollout_started` once it is accepted, and not before.
      x-zoomies-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartHostRolloutRequest" }
      responses:
        "202":
          description: Started. The `rollout` is `running`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/UpdateRefused" }
        "413": { description: The body is over the 64 KiB this route reads. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /updates/rollout/resume:
    post:
      operationId: resumeRollout
      tags: [updates]
      summary: Let a halted rollout carry on
      description: >-
        Lets the open rollout carry on after it halted. The failure it halted on stays on the
        host's attempt, and that host waits out its retry while the rollout goes on to the next.
        A rollout that is already running is left as it is. It answers 202 with the status, because
        the next host is asked on the controller's next pass and not here. With no open rollout it
        is a 404. Takes no body; a field sent is a 422 naming it. Audited as
        `update.rollout_resumed` once it is accepted.
      x-zoomies-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: Resumed. The `rollout` is `running`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UpdateRefused" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /updates/rollout:
    delete:
      operationId: cancelRollout
      tags: [updates]
      summary: Stop the rollout
      description: >-
        Ends the open rollout, running or halted. An update a host's helper has already been
        handed finishes by itself and is recorded; nothing new starts for the rollout, and in
        `auto` mode the controller does not start that release's rollout again by itself. It
        answers 200 with the status, whose `rollout` is the one just `cancelled`. With no open
        rollout it is a 404. Audited as `update.rollout_cancelled` once it is accepted.
      x-zoomies-role: admin
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UpdateRefused" }

  # ==========================================================================
  # Agent routes
  # ==========================================================================
  # The half of the API agents talk to. These carry an agent token, never a
  # user session, and an agent can reach nothing else. They are here so that
  # this document is the whole surface it says it is, and marked x-internal
  # because no general client should call them: the wire types are owned by
  # internal/agent/protocol.go, and a client generator should skip them.
  /agent/join:
    post:
      operationId: agentJoin
      tags: [agent]
      x-internal: true
      summary: Redeem a join token and enrol a host
      description: >-
        The one anonymous agent route, because it is the call that mints the credential every
        other one carries. The join token is single-use and short-lived; the agent token in
        the response is shown exactly once, and the controller keeps only its hash.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentJoinRequest" }
      responses:
        "200":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentJoinResponse" }
        "409": { $ref: "#/components/responses/LimitReached" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /agent/heartbeat:
    post:
      operationId: agentHeartbeat
      tags: [agent]
      x-internal: true
      summary: Report that the host is alive, and what its runners are doing
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHeartbeatRequest" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHeartbeatResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The host was deleted. No amount of retrying brings the row back; the agent re-joins. }
        "413": { description: The report carried more runners than any host runs (agent.MaxRunnersPerReport). The agent is misbehaving. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agent/tasks:
    get:
      operationId: agentPollTasks
      tags: [agent]
      x-internal: true
      summary: Long-poll for work
      description: Blocks until the host has work or the wait elapses, so a task reaches an agent the instant it is queued while an idle agent makes two or three requests a minute. A host holds one poll at a time; a second, while the first is held, is answered at once with an empty batch.
      security: [{ agentAuth: [] }]
      parameters:
        - name: wait
          in: query
          description: Seconds to wait for work before answering with an empty batch.
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: The tasks queued for this host, possibly none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTaskBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/results:
    post:
      operationId: agentReportResult
      tags: [agent]
      x-internal: true
      summary: Report the outcome of one task
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTaskResult" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agent/report:
    post:
      operationId: agentReportRunners
      tags: [agent]
      x-internal: true
      summary: Report what the host's runners are doing, outside a heartbeat
      description: The body is a bare array of runner reports, because that is what the agent sends and the two halves of the protocol must agree.
      security: [{ agentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RunnerReport" }
      responses:
        "204": { description: Applied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: The report carried more runners than any host runs (agent.MaxRunnersPerReport). The agent is misbehaving. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /agent/logs/{stream_id}:
    post:
      operationId: agentRelayLogs
      tags: [agent]
      x-internal: true
      summary: Relay a runner's output to a viewer
      description: >-
        The inverted half of log streaming. The controller never dials an agent, so a viewer's
        request makes it queue a stream_logs task, and the agent answers by opening this
        chunked POST, which stays open for as long as the runner produces output. Exempt from
        the body-size limit for that reason; instead each stream has a byte budget, and output
        over it is read and dropped rather than waited on.
      security: [{ agentAuth: [] }]
      parameters:
        - { name: stream_id, in: path, required: true, schema: { type: string }, description: The stream named by the stream_logs task. }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: The stream ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Nobody is watching this stream any more; the agent stops sending. }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zoomies_session
      description: Set by `POST /auth/login`. HttpOnly, SameSite=Lax, and Secure when the external URL is https.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zoo_<prefix>_<secret>
      description: An API token. Not subject to the same-origin check, because it is not vulnerable to CSRF.
    agentAuth:
      type: http
      scheme: bearer
      bearerFormat: zooagent_<secret>
      description: >-
        An agent's own token, minted by `POST /agent/join`. Accepted on `/agent/*` only: a
        user credential is refused there, and an agent token is refused everywhere else.

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The resource ID, e.g. `pool_k3f9qz2m`.
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Sort:
      name: sort
      in: query
      description: A column name. An unknown value falls back to the default rather than erroring, so a stale bookmark does not break the page.
      schema: { type: string }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }

  responses:
    Unauthorized:
      description: Not signed in, or the credential was rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Signed in, but the role is not sufficient. The message says which role is needed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UpdateRefused:
      description: >-
        The update was refused, and the code says why: `update.mode_off` while `updates.mode` is
        off, `update.check_disabled` while `updates.check_interval` is 0, `update.helper_missing`
        when no update helper can carry it out, `update.in_progress` while an update is already open
        for the same target, `update.not_a_release` for a build that did not come from a release,
        `update.nothing_newer` when there is no newer release to take or the tag asked for is not
        one, `update.host_cannot_update` for a host whose agent cannot update itself, and
        `update.rollout_halted` while a halted rollout waits for a person. A controller that may
        not act (it is fenced for recovery, or another holds the lease) is the plain `conflict`.
        The message says what stopped it and what to change.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UpdateCheckFailed:
      description: >-
        GitHub, or the network to it, would not let the release check finish, and nothing has changed.
        The code is `update.check_failed` and the message says what failed and what to try: that the
        controller may need an outbound HTTPS rule to `api.github.com`, or that GitHub answered with a
        status and the check can be tried again later. It is the controller's upstream that failed and
        not the controller, so it is a 502 and is logged as a warning.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    LimitReached:
      description: >-
        One of the `limits.*` ceilings has been reached. The code is `limit_reached`, and the message and
        `field` name the setting. Nothing resent will succeed until a resource is removed or the setting is raised.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: The request was understood but is not valid. `errors` names the fields.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  errors: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
    RateLimited:
      description: Too many attempts. Retry-After says how long to wait.
      headers:
        Retry-After:
          description: Seconds until the address is allowed another attempt.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    AIContextMaintenanceRequest:
      type: object
      required: [mode, revision]
      properties:
        mode: { type: string, enum: [reinstall, amend, remove] }
        revision: { type: integer, format: int64 }
        plan_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        config: { $ref: "#/components/schemas/AIContextRepository/properties/config" }
    AIContextSetupPreview:
      type: object
      required: [revision, base_commit, branch, plan_hash, files]
      properties:
        mode: { type: string }
        config: { $ref: "#/components/schemas/AIContextRepository/properties/config" }
        previous_hash: { type: string }
        revision: { type: integer, format: int64 }
        base_commit: { type: string }
        branch: { type: string }
        plan_hash: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, mode, previous_sha, content]
            properties:
              path: { type: string }
              mode: { type: string, enum: ["100644", "100755"] }
              previous_sha: { type: string }
              content: { type: string }
              delete: { type: boolean }
        setup:
          type: object
          required: [repository_id, revision, plan_hash, state, pr_number, pr_url]
          properties:
            repository_id: { type: string }
            revision: { type: integer, format: int64 }
            plan_hash: { type: string }
            state: { type: string, enum: [pending, awaiting_merge] }
            pr_number: { type: integer }
            pr_url: { type: string }
    AIContextSourcePage:
      type: object
      required: [commit, snapshot]
      properties:
        commit: { type: string }
        snapshot: { type: string }
        total: { type: integer }
        omitted_total:
          type: integer
          description: How many files the snapshot lists but does not carry. Present on every page, searches included, whenever it is not zero; results from such a snapshot say nothing about those files.
        next_offset: { type: integer }
        files:
          type: array
          items:
            type: object
            required: [path, bytes, lines]
            properties:
              path: { type: string }
              bytes: { type: integer, description: The file's size; for an omitted file, its size in Git. }
              lines: { type: integer }
              omitted:
                type: string
                enum: [too_large, over_budget, flagged]
                description: Set when the file exists in the source but its content is not in the snapshot. too_large is over the 1 MiB per-file limit, over_budget was dropped (largest first) to fit the file-count and size limits, flagged was withheld by the generator's secret scan.
        excerpts:
          type: array
          items:
            type: object
            required: [path, text, offset, next_offset]
            properties:
              path: { type: string }
              text: { type: string }
              offset: { type: integer }
              next_offset: { type: integer, nullable: true }
              omitted:
                type: string
                enum: [too_large, over_budget, flagged]
                description: Set instead of text when the file is listed but not carried. Read it from the source if it is needed.
              bytes: { type: integer, description: The omitted file's size in Git. }
        matches:
          type: array
          items:
            type: object
            required: [path, line, text]
            properties:
              path: { type: string }
              line: { type: integer }
              text: { type: string }
    AIContextReaderPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, full_name, instructions, badge_markdown]
            properties:
              id: { type: string }
              full_name: { type: string }
              instructions: { type: string }
              badge_markdown: { type: string }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AIContextInstallations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, target, target_type]
            properties:
              id: { type: string }
              target: { type: string }
              target_type: { type: string, enum: [org, repo] }
    AIContextNote:
      type: object
      required: [id, repository_id, slug, version, kind, title, source_commit, author_name, via_kind, created_at]
      properties:
        id: { type: string }
        repository_id: { type: string }
        slug: { type: string }
        version: { type: integer }
        kind: { type: string, enum: [report, plan, note] }
        title: { type: string }
        body: { type: string, description: "Markdown an assistant wrote; untrusted. Left out of listings." }
        source_commit: { type: string, description: The verified commit the repository's context was at when this was published. }
        author_name: { type: string, description: The person the note was published for. }
        via_kind: { type: string, enum: [user, token, connection] }
        via_name: { type: string, description: The MCP client or API token it came through. }
        created_at: { type: string, format: date-time }
        versions: { type: integer, description: How many versions are kept; on listings only. }
    AIContextMembers:
      type: object
      required: [user_ids]
      properties:
        user_ids: { type: array, maxItems: 200, uniqueItems: true, items: { type: string } }
    AIContextConnectionSelection:
      type: object
      required: [items, total, limit, offset, selected_repository_ids, publish_repository_ids]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, full_name]
            properties:
              id: { type: string }
              full_name: { type: string }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        selected_repository_ids: { type: array, maxItems: 100, items: { type: string } }
        publish_repository_ids: { type: array, maxItems: 100, items: { type: string }, description: The selected repositories this connection may also publish notes to. }
    AIContextRepository:
      type: object
      required: [id, repository, full_name, config, revision, workflow_outdated, available, created_at, updated_at]
      properties:
        id: { type: string }
        repository:
          type: object
          required: [github_host, installation_id, repository_id]
          properties:
            github_host: { type: string }
            installation_id: { type: string }
            repository_id: { type: integer, format: int64 }
        full_name: { type: string }
        instructions: { type: string }
        badge_markdown: { type: string }
        config:
          type: object
          required: [source_branch, destination, exclude, keep_snapshots]
          properties:
            source_branch: { type: string }
            destination: { type: string, enum: [repository, zoomies, both] }
            exclude: { type: array, items: { type: string } }
            keep_snapshots: { type: integer, minimum: 1, maximum: 100 }
            readme_badge: { type: boolean, deprecated: true, description: "Legacy field; the README badge is automatic." }
            setup_generation: { type: integer, format: int64 }
            disabled: { type: boolean }
            upload_url: { type: string, readOnly: true, description: "Set by the controller for Zoomies-only output: where the workflow uploads, and the audience of its OIDC token. Any value a client sends is replaced." }
        revision: { type: integer, format: int64 }
        freshness:
          type: object
          required: [state, desired_commit, published_commit, snapshot_id, checked_at]
          properties:
            state: { type: string, enum: [awaiting_merge, unavailable, stale, ready] }
            desired_commit: { type: string }
            published_commit: { type: string }
            snapshot_id: { type: string }
            checked_at: { type: string, format: date-time }
            failure: { type: string }
        diagnosis: { $ref: "#/components/schemas/AIContextDiagnosis" }
        setup_state: { type: string, enum: [pending, awaiting_merge] }
        setup_pr_url: { type: string }
        workflow_outdated: { type: boolean, description: "True while the installed workflow is exactly one an earlier release wrote. It still works and is still trusted; Reinstall / repair moves it to the current generator. Set by the last verification that reached the workflow, so it can lag a merge until the next check." }
        available: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AIContextDiagnosis:
      type: object
      description: >-
        Why the last run of the repository's managed workflow did not publish, read
        from GitHub by the controller. Present only while the context is behind and
        the newest run for the commit it is waiting on failed; absent otherwise,
        including when the run could not be read. It is never stored, and no line of
        the run's log is ever copied into it.
      required: [cause, title, detail, fix, failed_at, observed_at]
      properties:
        cause:
          type: string
          description: A closed set, so a client can switch on it. The problem code is `ai_context.` followed by the cause, except `unknown`, which is `ai_context.run_failed`.
          enum: [artifact_quota, artifact_upload_failed, runner_unavailable, startup_failed, setup_failed, oversized_file, too_much_source, generation_refused, publication_refused, delivery_failed, timed_out, unknown]
        title: { type: string, description: What happened, in a few words. }
        detail: { type: string, description: What happened and why, in full. }
        fix: { type: string, description: What to change. }
        action:
          type: string
          description: The control on the page that is the way out, when there is one.
          enum: [repair, exclusions]
        commit: { type: string, description: The trusted-branch commit the run was for. }
        run_url: { type: string, description: The run on GitHub. }
        failed_at: { type: string, format: date-time, description: When the run ended. }
        observed_at: { type: string, format: date-time, description: When Zoomies last read it. }
        retry:
          type: object
          description: What Zoomies will do about it without being asked.
          required: [automatic, attempts_left]
          properties:
            automatic: { type: boolean, description: Whether Zoomies will start the workflow again on its own. }
            next_at: { type: string, format: date-time, description: When it will next try. }
            attempts_left: { type: integer, description: How many more times it will start the workflow for this commit. }
    # --- primitives -------------------------------------------------------
    Role:
      type: string
      enum: [viewer, operator, admin, platform]
      description: >-
        What an identity may do. `platform` is above `admin` and belongs to
        whoever runs the process rather than the fleet; on an instance where
        one team does both, the account that installed it holds it.
    TargetType:
      type: string
      enum: [org, repo]
    BackendKind:
      type: string
      enum: [docker, podman, process]
    PullPolicy:
      type: string
      enum: [if-not-present, always, pinned-only]
      default: if-not-present
      description: pinned-only requires an image@sha256 digest and rejects mutable tags.

    DockerMode:
      type: string
      enum: [none, dind, host-socket]
      description: |
        How much Docker a job on this pool gets.
        `none` is the default and the only one that is not a warning.
        `dind` gives a private, privileged sidecar daemon.
        `host-socket` hands the job the host's daemon, and with it root on the host.
        Either of those switches a pool on the stock `ghcr.io/eyupio/zoomies-runner`
        image to `ghcr.io/eyupio/zoomies-runner-docker` under the same tag as it is
        saved, because the stock image has no client for the daemon. That covers
        every tag this build publishes: the channels, and the operating-system
        aliases. A digest, a tag from some other build, or an image of your own is
        left as given, and a pool left on one raises `pool.docker_client_missing`.
    RunnerState:
      type: string
      enum: [provisioning, registering, idle, busy, draining, removed, failed]
    JobState:
      type: string
      enum: [waiting, queued, in_progress, completed]
    Severity:
      type: string
      enum: [error, warning, info]
    Duration:
      type: string
      description: A Go duration string.
      examples: ["5m", "1h30s"]

    Page:
      type: object
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: Rows matching the filter, not rows returned. }
        limit: { type: integer }
        offset: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, unprocessable, too_large, rate_limited, limit_reached, update.mode_off, update.check_disabled, update.helper_missing, update.in_progress, update.not_a_release, update.nothing_newer, update.host_cannot_update, update.rollout_halted, update.check_failed, assistant.provider_failed, internal]
            message: { type: string, description: Written for a person to read, and to act on. }
            field: { type: string, description: "The form field at fault, or on a `limit_reached` refusal the `limits.*` setting that refused." }
            detail: { type: string }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, examples: [labels] }
        message: { type: string, examples: ["a pool needs at least one label your workflows can ask for"] }

    HostExclusion:
      type: object
      required: [host, code, reason]
      properties:
        host: { type: string, examples: [zoomies-12vcpu-31gb-debian-12] }
        code:
          type: string
          description: >-
            Which placement rule turned this host down. `profile` is the host's runner
            profile and the pool's size disagreeing: its minimum is above a size the pool
            states, or its standard is below the floor of a pool that takes its size from
            the host.
          enum: [unavailable, backend, platform, size, profile, reduced]
        reason:
          type: string
          description: A sentence about the host with its name left out, so a caller can put the name where its own layout wants it.
          examples: ["it has 12 CPU to place on, and one runner of this pool is charged 16, twice what it asks for, because a docker-in-docker runner is charged for its sidecar too"]

    SettingSource:
      type: string
      enum: [default, file, database, environment]
      description: >-
        Which layer set a value. They stack in that order -- the built-in defaults, then
        zoomies.yaml, then this fleet's database, then `ZOOMIES_*` in the environment --
        and each wins over the one before it.

        It is the answer to the question that makes a configuration problem hard: "I
        changed it and nothing happened". A value the environment is pinning cannot be
        changed from the file or from this API, and one stored in the database is not
        changed by editing the file.

    Remedy:
      type: object
      description: >-
        A change a problem proposes, as the update that makes it, with what the
        controller priced it at. Apply it with `POST /problems/apply`; the `body` is
        informational, since the controller applies what it currently proposes and
        not what a client sends.
      required: [id, label, kind, target_id, body]
      properties:
        id:
          type: string
          description: >-
            Names this exact change. Send it back so an apply is for what was shown;
            a different proposal has a different ID.
          examples: [rem_3f9a2c71b0de]
        label: { type: string, description: The button, in a few words., examples: [Give the sidecar 20% of the CPU] }
        effect:
          type: string
          description: What it was priced at, said before it is applied.
          examples: [the pool's hosts keep room for all 6 runners]
        kind:
          type: string
          enum: [pool.update, host.update]
          description: Which update this is, and so which role may apply it.
        target_id: { type: string, description: The pool or host it changes. }
        body:
          type: object
          additionalProperties: true
          description: The request of that update.
    AutoAppliedChange:
      type: object
      required: [id, at, code, label, kind, target_id, undone, undoable]
      properties:
        id: { type: string, description: The change's ID, which `undo` takes. }
        at: { type: string, format: date-time }
        code: { type: string, description: The problem that proposed it., examples: [pool.queue_wait_high] }
        label: { type: string, description: The change, in a few words., examples: [Keep 2 runners warm] }
        effect: { type: string, description: What it was priced at when it was made. }
        kind:
          type: string
          enum: [pool.update, host.update]
        target_id: { type: string, description: The pool or host it changed. }
        undone: { type: boolean }
        undoable: { type: boolean }
    ShadowedChange:
      type: object
      required: [id, at, code, label, kind, target_id]
      properties:
        id: { type: string }
        at: { type: string, format: date-time, description: When the proposal had stood long enough for shadow mode to record it. }
        code: { type: string, examples: [pool.daemon_share_suggested] }
        label: { type: string, description: The change, in a few words. }
        effect: { type: string, description: What it was priced at. }
        kind:
          type: string
          enum: [pool.update, host.update]
        target_id: { type: string, description: The pool or host it would have changed. }
    AutoAppliedList:
      type: object
      required: [enabled, mode, items, would_apply]
      properties:
        enabled: { type: boolean, description: Whether automatic apply is making changes now, which is `mode` being `on`. }
        mode:
          type: string
          enum: [off, shadow, "on"]
          description: Off does nothing, shadow records what it would have changed, on makes the changes.
        items:
          type: array
          items: { $ref: "#/components/schemas/AutoAppliedChange" }
        would_apply:
          type: array
          description: What shadow mode recorded in the last 30 days, newest first.
          items: { $ref: "#/components/schemas/ShadowedChange" }
    KennelSeverity:
      type: string
      enum: [error, warning, info]
      description: >-
        How much a finding matters. An error is a stranger, or a fault, that can already hurt the
        fleet or stop CI; a warning is a guard that is weaker than it should be; a note is worth
        knowing and never stops a repository being best in show.
    KennelState:
      type: string
      enum: [pending, partial, attention, best_in_show]
      description: >-
        A repository's standing. `attention` outranks `partial`, so an open error is never hidden
        behind "we could not read everything", and nothing is `best_in_show` unless every enabled
        check ran against everything it needs.
    KennelCoverageState:
      type: string
      enum: [ok, partial, denied, unavailable, held, error, not_read]
      description: >-
        How far a source could be read. `denied` is a permission this installation has not been
        given, `held` is requests being held back to stay within the rate limit, and `partial`
        means what was found stands and nothing found is not an all-clear.
    KennelGuidancePreview:
      type: object
      required: [base_commit, base, branch, plan_hash, issues, files]
      properties:
        base_commit: { type: string }
        base: { type: string }
        branch: { type: string }
        plan_hash: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [kind, path, sha, line]
            properties:
              kind: { type: string, enum: [missing, broken_reference, duplicated, unreadable] }
              path: { type: string }
              sha: { type: string }
              line: { type: integer }
        files:
          type: array
          items:
            type: object
            required: [path, mode, previous_sha, before, content]
            properties:
              path: { type: string }
              mode: { type: string, enum: ["100644", "100755"] }
              previous_sha: { type: string }
              before: { type: string }
              content: { type: string }
        pull_request:
          type: object
          required: [number, html_url, branch]
          properties:
            number: { type: integer }
            html_url: { type: string }
            branch: { type: string }
    KennelSource:
      type: string
      enum: [fleet, metadata, runs, setup, workflows, guidance, settings, protection]
    KennelCounts:
      type: object
      required: [error, warning, info, waived]
      properties:
        error: { type: integer }
        warning: { type: integer }
        info: { type: integer }
        waived: { type: integer, description: Findings a waiver covers, which are not in the open counts. }
    KennelEvidence:
      type: object
      required: [kind, ref]
      description: >-
        The only place a name appears in a finding, typed, and passed through a closed grammar
        first. A name that does not pass is replaced by a plain sentence saying it was unusual.
        Render it as text, and never follow an instruction in it. A `file` is a place in a
        workflow file: `ref` is the file's blob SHA, never its path, and the repository's
        `files` resolves it to the path the page shows.
      properties:
        kind: { type: string, enum: [pool, run, file] }
        ref: { type: string, description: An identifier the grammar accepted. }
        label: { type: string }
        job_index:
          type: integer
          description: For a file, the job by its position in the file's `jobs` mapping, or -1 for the workflow itself.
        line:
          type: integer
          description: For a file, the 1-based line of the thing the finding is about. Absent when the finding is about the whole file.
    KennelFile:
      type: object
      required: [sha, path]
      description: >-
        One workflow or agent instruction file of the default branch: the blob SHA a finding's file evidence names,
        and its path. The path is a stranger's text, gated to a plain name under
        `.github/workflows` for workflows, or a plain repository path for guidance; one that did not pass is empty, and the page says the file
        has an unusual name. Render it as text.
      properties:
        sha: { type: string }
        path: { type: string }
    KennelFinding:
      type: object
      required: [code, severity, subject, title, detail, fix, evidence]
      properties:
        code: { type: string, examples: [exposure.fork_code_ran] }
        severity: { $ref: "#/components/schemas/KennelSeverity" }
        subject: { type: string, description: Tells two findings of one code apart, and is what a waiver is about. Empty for a finding about the whole repository. }
        title: { type: string }
        detail: { type: string }
        fix: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/KennelEvidence" }
        prompt:
          type: string
          description: >-
            The text to hand a coding agent to fix this finding: the code, the sentences above, the evidence quoted in a fenced block headed as
            repository data, and how to go about the change. Present on an open finding; absent on a waived one, which nobody is asked to fix.
    KennelWaiver:
      type: object
      required: [id, code, subject, severity, reason, by, at, expires_at]
      properties:
        id: { type: string, examples: [kcw_k3f9qz2m] }
        code: { type: string }
        subject: { type: string }
        severity: { $ref: "#/components/schemas/KennelSeverity" }
        reason: { type: string }
        by: { type: string, description: Who made the decision, by name. }
        at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    KennelWaived:
      type: object
      required: [finding, waiver]
      properties:
        finding: { $ref: "#/components/schemas/KennelFinding" }
        waiver: { $ref: "#/components/schemas/KennelWaiver" }
    KennelCoverage:
      type: object
      required: [source, label, state, reason, permission]
      properties:
        source: { $ref: "#/components/schemas/KennelSource" }
        label: { type: string }
        state: { $ref: "#/components/schemas/KennelCoverageState" }
        reason: { type: string, description: One sentence saying why the source is not fully read. Empty when it is. }
        permission: { type: string, description: The GitHub permission this source takes. Empty for what the fleet already knows. }
    KennelSkipped:
      type: object
      required: [code, source, state, reason]
      properties:
        code: { type: string }
        source: { $ref: "#/components/schemas/KennelSource" }
        state: { $ref: "#/components/schemas/KennelCoverageState" }
        reason: { type: string }
    KennelRepository:
      type: object
      required: [id, name, repository_id, installation_id, visibility, state, evaluated_at, next_due_at, counts, complete, coverage, findings, waived, lapsed, skipped, disabled, files, tracking]
      properties:
        id: { type: string, examples: [kcr_k3f9qz2m] }
        name: { type: string, examples: [acme/widgets] }
        repository_id: { type: integer, format: int64, description: GitHub's ID for the repository, which a rename does not change. }
        installation_id: { type: string }
        visibility: { type: string, description: "`public`, `private` or `internal`; empty until GitHub has said." }
        state: { $ref: "#/components/schemas/KennelState" }
        evaluated_at: { type: [string, "null"], format: date-time }
        next_due_at: { type: [string, "null"], format: date-time, description: When the reads from GitHub are next due. Null means they are due now, or that the repository is not tracked and is due for nothing; `tracking` says which. }
        counts: { $ref: "#/components/schemas/KennelCounts" }
        complete: { type: boolean, description: Whether every enabled check ran against everything it needs. }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/KennelCoverage" }
        findings:
          type: array
          description: The open ones, worst first.
          items: { $ref: "#/components/schemas/KennelFinding" }
        waived:
          type: array
          items: { $ref: "#/components/schemas/KennelWaived" }
        lapsed:
          type: array
          description: Waivers that match an open finding and no longer cover it, because they ended or the finding got worse.
          items: { $ref: "#/components/schemas/KennelWaiver" }
        skipped:
          type: array
          description: Checks that did not run, and why.
          items: { $ref: "#/components/schemas/KennelSkipped" }
        disabled:
          type: array
          description: Checks the operator turned off, which are not a gap.
          items: { type: string }
        files:
          type: array
          description: The workflow files a finding's file evidence points into, by blob SHA, with each path as the gate let it through.
          items: { $ref: "#/components/schemas/KennelFile" }
        tracking: { $ref: "#/components/schemas/KennelTracking" }
    KennelTracking:
      type: object
      required: [tracked, reason, by, since]
      description: >-
        Whether Kennel Club is looking at the repository. For one it is not, who stopped it, when
        and why; the three are empty and null otherwise.
      properties:
        tracked: { type: boolean }
        reason: { type: string, description: Why it was stopped, as the person who did it wrote it. }
        by: { type: string, description: Who stopped it, by the name they had then. }
        since: { type: [string, "null"], format: date-time }
    KennelTrackingInput:
      type: object
      required: [tracked]
      additionalProperties: false
      properties:
        tracked: { type: boolean, description: "`true` to start looking at the repository, `false` to stop." }
        reason: { type: string, minLength: 10, maxLength: 500, description: Required to stop, in characters; not read when starting. A line break is allowed; other control characters and direction-changing ones are not. }
    KennelWaiverInput:
      type: object
      required: [code, reason, expires_at]
      additionalProperties: false
      properties:
        code: { type: string, examples: [exposure.public_repo_on_fleet] }
        subject: { type: string, description: Defaults to the whole repository. }
        reason: { type: string, minLength: 10, maxLength: 500, description: Why this is acceptable here, in characters. A line break is allowed; other control characters and direction-changing ones are not. }
        expires_at: { type: string, format: date-time, description: Required, in the future, and at most 365 days away. }
    HostCheckAcceptanceInput:
      type: object
      required: [check_id, seen_current, reason, expires_at]
      additionalProperties: false
      properties:
        check_id: { type: string, examples: [files.service] }
        seen_current: { type: string, description: What the check read when the person decided. The acceptance is refused with 409 if it reads anything else now. }
        reason: { type: string, minLength: 10, maxLength: 500, description: Why this is deliberate, in characters. A line break is allowed; other control characters and direction-changing ones are not. }
        expires_at: { type: string, format: date-time, description: Required, in the future, and at most 365 days away. }
    KennelNeed:
      type: object
      required: [source, label, permission, conditional]
      properties:
        source: { $ref: "#/components/schemas/KennelSource" }
        label: { type: string }
        permission: { type: string, description: Empty for what the fleet already knows, which needs none. }
        conditional: { type: boolean, description: Read only for the repositories the check applies to. }
    Catalog:
      type: object
      required: [version, generated_from, entries]
      properties:
        version: { type: integer, description: The document's own version; 1. }
        generated_from: { type: string, description: The short commit the catalog was generated at. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CatalogEntry" }
    CatalogEntry:
      type: object
      required: [id, kind, title, category, severity, detection, detects, fix, verify, docs_html, docs_md]
      properties:
        id: { type: string, description: "The code, verbatim: a problem code such as jobs.oom_killed or a check code such as ci.no_timeout." }
        kind: { type: string, enum: [problem, check] }
        title: { type: string }
        category: { type: string, enum: [capacity, reliability, security, configuration, cost] }
        severity: { type: string, description: The documented severity verbatim; a sentence where it depends on the circumstances. }
        detection: { type: string, enum: [static, runtime] }
        detects: { type: string }
        fix: { type: string }
        verify: { type: string, nullable: true, description: How to see the fix worked, or null where the documentation has no such sentence yet. }
        status_sentence: { type: string, description: What the public status page says for this code, where it shows it. }
        area: { type: string, description: A check's registry area. }
        setting: { type: string, description: The configuration key a static problem is about. }
        docs_html: { type: string, format: uri }
        docs_md: { type: string, format: uri }
    KennelCatalogueEntry:
      type: object
      required: [code, area, severity, detects, fix, verify, docs, needs, disabled]
      properties:
        code: { type: string }
        area: { type: string, enum: [guidance, exposure, capacity, setup, ci, token, protection] }
        severity: { $ref: "#/components/schemas/KennelSeverity" }
        detects: { type: string }
        fix: { type: string, description: What to change, written once for the check; a finding's own fix carries the numbers. }
        verify: { type: string, description: How to see that the change worked. }
        docs: { type: string, description: The anchor on the Kennel Club documentation page, as a path relative to the docs site. }
        needs:
          type: array
          items: { $ref: "#/components/schemas/KennelNeed" }
        disabled: { type: boolean, description: The operator turned it off, by its code or its area. }
    KennelStateCounts:
      type: object
      required: [pending, partial, attention, best_in_show]
      properties:
        pending: { type: integer }
        partial: { type: integer }
        attention: { type: integer }
        best_in_show: { type: integer }
    KennelCheck:
      type: object
      required: [code, area, severity, detects, repositories, disabled]
      properties:
        code: { type: string }
        area: { type: string }
        severity: { $ref: "#/components/schemas/KennelSeverity" }
        detects: { type: string }
        repositories: { type: integer, description: How many repositories have this check open. }
        disabled: { type: boolean }
    KennelAttention:
      type: object
      required: [id, name, visibility, state, counts]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { type: string }
        state: { $ref: "#/components/schemas/KennelState" }
        counts: { $ref: "#/components/schemas/KennelCounts" }
    KennelCoverageSummary:
      type: object
      required: [source, label, permission, states]
      properties:
        source: { $ref: "#/components/schemas/KennelSource" }
        label: { type: string }
        permission: { type: string }
        states:
          type: object
          description: How many repositories are in each state of reading this source.
          additionalProperties: { type: integer }
    KennelInstallationNote:
      type: object
      required: [installation_id, target, state, reason, since]
      description: An installation whose reads from GitHub are not getting through.
      properties:
        installation_id: { type: string }
        target: { type: string }
        state: { $ref: "#/components/schemas/KennelCoverageState" }
        reason: { type: string }
        since: { type: string, format: date-time }
    KennelOverview:
      type: object
      required: [enabled, scope, repositories, not_tracked, states, counts, checks, attention, coverage, unavailable, oldest_evaluation, disabled_checks]
      properties:
        enabled: { type: boolean, description: False when Kennel Club is off, and then nothing else is filled. }
        scope: { type: string, enum: [served, installation] }
        repositories: { type: integer, description: The repositories Kennel Club is tracking. }
        not_tracked: { type: integer, description: The repositories it has been told not to look at, counted here and in nothing else, so they never read as repositories nothing has looked at yet. }
        states: { $ref: "#/components/schemas/KennelStateCounts" }
        counts: { $ref: "#/components/schemas/KennelCounts" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/KennelCheck" }
        attention:
          type: array
          description: Up to ten repositories with something open, worst first.
          items: { $ref: "#/components/schemas/KennelAttention" }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/KennelCoverageSummary" }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/KennelInstallationNote" }
        oldest_evaluation: { type: [string, "null"], format: date-time }
        disabled_checks:
          type: array
          items: { type: string }
    ApplyRemedyRequest:
      type: object
      required: [code, target_id]
      additionalProperties: false
      properties:
        code: { type: string, examples: [pool.daemon_share_suggested] }
        target_id: { type: string, examples: [pool_k3f9qz2m] }
        remedy_id:
          type: string
          description: The remedy's `id` from the problem that was shown. Optional.
    ApplyRemedyResponse:
      type: object
      required: [applied, remedy, result]
      properties:
        applied: { type: boolean }
        remedy:
          type: object
          required: [id, label, kind, target_id]
          properties:
            id: { type: string }
            label: { type: string }
            kind: { type: string, enum: [pool.update, host.update] }
            target_id: { type: string }
        result:
          type: object
          additionalProperties: true
          description: What the pool's or host's own update answered, as `PATCH` returns it.
    Problem:
      type: object
      required: [code, severity, title, audience]
      properties:
        code: { type: string, examples: [bind.public_no_tls] }
        severity: { $ref: "#/components/schemas/Severity" }
        audience:
          type: string
          enum: [platform, fleet, both]
          description: >-
            Whose problem this is. `platform` is the process's own -- its lease, its
            loops, its backups, the release it could be running -- and reaches only a
            caller at the `platform` role. `fleet` is what the fleet's own pools, hosts,
            runners and jobs are doing wrong, and reaches everyone who can read the list.
            `both` is for the ones genuinely both people's: a list that could not be
            fully gathered has to say so to whoever is reading it.


            On a single-team instance the one account holds `platform` and the list is
            undivided, which is what it was before the role existed.
          examples: [platform]
        setting: { type: string, examples: [server.bind] }
        source:
          $ref: "#/components/schemas/SettingSource"
        undo:
          type: string
          description: >-
            The command that takes this value back out of the layer that set it, when there
            is one. Empty for a value in the configuration file, which is edited where it
            is, and for a default.

            It exists for the case the settings page cannot help with: a value saved here
            that stops the controller starting is unreachable from a page the controller
            serves, so the way back has to be something an operator can type at a stopped
            one.
          examples: ["zoomies config unset server.bind"]
        title: { type: string, description: One line - what is true. }
        detail: { type: string, description: Why it matters, and the consequence. }
        fix:
          type: string
          description: >-
            What to change, concretely. Read it with `source`: an operator told to change a
            setting will edit the configuration file, and a value stored in this fleet's
            database or pinned by a ZOOMIES_* variable is one the file cannot change.
        target_kind: { type: string }
        target_id: { type: string }
        alternatives:
          type: array
          description: >-
            The choices the fix leaves open, when the fix is a choice. For a pool
            no host can run, these are the backends its hosts do offer, so the UI
            can put the change one click away.
          items: { $ref: "#/components/schemas/BackendKind" }
          examples: [[podman]]
        remedy:
          $ref: "#/components/schemas/Remedy"
        daemon_share:
          type: object
          description: >-
            For `pool.daemon_share_suggested`: the sidecar shares it proposes, as a percentage of
            the slot, so the UI can apply them in one click with `PATCH /pools/{id}`. A resource
            left out is one with no advice, or advice that would cost the pool runners.
          properties:
            cpu_percent: { type: integer, minimum: 10, maximum: 90, examples: [20] }
            memory_percent: { type: integer, minimum: 10, maximum: 90, examples: [35] }
        since: { type: string, format: date-time }

    # --- status -----------------------------------------------------------
    CountBand:
      type: string
      enum: [none, few, many, backed_up]
      description: >-
        A count said roughly: none, a few (up to five), many, or -- for the
        queue only -- backed up, meaning more jobs are waiting than the fleet
        has slots for.
    FleetStatus:
      type: object
      required: [state, since, version, queued, running, median_wait_minutes, p95_wait_minutes, reasons, explanations]
      properties:
        state:
          type: string
          enum: [healthy, degraded, blocked]
          description: >-
            blocked when the worst of the fleet's problems is an error,
            degraded when it is a warning, healthy otherwise.
        since:
          type: string
          format: date-time
          description: When this controller first saw the fleet in this state.
        version: { type: string }
        queued: { $ref: "#/components/schemas/CountBand" }
        running: { $ref: "#/components/schemas/CountBand" }
        median_wait_minutes: { type: integer, description: The median queue wait over the last hour, rounded to the minute. }
        p95_wait_minutes: { type: integer, description: The 95th-percentile queue wait over the last hour, rounded to the minute. }
        reasons:
          type: array
          description: The fleet's current problems, one per code, worst first.
          items: { $ref: "#/components/schemas/FleetStatusReason" }
        explanations:
          type: object
          description: The public sentence for each code in reasons, from docs/problem-codes.md.
          additionalProperties: { type: string }
    FleetStatusReason:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code: { type: string, examples: [pool.no_capacity] }
        severity: { type: string, enum: [error, warning] }
        since: { type: string, format: date-time }

    # --- meta -------------------------------------------------------------
    Meta:
      type: object
      required: [version, bootstrap_required]
      properties:
        version: { type: string, examples: ["1.0.0 (abc1234)"] }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this build. }
        commit: { type: string }
        bootstrap_required: { type: boolean, description: True when no user exists yet. `/readyz` carries the same field, so a provisioner can wait on one endpoint. }
        tailcat_available: { type: boolean, description: Whether private enrolment is enabled and the controller has its encryption key. Relay connectivity is checked at enrolment. }
        auth_disabled: { type: boolean, description: True when authentication has been switched off in the configuration. }
        oidc_enabled: { type: boolean }
        oidc_label: { type: string, examples: ["Sign in with Okta"], description: "`oidc.label`, or \"Sign in with\" and the issuer's host." }
        password_login_hidden:
          type: boolean
          description: >-
            The sign-in page offers single sign-on alone: `oidc.hide_password_login` is on and
            single sign-on is working. An administrator can still ask for the form with /login?password.
        external_url: { type: string }
        webhook_url: { type: string }
        polling_only: { type: boolean, description: True when no webhook has ever been received and the poller is doing the work. }
        poller_enabled: { type: boolean, description: True when the fallback poller is running. It is off only by configuration, never by failure. }
        workflow_cancellation_enabled: { type: boolean, description: True when operators may ask GitHub to cancel workflow runs. }
        providers_available:
          type: boolean
          description: >-
            True when this deployment can rent machines - the build ships at least one
            provider driver and provider.enabled is on - so the page that would otherwise
            offer to buy machines nothing would ever create knows not to.
        poller_last_poll_at: { type: string, format: date-time, nullable: true, description: When the fallback poller last completed a sweep, or absent if it has not completed one since Zoomies started. }
        capacity_map:
          type: object
          description: >-
            How the host capacity map opens on each page that carries it, from
            ui.capacity_map.* in the fleet's settings. An operator who picks the
            other layout on the page keeps that pick in their browser; this is
            what somebody who has never chosen sees.
          properties:
            overview_layout: { $ref: "#/components/schemas/CapacityMapLayout" }
            hosts_layout: { $ref: "#/components/schemas/CapacityMapLayout" }
        queue_warning_threshold:
          type: integer
          description: >-
            How many jobs must be queued before the queue tiles on the Overview,
            Jobs and Pools pages turn to their warning colour, from
            ui.queue_warning_threshold in the fleet's settings.
          examples: [1]
    CapacityMapLayout:
      type: string
      description: overlay draws every host on one chart; split draws a chart for each.
      enum: [overlay, split]

    # --- overview ---------------------------------------------------------
    Stats:
      type: object
      properties:
        window: { type: string, description: The window these counts cover, echoed back., examples: ["1h"] }
        queued_jobs:
          type: integer
          description: >-
            Jobs waiting for a runner right now, whatever the window says. Work an
            operator removed from the queue is not waiting and is not counted, so a
            fleet whose queue has been emptied reports zero; paused work is still
            waiting and is still counted. Nor is a job whose workflow run has been
            cancelled, from the moment GitHub accepts the cancellation rather than
            when its completion delivery arrives.
        running_jobs:
          type: integer
          description: >-
            Jobs a runner is working on right now. A job whose workflow run has been
            cancelled stops counting the moment GitHub accepts the cancellation --
            its runner has already been taken away -- rather than when GitHub's
            completion delivery finally arrives.
        completed: { type: integer, description: Within the requested window. The sum of the four below. }
        succeeded: { type: integer, description: GitHub reported success and the fleet had no fault in it. }
        failed: { type: integer, description: A failing conclusion, or a runner that stopped under the job. }
        fleet_failed:
          type: integer
          description: >-
            How many of `failed` this deployment caused rather than the workflows: a runner
            that never started, or one that stopped under the job. A subset rather than a
            fifth outcome, because GitHub's answer for such a job is still "failure" and a
            split that did not add up would be a worse lie than no split.
        faults:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Those failures by category, keyed by FaultKind. Categories with no jobs are
            absent rather than zero. This is what turns "eleven failures this hour" into
            "eleven, nine of them out of memory", which is a different sentence and sends a
            different person to a different page.
        runner_start_faults:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Runners that failed before they could take a job, by category. These appear in
            no job count anywhere, because the jobs they were meant for are still queued --
            which is exactly why a pool that cannot start a container reads, everywhere
            else, as a fleet that is merely busy.
        cancelled: { type: integer, description: Cancelled or skipped, with no fault of the fleet's. }
        unknown: { type: integer, description: None of the above, including a job GitHub stopped reporting. Never counted as a success. }
        median_wait_ms: { type: integer, format: int64 }
        p95_wait_ms: { type: integer, format: int64 }
        p50_startup_ms: { type: integer, format: int64, description: Median runner creation-to-container-start latency. }
        p95_startup_ms: { type: integer, format: int64 }
        p50_registration_ms: { type: integer, format: int64, description: Median container-start-to-registration latency. }
        p95_registration_ms: { type: integer, format: int64 }
        fleet:
          type: object
          description: >
            The same job figures narrowed to the jobs this fleet has a hand in:
            one an enabled pool claimed, one that ran on a runner started here,
            or one still queued that no pool claims. GitHub reports every job in
            an installed repository, so on an organisation that also uses hosted
            runners the figures above are mostly somebody else's. Both are
            carried in one payload because the same numbers arrive over the
            event stream, which is one frame for every viewer.
          properties:
            queued_jobs: { type: integer, description: "As above, and on the same terms about removed work." }
            running_jobs: { type: integer, description: "As above, and on the same terms about cancelled work." }
            completed: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            fleet_failed: { type: integer, description: How many of failed this fleet caused. }
            cancelled: { type: integer }
            unknown: { type: integer }
            median_wait_ms: { type: integer, format: int64 }
            p95_wait_ms: { type: integer, format: int64 }
        runners:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            total: { type: integer }
        hosts:
          type: object
          properties:
            total: { type: integer }
            healthy: { type: integer }
            cordoned: { type: integer }
            capacity: { type: integer }
            used: { type: integer }
        pools:
          type: array
          items:
            type: object
            properties:
              pool_id: { type: string }
              pool_name: { type: string }
              min: { type: integer }
              max: { type: integer }
              live: { type: integer }
              busy: { type: integer }
              idle: { type: integer }
              queued: { type: integer }
              utilisation: { type: number, format: double, minimum: 0, maximum: 1 }

    FleetSample:
      type: object
      properties:
        at: { type: string, format: date-time }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        fleet_queued_jobs: { type: integer, description: The same minute narrowed to the jobs this fleet has a hand in. Zero on samples taken before this was recorded. }
        fleet_running_jobs: { type: integer, description: As above, for jobs in progress. }
        idle_runners: { type: integer }
        busy_runners: { type: integer }
        total_runners: { type: integer }

    ScalingEvent:
      type: object
      properties:
        id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        from: { type: integer }
        to: { type: integer }
        reason:
          type: string
          description: The scheduler's own words, shown verbatim in the UI.
          examples: ["scaled linux-x64 2 -> 4: 3 jobs queued > 30s"]
        created_at: { type: string, format: date-time }

    # --- installations ----------------------------------------------------
    InstallationArchive:
      type: object
      required: [kind, archive_version, exported_at, version, installation_id, target, tables]
      properties:
        kind: { type: string, enum: [zoomies-installation] }
        archive_version: { type: integer }
        exported_at: { type: string, format: date-time }
        exported_from: { type: string }
        version: { type: string }
        installation_id: { type: string }
        target: { type: string }
        secrets:
          type: object
          description: Passphrase-sealed, base64. Absent when the export had no passphrase.
          properties:
            private_key: { type: string, format: byte }
            webhook_secret: { type: string, format: byte }
        tables:
          type: array
          items:
            type: object
            required: [table, columns, rows]
            properties:
              table: { type: string }
              columns: { type: array, items: { type: string } }
              rows:
                type: array
                description: One array per row, in column order. A blob is an object with a base64 field.
                items: { type: array, items: {} }
    Installation:
      type: object
      properties:
        id: { type: string }
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string, examples: [acme, "acme/widgets"] }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string }
        app_slug: { type: string }
        web_url: { type: string }
        settings_url:
          type: string
          description: >-
            The App's own settings page on GitHub, which is the only place its
            avatar can be uploaded. Absent when the App's slug is unknown.
          examples: ["https://github.com/organizations/acme/settings/apps/zoomies-acme"]
        enterprise: { type: boolean }
        healthy: { type: boolean }
        last_error: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        pool_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InstallationCreate:
      type: object
      required: [app_id, installation_id, target, target_type, private_key]
      properties:
        app_id: { type: integer, format: int64 }
        installation_id: { type: integer, format: int64 }
        target: { type: string }
        target_type: { $ref: "#/components/schemas/TargetType" }
        api_base_url: { type: string, default: "https://api.github.com" }
        private_key: { type: string, format: password, description: The App's PEM private key. Sealed before storage and never returned. }
        webhook_secret: { type: string, format: password }

    InstallationUpdate:
      type: object
      properties:
        target: { type: string }
        api_base_url: { type: string }
        private_key: { type: string, format: password }
        webhook_secret: { type: string, format: password }

    InstallationHealth:
      type: object
      properties:
        ok: { type: boolean }
        app_slug: { type: string }
        app_name: { type: string }
        message: { type: string, description: On failure, names the missing permission where GitHub tells us. }
        permissions: { type: object, additionalProperties: { type: string } }
        events: { type: array, items: { type: string } }
        missing_permissions: { type: array, items: { type: string } }
        missing_events: { type: array, items: { type: string } }
        rate_limit_remaining: { type: integer }
        repository_selection:
          type: string
          enum: [all, selected]
          description: >-
            GitHub's own word for how much of the target this installation covers. An App
            with every permission correct, installed on "only select repositories" and not
            on the one somebody pushes to, is a fleet where nothing ever queues and no page
            says why -- so the verify answer names it.
        repository_count:
          type: integer
          description: How many repositories the installation can see, up to the scan's own cap.
        repositories:
          type: array
          items: { type: string }
          description: The first few by name, so an operator can look for the one they expected.
        repositories_capped:
          type: boolean
          description: True when there are more than the names listed.

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        delivery_id: { type: string }
        event: { type: string }
        action: { type: string }
        repo: { type: string }
        status: { type: string, enum: [accepted, rejected, error] }
        error: { type: string }
        installation_id:
          type: string
          description: >-
            The installation whose webhook secret verified this delivery. It is not
            necessarily the one covering the repository: when none does, every configured
            secret is tried, and this says which one answered. Empty on a delivery that
            verified against none.
        received_at: { type: string, format: date-time }

    WebhookCheck:
      type: object
      properties:
        reachable: { type: boolean }
        url: { type: string }
        message: { type: string }
        fix: { type: string, description: The specific remedy - open a port, use a tunnel, configure the proxy. }
        polling_available: { type: boolean }
        last_delivery_at: { type: [string, "null"], format: date-time }

    # --- migrations -------------------------------------------------------
    MigrationOverride:
      type: object
      description: |
        One job sent somewhere other than the consolidated `mapping` says.

        It names exactly one place -- a job, in a workflow file, in a repository
        -- and nothing about it is a pattern: a pattern would match more than
        the operator read in the review step. A job the plan could not attribute
        to a name cannot be overridden, because there would be nothing stable to
        key on when the apply step re-reads the file.
      required: [repo, path, job]
      properties:
        repo: { type: string, examples: ["acme/widgets"], description: Compared case-insensitively, as GitHub does. }
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        job: { type: string, examples: ["integration"] }
        to:
          type: string
          examples: ["zoomies-linux-arm64"]
          description: >-
            The runs-on value this job gets. Empty leaves this one job on the rented runner it
            names today - a decision, reported with its own reason rather than as an unmapped
            label.

    MigrationRewrite:
      type: object
      description: One runs-on value a migration would change.
      properties:
        line: { type: integer, description: The 1-based line in the file as it is today. }
        job: { type: string, description: The workflow job the line belongs to, where indentation could tell. }
        label:
          type: string
          examples: ["ubuntu-latest"]
          description: >-
            The hosted-runner label being replaced, set only where the value asks for exactly
            one. A line carrying both a job and a label is one an override can name.
        from: { type: string, examples: ["ubuntu-latest"] }
        to: { type: string, examples: ["zoomies-linux-x64"] }
        overridden: { type: boolean, description: True when `to` came from an override rather than from the consolidated mapping. }

    MigrationSkip:
      type: object
      description: |
        A runs-on the migration deliberately left alone, and why. A skip is not
        a failure: a matrix expression, a job already on a self-hosted runner
        and a hosted label nobody mapped are all things a person has to decide.
      properties:
        line: { type: integer }
        job: { type: string }
        label:
          type: string
          description: >-
            The hosted-runner label this job asks for, set only where the value asks for exactly
            one. A skip carrying both a job and a label is one an override can settle; a
            ${{ }} expression carries neither, because no override can decide it.
        value: { type: string }
        reason: { type: string }

    MigrationWorkflow:
      type: object
      properties:
        path: { type: string, examples: [".github/workflows/ci.yml"] }
        sha: { type: string, description: The blob SHA the plan was computed against. }
        rewrites: { type: array, items: { $ref: "#/components/schemas/MigrationRewrite" } }
        skips: { type: array, items: { $ref: "#/components/schemas/MigrationSkip" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this file asks for, mapped or not.
        diff: { type: string, description: A unified diff of the change, empty when the file is untouched. }

    MigrationRepo:
      type: object
      properties:
        repo: { type: string, examples: ["acme/widgets"] }
        default_branch: { type: string }
        workflows: { type: array, items: { $ref: "#/components/schemas/MigrationWorkflow" } }
        hosted_labels:
          type: array
          items: { type: string }
          description: The hosted-runner labels this repository asks for - GitHub's own and the vendors' - mapped or not.
        error: { type: string, description: Set when this repository could not be read; the rest of the plan still stands. }
        archived:
          type: boolean
          description: >-
            The repository is archived and therefore read-only, so no pull request can be
            opened against it. Its workflows are not read, and it is never counted as
            something the migration would change.
        on_zoomies:
          type: boolean
          description: At least one job in this repository already runs on a pool of this fleet.

    MigrationPoolOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        runs_on: { type: string, description: What a workflow writes to reach this pool, and the value a mapping should hold. }
        enabled: { type: boolean }

    MigrationCounts:
      type: object
      properties:
        repos: { type: integer }
        workflows: { type: integer }
        jobs: { type: integer }
        skipped: { type: integer }

    MigrationPlan:
      type: object
      properties:
        installation_id: { type: string }
        target: { type: string }
        repositories: { type: array, items: { $ref: "#/components/schemas/MigrationRepo" } }
        hosted_labels: { type: array, items: { type: string } }
        mapping:
          type: object
          additionalProperties: { type: string }
          description: What was applied - the request's mapping, or the one the server proposed.
        overrides:
          type: array
          items: { $ref: "#/components/schemas/MigrationOverride" }
          description: >-
            The exceptions that were applied on top of the mapping, echoed back so a plan
            describes itself.
        unmapped:
          type: array
          items: { type: string }
          description: Hosted labels no pool was proposed for. Jobs on these are left where they are.
        pools: { type: array, items: { $ref: "#/components/schemas/MigrationPoolOption" } }
        counts: { $ref: "#/components/schemas/MigrationCounts" }
        truncated: { type: boolean, description: True when there are more repositories after this page. }
        next_cursor: { type: string, description: Send as `cursor` to read the next page of repositories. Absent on the last page. }
        total_repos: { type: integer, description: How many repositories the installation can see in total, of which this is one page. }
        missing_permissions:
          type: array
          items: { type: string }
          description: >-
            What the App still needs before pull requests can be opened. Reported here,
            in the step before, because discovering it halfway through leaves half the
            pull requests open.
        permission_hint: { type: string }
        settings_url: { type: string, description: The App's settings page, where the missing permissions are granted. }

    MigrationResult:
      type: object
      properties:
        repo: { type: string }
        status: { type: string, enum: [opened, skipped, failed] }
        pull_request_url: { type: string }
        pull_request_number: { type: integer }
        branch: { type: string }
        workflows: { type: integer }
        jobs: { type: integer }
        reason: { type: string, description: Why it was skipped, or how it failed. }
        badge:
          type: string
          enum: [added, present, no_readme, unread, off]
          description: >-
            What became of the README badge on a pull request that was opened. `present`
            means the README already carried it; `no_readme` that there was no Markdown
            README to put it in; `unread` that GitHub would not hand the README over; `off`
            that the request asked for none.
        badge_reason: { type: string, description: Which kind of nowhere a `no_readme` was, or what GitHub said for an `unread`. }

    MigrationOutcome:
      type: object
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/MigrationResult" } }
        opened: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }

    # --- pools ------------------------------------------------------------
    Resources:
      type: object
      description: >-
        What one runner of a pool may consume on its host. Leaving both `cpus`
        and `memory_mb` out is the pool's way of saying "the host decides":
        each runner is then given one slot's share of whichever machine it
        lands on, charged against that host and applied as a real cgroup limit
        (`scheduler.default_runner_limits`, on by default). That is the sizing
        most fleets want, because it keeps fitting when a larger machine
        joins; set the two figures only where a pool's jobs need a particular
        size on every host. `disk_gb` and `pids_limit` are independent of the
        choice, and zero in either means no limit.
      properties:
        cpus:
          type: number
          format: double
          minimum: 0.25
          examples: [2]
          description: Cores, fractions allowed. Omitted or zero leaves the size to the host, which gives each runner one slot's share of its machine; below a quarter of a core is refused, because the runner binary cannot keep up with its own job.
        memory_mb:
          type: integer
          format: int64
          examples: [4096]
          description: Megabytes. Omitted or zero leaves the size to the host, which gives each runner one slot's share of its machine; below 512 is refused, because the runner binary is killed before it takes a job.
        disk_gb: { type: integer, format: int64, description: Advisory, and charged against the host's free disk. Zero is no limit. }
        pids_limit: { type: integer, format: int64, description: The container's pids cgroup limit. Zero is no limit. }
        min_cpus:
          type: number
          format: double
          examples: [1.5]
          description: >-
            The least CPU a runner may be given when no host has room for its standard: `cpus`,
            or -- where `cpus` is left to the host -- a whole slot's share of it. A host a
            little short of the standard then runs the job with as much as it can spare, never
            less than this, instead of leaving it queued. The standard is still what the fleet
            places at wherever it can. Must be below `cpus` when `cpus` is set, and at least a
            quarter of a core. On a pool, zero follows the fleet's `runners.minimum_cpus`,
            read live; `effective_minimum` is the minimum in force.
        min_memory_mb:
          type: integer
          format: int64
          examples: [3072]
          description: >-
            The least memory, in megabytes, a runner may be given when no host has room for
            `memory_mb` or a whole slot's share, as `min_cpus` is for CPU. Must be below
            `memory_mb` when that is set, and is held to the same 512 MB floor. On a pool, zero
            follows the fleet's `runners.minimum_memory_mb`, read live; `effective_minimum` is
            the minimum in force.
        daemon_share_percent:
          type: integer
          minimum: 0
          maximum: 90
          examples: [70]
          description: >-
            For a `docker_mode: dind` pool whose size comes from the host: the percentage of one
            slot given to the Docker daemon, which does the building; the runner keeps the rest.
            One figure for CPU and memory alike; `daemon_cpu_share_percent` and
            `daemon_memory_share_percent` override it for their own resource. Zero is the even
            split every pool had before this was settable. Between 10 and 90 otherwise. It
            divides only a share the host chose -- a typed `cpus` or `memory_mb` is given to both
            containers in full -- and the host is charged one slot either way. A slot too small to
            give the thinner half what a runner needs is raised to it, which costs runners, or
            refused.
        daemon_cpu_share_percent:
          type: integer
          minimum: 0
          maximum: 90
          examples: [70]
          description: >-
            The daemon's share of a slot's CPU, where it differs from `daemon_share_percent`. A
            build is CPU in the daemon, so this is usually the one worth raising. Zero follows
            `daemon_share_percent`, then the even split.
        daemon_memory_share_percent:
          type: integer
          minimum: 0
          maximum: 90
          examples: [35]
          description: >-
            The daemon's share of a slot's memory, where it differs from `daemon_share_percent`.
            The runner's memory holds the checkout, the toolchain and any in-memory work folder
            (charged to the runner), so this is often the one worth lowering. Zero follows
            `daemon_share_percent`, then the even split.

    CPUBurstPolicy:
      type: object
      description: >-
        Whether an automatically-sized Docker or Podman pool only observes, or
        may use, CPU left over after every live runner's guaranteed host share
        and one imminent start have been protected. Memory has a policy of its
        own (`MemoryBurstPolicy`), because a memory limit can be raised and
        never taken back. Existing pools default to off; new pools default to
        observe.
      properties:
        mode:
          type: string
          enum: [off, observe, automatic]
          default: off
          description: >-
            `off` makes no decisions; `observe` publishes the decision and
            metrics without changing quotas; `automatic` applies the target to
            capable agents. Host pressure throttling always takes precedence.
        max_cpus:
          type: number
          format: double
          minimum: 0
          description: >-
            Maximum CPU for one logical runner. Zero uses the host's allocatable
            CPU as the ceiling. For Docker-in-Docker this covers the runner and
            sidecar together.
        size_for_ceiling:
          type: boolean
          default: true
          description: >-
            With `automatic`, start each runner with `CARGO_BUILD_JOBS`,
            `DOTNET_PROCESSOR_COUNT` and `-XX:ActiveProcessorCount` in
            `JAVA_TOOL_OPTIONS` set to its CPU ceiling in whole cores, because
            those toolchains size their workers once, at start, and could not
            otherwise use CPU lent later. A variable the pool's or the fleet's
            env already sets is left alone. Absent is on; ignored unless the
            mode is `automatic`.

    MemoryBurstPolicy:
      type: object
      description: >-
        Whether a Docker or Podman pool lets a runner be given more memory than it was created
        with, while its job runs, out of memory the host has not promised to any runner -- the
        memory valve. A runner keeps its guarantee, draws on the host's shared pool when it nears
        its limit, and may be allowed a bounded amount of swap once the pool cannot cover it. A
        limit is only ever raised, never lowered, so a loan lasts as long as the runner does.
        Existing pools default to off; a new pool made without it observes.
      properties:
        mode:
          type: string
          enum: [off, observe, automatic]
          default: off
          description: >-
            `off` does nothing; `observe` decides what it would have lent and records it, changing
            nothing; `automatic` lends. Both need an agent that advertises `elastic-memory`.
        max_memory_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The most memory one logical runner may hold, its own share and anything lent to it
            together. For a Docker-in-Docker runner it covers the runner and its sidecar. Zero is
            the default, half as much again as the runner was created with. A host's own
            `runner_profile.standard.burst_max_memory_mb` can lower it and never raise it.
        spill_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The swap each container may be allowed beyond its memory limit as the last resort,
            once the pool is empty or the ceiling is reached and a kill is close. Zero is none,
            which swap is for every pool that has never said otherwise: it turns a kill into a
            slowdown, and some operators would rather have the kill. Only if the host has free swap.

    RunnerSettings:
      type: object
      description: >-
        What one pool overrides of the fleet's own runner timings. Every field
        is optional and every one is nullable, and the three states are
        distinct: absent leaves whatever the pool already had, `null` clears
        the override and hands the setting back to the fleet, and a duration
        sets it. A pool that overrides nothing follows the fleet and keeps
        following it when the fleet's figure changes, which is why these are
        not copied onto the pool when it is created.

        Zero is a real answer in each, not "unset": a pool on a slow
        air-gapped registry means "never fail a runner for taking too long to
        register" by setting `provision_timeout` to `0`.

        These are the settings whose right answer belongs to the pool rather
        than the fleet. A pool pulling a twelve-gigabyte Windows image and a
        pool booting Alpine do not agree about how long registering should
        take, and a fleet that has to pick one picks the slower. `idle_timeout`
        is not here because it is already a field on the pool itself.
      properties:
        provision_timeout:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          nullable: true
          description: Fails a runner of this pool that never finishes registering. Overrides `scheduler.provision_timeout`.
          examples: ["20m"]
        drain_timeout:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          nullable: true
          description: Fails a runner of this pool that has been draining this long with no job left on it. Overrides `scheduler.drain_timeout`. A runner still finishing a job is never touched by it.
          examples: ["10m"]
        max_runner_lifetime:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          nullable: true
          description: Drains a runner of this pool that has lived this long, the next time it is not busy. Overrides `scheduler.max_runner_lifetime`. It never ends a job.
          examples: ["24h"]
        scale_up_delay:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          nullable: true
          description: How long a job for this pool must have been queued before it counts as demand. Overrides `scheduler.scale_up_delay`.
          examples: ["0s"]
        docker_wait:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          nullable: true
          description: How long a runner of this pool waits for the Docker daemon it was promised before refusing a job. Overrides `runners.docker_wait`, and means nothing on a pool whose `docker_mode` is `none`.
          examples: ["120s"]

    PoolHostRoom:
      type: object
      description: >-
        One host's room for a pool: what it promises, what the machine can back
        at that pool's size, and what one runner of it is charged there.
      properties:
        host_id: { type: string }
        host: { type: string }
        slots: { type: integer, description: "The host's slots -- its capacity, or what its machine holds of its standard runner size up to the capacity -- less any throttle in force." }
        fits: { type: integer, description: How many runners of this pool the machine has room for, ignoring the slot count. A host whose slots outrun its machine reads as free capacity and refuses every create for it. }
        room: { type: integer, description: The smaller of the two, which is what the pool can actually expect here. }
        limited_by:
          type: string
          enum: [slots, cpu, memory, disk, profile]
          description: >-
            What ran out first. `profile` means the host's runner profile keeps the pool off
            it altogether, and `excluded` says which limit. Absent on a host that has
            measured nothing, where only its slots bind.
        charge_cpus: { type: number, format: double, description: What one runner of this pool costs here, which is twice what the pool says for a docker-in-docker pool -- the sidecar gets the same limits. }
        charge_memory_mb: { type: integer, format: int64 }
        cpus: { type: number, format: double, description: The machine less its reserve, which is what the charge is taken from. }
        memory_mb: { type: integer, format: int64 }
        disk_mb: { type: integer, format: int64 }
        cpus_known: { type: boolean }
        memory_known: { type: boolean }
        disk_known: { type: boolean }
        elastic_cpu:
          type: boolean
          description: >-
            Whether this host's agent can move a live runner's CPU quota. An elastic pool is
            honoured only where it is true; a runner of one placed elsewhere is held at its share.
        elastic_memory:
          type: boolean
          description: >-
            Whether this host's agent carries out the memory valve's rules. A pool that has the
            valve on is lent nothing, and observes nothing, on a host where this is false.
        tmpfs:
          type: boolean
          description: >-
            Whether this host's agent mounts a pool's in-memory folders. A pool that asks for
            them is honoured only where it is true; a runner of one placed elsewhere starts on disk.
        tmpfs_off:
          type: boolean
          description: >-
            Whether this host's operator turned in-memory folders off in its runner profile. A pool
            that asks for them is not given them here. Absent where they are allowed.
        sizing: { $ref: "#/components/schemas/PoolHostSizing" }
        excluded:
          type: string
          description: >-
            Why the host's runner profile keeps this pool off it, as a sentence about the host
            with its name left out. Absent where the host can run the pool.
        excluded_by: { type: string, enum: [profile], description: The code of the rule behind `excluded`. }

    PoolHostSizing:
      type: object
      description: >-
        How one pool is sized on one host, with where each figure came from, so an
        operator can see why a runner there is the size it is and what to change to move it.
        A source is `pool`, `host` (the host's runner profile, or one slot's share of the
        machine) or `global` (the fleet's `runners.*` setting); absent where nobody has said
        and the figure is zero.
      properties:
        standard: { $ref: "#/components/schemas/RunnerSize" }
        standard_cpus_source: { type: string, enum: [pool, host, global] }
        standard_memory_mb_source: { type: string, enum: [pool, host, global] }
        floor:
          allOf: [{ $ref: "#/components/schemas/RunnerSize" }]
          description: The least a runner is given there -- the larger of the pool's minimum (its own, or the fleet's where it follows it) and the host's.
        floor_cpus_source: { type: string, enum: [pool, host, global] }
        floor_memory_mb_source: { type: string, enum: [pool, host, global] }
        ceiling_cpus:
          type: number
          format: double
          description: The most CPU one runner may use there, its guarantee and a loan together, for a pool that lends CPU -- the smaller of the pool's ceiling and the host's. Absent is as much as the host's allocatable CPU.
        ceiling_source: { type: string, enum: [pool, host] }
        ceiling_memory_mb:
          type: integer
          format: int64
          description: The most memory one runner may hold there, its guarantee and what it is lent together, for a pool that has the memory valve on. The smaller of the pool's ceiling and the host's, or half as much again as the runner's guarantee where neither has said.
        ceiling_memory_source: { type: string, enum: [pool, host, default] }

    PoolRoom:
      type: object
      description: >-
        How many runners of a pool the hosts that can run it have room for,
        counted on an empty fleet. What is running right now changes with every
        job; the question a size and a maximum are chosen against is how big the
        machines are, in runners of this pool.
      properties:
        runners: { type: integer, description: The room across every matching host. It is the number a maximum is worth comparing against. }
        slots: { type: integer, description: What those hosts' capacities add up to, whatever the size. }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/PoolHostRoom" }
        smallest_disk_mb: { type: integer, format: int64, description: The least free disk on any matching host, which is what a cache size limit has to live inside. }
        smallest_disk_host: { type: string }
        disk_known: { type: boolean }
        tmpfs_plan:
          $ref: "#/components/schemas/TmpfsPlan"
        split_plan:
          $ref: "#/components/schemas/SplitPlan"

    SplitPlan:
      type: object
      description: >-
        The ways of dividing a host-sized Docker-in-Docker pool's slot between the runner and
        its daemon, priced on the pool's hosts. A skewed split raises a thin half to its
        minimum and the slot grows with it, so the same preset keeps every runner on one fleet
        and loses most of them on another; the preset to start from is one that costs nothing.
        Absent for a pool with a typed size, which gives the daemon the whole limit.
      properties:
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [even, build, runner], description: "`even` is 50/50; `build` gives the daemon most of the CPU; `runner` gives the runner most of both." }
              cpu_percent: { type: integer, description: The daemon's share of a slot's CPU under this preset. }
              memory_percent: { type: integer, description: The daemon's share of a slot's memory under this preset. }
              runners: { type: integer, description: How many runners the hosts could hold under it. }
              loses: { type: boolean, description: True when that is fewer than under the pool's own division now. }
        runners_now: { type: integer, description: The room under the pool's own division. }
        recommended: { type: string, enum: [even, build, runner], description: The preset to start from -- one that suits a pool that builds images and loses no runner, else `even`. }

    TmpfsPlan:
      type: object
      description: >-
        What a pool's automatic in-memory folders come to on its hosts, and what would
        change it. Present only for a pool that keeps a folder in memory with `auto`, the
        setting that decides per host and so needs saying per host. It informs; every
        change is the operator's. The same figures are in the `pool.tmpfs_auto_on_disk`
        problem's fix.
      properties:
        hosts:
          type: array
          description: What a runner of the pool is given on each host that mounts the folders.
          items:
            type: object
            properties:
              host: { type: string }
              runner_mb: { type: integer, format: int64, description: The memory limit a runner is given there. }
              daemon_mb: { type: integer, format: int64, description: The sidecar's, for a Docker-in-Docker pool. }
              folders:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, examples: [work folder] }
                    ask_mb: { type: integer, format: int64, description: What the folder is asked for there. }
                    mb: { type: integer, format: int64, description: What a runner is given; zero is disk. }
                    auto: { type: boolean }
        in_memory: { type: integer, description: How many folder placements across the hosts are in memory. }
        total: { type: integer, description: How many folder placements there are. }
        share:
          type: object
          description: >-
            A daemon memory share (`resources.daemon_memory_share_percent`) that would put more folders in
            memory without losing a runner. Absent when none does, which is usual: moving a
            share raises what a thinner half is charged and costs runners.
          properties:
            percent: { type: integer }
            in_memory: { type: integer, description: Folder placements in memory at this share. }
            now: { type: integer, description: The same at the pool's. }
            runners: { type: integer }
            runners_now: { type: integer }
        sizes:
          type: array
          description: Per host where the work folder is on disk, the runner size at which it would be in memory.
          items:
            type: object
            properties:
              host: { type: string }
              memory_mb: { type: integer, format: int64, description: The runner memory, in half-gigabyte steps. }
              slots: { type: integer, description: The slots the host would hold at that size. }
              slots_now: { type: integer }
              lever:
                type: string
                enum: [standard, capacity]
                description: >-
                  What changes the runner's size for this pool: `standard`, the host's standard
                  runner size in its runner profile, for a pool that takes its size from its
                  hosts; or `capacity`, the host's slot count, for a pool sized by a slot's share,
                  where fewer slots are bigger ones.

    PoolPlatform:
      type: object
      description: One row of the runner image catalogue.
      properties:
        os: { type: string, examples: [ubuntu] }
        os_version: { type: string, examples: ["24.04"] }
        label: { type: string, examples: ["Ubuntu 24.04"] }
        image: { type: string, examples: ["ghcr.io/eyupio/zoomies-runner:ubuntu-2404"] }
        arches: { type: array, items: { type: string }, examples: [[amd64, arm64]] }
        default: { type: boolean, description: True for the variant :latest points at. }

    Platform:
      type: object
      description: >-
        The machine a pool's runners need, or the machine a host is. Every field
        is optional; an empty field is a promise nobody made and matches
        anything. A pool's platform selects its runner image and restricts the
        hosts the scheduler may place its runners on.
      properties:
        os:
          type: string
          description: A distribution, not a kernel - "linux" cannot pick a runner image.
          enum: [ubuntu, debian, fedora, rocky, macos, windows]
          examples: [ubuntu]
        os_version: { type: string, examples: ["24.04"] }
        arch: { type: string, enum: [amd64, arm64], examples: [arm64] }
    ReportPercentiles:
      type: object
      description: Exact nearest-rank percentiles of one interval's stored samples.
      required: [samples, p50_seconds, p95_seconds]
      properties:
        samples: { type: integer, description: How many intervals had both ends recorded. }
        p50_seconds: { type: [number, "null"], description: Null when there are no samples. }
        p95_seconds: { type: [number, "null"], description: Null when there are no samples. }
    InstallationReport:
      type: object
      required: [installation, window, installation_id, from, to, counts, timings, counts_from, timings_from, unavailable]
      properties:
        installation:
          type: object
          required: [id]
          properties:
            id: { type: string }
            target: { type: string, description: Only to a caller who may read installations and, for a repository target, jobs. }
            target_type: { type: string, enum: [org, repo] }
        window: { type: string, description: The window asked for, echoed back. }
        installation_id: { type: string }
        from: { type: string, format: date-time, description: The start of the window, at UTC midnight. }
        to: { type: string, format: date-time }
        counts:
          type: object
          required: [observed, eligible, created_for, ran_here, ran_elsewhere, fleet_fault, cleanup_pending, cleanup_converged]
          properties:
            observed: { type: integer }
            eligible: { type: integer }
            created_for: { type: integer }
            ran_here: { type: integer }
            ran_elsewhere: { type: integer }
            fleet_fault: { type: integer }
            cleanup_pending: { type: integer }
            cleanup_converged: { type: integer }
        timings:
          type: object
          required: [scheduling, registration, cleanup]
          properties:
            scheduling: { $ref: "#/components/schemas/ReportPercentiles" }
            registration: { $ref: "#/components/schemas/ReportPercentiles" }
            cleanup: { $ref: "#/components/schemas/ReportPercentiles" }
        counts_from: { type: string, format: date-time, description: Where the counts are complete from; later than from when part of the window is unavailable. }
        timings_from: { type: string, format: date-time, description: Where the timings are complete from. }
        rolled_until: { type: string, format: date-time, description: Where the daily roll-up hands over to the rows, when any of the window came from it. }
        unavailable:
          type: array
          items: { type: string }
          description: Each part of the window a figure does not cover, and why, in words.
    UsageResponse:
      type: object
      required: [from, to, group_by, items, costs_are_estimates, allocation_attributable, history_from]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        group_by: { type: string, enum: [installation, repository, workflow, pool, host] }
        costs_are_estimates: { type: boolean, const: true }
        allocation_attributable:
          type: boolean
          description: |
            Whether allocated runner lifetime, and therefore cost, can be
            attributed to this grouping at all. A runner idles on behalf of a
            pool, never on behalf of a repository or a workflow, so it is false
            for the repository and workflow groupings and every row's
            allocated_runner_seconds is null.
        history_from:
          type: object
          required: [jobs, runners]
          description: |
            Where the history each figure is computed from begins, given what
            retention has already pruned. Job counts, execution time and
            queue waits come from job rows. Allocated runner time and cost
            come from the usage ledger (a daily roll-up for the whole UTC
            days it covers, and runner rows and sessions for the rest) so
            `runners` is where the ledger begins rather than where
            retention.runners cuts the rows. A report whose `from` is earlier
            than one of these is complete only from that instant on. Null
            means that history is never pruned.
          properties:
            jobs: { type: string, format: date-time, nullable: true }
            runners: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items:
            type: object
            required: [key, job_execution_seconds, allocated_runner_seconds, jobs, jobs_started, jobs_completed, average_queue_wait_seconds, peak_concurrency]
            properties:
              history:
                type: array
                items: { $ref: "#/components/schemas/UsageBucket" }
              succeeded: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              unknown: { type: integer }
              key: { type: string }
              job_execution_seconds: { type: number, description: Job execution time clipped to the reported interval. }
              allocated_runner_seconds:
                type: number
                nullable: true
                description: Runner lifetime clipped to the interval, or null when the grouping cannot attribute it. Null is not zero.
              jobs: { type: integer, description: "Jobs queued within the interval. Counts are additive: adjacent reports sum." }
              jobs_started: { type: integer, description: Jobs whose run began within the interval. }
              jobs_completed: { type: integer, description: Jobs that finished within the interval. }
              average_queue_wait_seconds:
                type: number
                nullable: true
                description: Mean wait of the jobs_started jobs, so the denominator is the population with an observed wait. Null when nothing started in the interval.
              peak_concurrency: { type: integer }
              estimated_cost: { type: number, description: Estimate from administrator-assigned pool rates; omitted when no rate exists. }

    UsageBucket:
      type: object
      required: [from, queued, started, succeeded, failed, cancelled, unknown, execution_seconds, allocated_seconds, capacity_samples, capacity_reached]
      properties:
        from: { type: string, format: date-time }
        queued: { type: integer }
        started: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        unknown: { type: integer }
        execution_seconds: { type: number }
        allocated_seconds: { type: number }
        capacity_samples: { type: integer, description: Observed pool minutes; zero means no capacity telemetry. }
        capacity_reached: { type: integer, description: Observed pool minutes containing at least one capacity-blocked placement. Not incident count or exact duration. }

    ToolchainDemand:
      type: object
      required: [tool, jobs, repositories]
      properties:
        tool: { type: string, enum: [python, node, go, java, dotnet] }
        version: { type: string, description: "The version or range as the workflow writes it. Absent when unresolved is set." }
        distribution: { type: string, description: "setup-java's distribution; absent for other tools." }
        unresolved: { type: string, description: "Why the version is not known from the workflow file." }
        jobs: { type: integer, description: "Workflow jobs asking for it, each matrix combination counted once." }
        repositories: { type: array, items: { type: string } }

    ToolchainScanInstallation:
      type: object
      required: [installation_id, target, repositories, workflows]
      properties:
        installation_id: { type: string }
        target: { type: string }
        repositories: { type: integer }
        workflows: { type: integer }
        error: { type: string, description: "Why this installation was not read, or only partly." }
        unreadable:
          type: object
          additionalProperties: { type: string }
          description: Repositories whose workflows GitHub would not return, and why.

    ToolFill:
      type: object
      description: What a tool cache fill did with one requested version.
      required: [tool, request, outcome]
      properties:
        tool: { type: string, enum: [python, node, go, java, dotnet] }
        request: { type: string, description: The version as the workflows asked for it, such as 3.12 or lts/*. }
        outcome:
          type: string
          enum: [installed, present, skipped, failed]
          description: present means it was already in the cache; skipped is a request a fill cannot serve, with the reason.
        version: { type: string, description: The release the request resolved to, for installed and present. }
        reason: { type: string, description: Why, for skipped and failed. }
    ToolCacheFill:
      type: object
      description: One pool's tool cache fill on one host, the latest there has been.
      required: [host_id, host_name, state, requested, tools, queued_at]
      properties:
        host_id: { type: string }
        host_name: { type: string }
        state:
          type: string
          enum: [pending, succeeded, failed]
          description: A fill that succeeded may still have skipped or failed requests; tools says which.
        requested: { type: integer }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolFill" } }
        error: { type: string }
        queued_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ToolchainScan:
      type: object
      required: [running, pools, unmatched, installations, fills]
      properties:
        running: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        pools:
          type: object
          description: Pool ID to what that pool's jobs ask for.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/ToolchainDemand" }
        unmatched:
          type: array
          description: What jobs ask for that no pool would run.
          items: { $ref: "#/components/schemas/ToolchainDemand" }
        installations:
          type: array
          items: { $ref: "#/components/schemas/ToolchainScanInstallation" }
        fills:
          type: object
          description: Pool ID to its tool cache's latest fill on each host, for the pools that keep a tool cache.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/ToolCacheFill" }

    PoolPrewarm:
      type: object
      properties:
        pool_id: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        image: { type: string }
        state: { type: string, enum: [pending, succeeded, failed] }
        digest: { type: string }
        error: { type: string }
        updated_at: { type: string, format: date-time }

    Pool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        installation_id: { type: string }
        installation_target: { type: string }
        labels: { type: array, items: { type: string } }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image: { type: string }
        effective_image:
          type: string
          description: >-
            The image this pool's runners will actually boot: image when the pool
            names one, otherwise the variant its platform selects, otherwise the
            instance default -- and then its Docker variant when the pool gives
            its jobs a daemon.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer }
        max_runners: { type: integer }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort per-repository runner creation limit; zero disables it. This cannot prevent GitHub from assigning work to compatible idle runners and is not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true, description: Optional administrator-assigned rate used only for estimates. }
        priority: { type: integer, default: 0, description: Higher-priority pools receive creation capacity before lower-priority pools. }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cpu_burst: { $ref: "#/components/schemas/CPUBurstPolicy" }
        memory_burst: { $ref: "#/components/schemas/MemoryBurstPolicy" }
        size_from_profile:
          type: boolean
          description: >-
            The pool takes its runners' size from the host each lands on, as that host's
            runner profile says it: the standard size the operator gave the host, or the
            fleet's default where the host names none. It excludes `resources.cpus` and
            `memory_mb`, and it is what makes `sizing` `profile`.
        fleet_standard:
          allOf: [{ $ref: "#/components/schemas/RunnerSize" }]
          readOnly: true
          description: >-
            For a pool with `size_from_profile`, the size a runner is on a host whose profile
            names no standard: the fleet's default, `runners.default_cpus` and
            `runners.default_memory_mb`. Absent on every other pool.
        auto:
          allOf: [{ $ref: "#/components/schemas/PoolAuto" }]
          readOnly: true
          description: >-
            Present on a pool the controller keeps from the hosts it has, with what an operator
            has asked of it and what the hosts in it give. Its `min_runners` and `max_runners`
            are worked out, not typed, and an edit may only change `idle_timeout` and `auto`.
            Absent on a pool somebody made.
        sizing:
          type: string
          enum: [automatic, elastic, profile, fixed]
          description: >-
            How this pool decides what one runner gets. `automatic` is one
            slot's share of whichever host it lands on, which is what a pool
            with no `cpus` and no `memory_mb` means; `elastic` keeps that share
            as its guarantee and may borrow unused CPU; `profile` is the size
            each host's runner profile names; `fixed` is the figures
            in `resources`, the same on every host.
        effective_minimum:
          type: object
          readOnly: true
          required: [cpus, memory_mb, cpus_inherited, memory_mb_inherited]
          description: >-
            The minimum this pool's runners are held to. Where the pool's own
            `resources.min_cpus` or `min_memory_mb` is zero, the fleet's
            `runners.minimum_cpus` / `minimum_memory_mb` applies instead, read
            live, unless it is at or above the pool's typed standard size.
            `resources` keeps the pool's own figures, so sending the pool back
            never makes an inherited minimum its own.
          properties:
            cpus: { type: number, description: The minimum in cores; zero is none. }
            memory_mb: { type: integer, format: int64, description: The minimum in MB; zero is none. }
            cpus_inherited: { type: boolean, description: Whether `cpus` is the fleet's figure rather than the pool's. }
            memory_mb_inherited: { type: boolean, description: Whether `memory_mb` is the fleet's figure rather than the pool's. }
            cpus_source: { type: string, enum: [pool, global], description: "Whose `cpus` is: the pool's own, or the fleet's `runners.minimum_cpus`. Absent where nobody set one. A host's own minimum is applied on top, per host: see `PoolHostSizing`." }
            memory_mb_source: { type: string, enum: [pool, global], description: Whose `memory_mb` is, as `cpus_source` is for CPU. }
        runner_settings: { $ref: "#/components/schemas/RunnerSettings" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        tmpfs: { $ref: "#/components/schemas/TmpfsConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        provider_selector:
          type: object
          additionalProperties: { type: string }
          description: >-
            Which providers may rent machines for this pool, matched against each
            provider's `name`, `kind` and machine labels, the way `host_selector` is matched
            against a host. Empty means any provider. A provider rents only where this and
            its own `pool_selector` both agree.
        env:
          type: object
          additionalProperties: { type: string }
          description: >-
            The environment injected into every runner this pool creates.
            Readable in full by operators and administrators; a viewer is sent
            the keys with empty values, because this is where a registry or
            proxy credential ends up and setting one is an operator action.
            The same applies to the pool.created and pool.updated events.
        run_as_root: { type: boolean }
        no_default_labels: { type: boolean, description: "Register runners with only the pool's own labels, without self-hosted, the operating system and the architecture (config.sh --no-default-labels). Only a non-ephemeral pool may set it: GitHub adds those labels to every just-in-time runner itself. A job asking for self-hosted no longer matches the pool unless the pool lists it." }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        counts:
          type: object
          properties:
            provisioning: { type: integer }
            registering: { type: integer }
            idle: { type: integer }
            busy: { type: integer }
            draining: { type: integer }
            failed: { type: integer }
            live: { type: integer }
        queued_jobs: { type: integer, description: "Jobs this pool has claimed and not yet started, less any an operator removed from the queue." }
        utilisation: { type: number, format: double }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
          description: The dangerous settings this pool has in effect, if any.

    CacheConfig:
      type: object
      description: Disposable performance cache mounted at /opt/zoomies-cache; it is not persistent workflow storage and may be evicted.
      required: [enabled, scope]
      properties:
        enabled: { type: boolean, default: false }
        scope:
          type: string
          enum: [pool, repository]
          default: pool
          description: >-
            Repository scope gives each repository its own cache. Under an
            organisation-targeted installation it needs `repository` set,
            because the installation alone does not say which repository the
            pool serves.
        size_limit:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Maximum bytes, enforced between one runner and the next by evicting
            whole cache entries, least recently modified first. Only a cache in
            a host directory can be measured, so a non-zero limit requires
            `source` to be an absolute host path. Zero is unlimited.
        source: { type: string, description: Optional absolute host directory or safe named-volume prefix. }
        repository:
          type: string
          description: >-
            The repository a repository-scoped cache belongs to, as owner/name.
            Required when the pool's installation targets an organisation, and
            left empty when it targets a single repository, which supplies it.
        tools:
          type: boolean
          default: false
          description: >-
            Keep the pool's tool cache -- where setup-python, setup-node,
            setup-go and setup-java unpack what they download -- between
            runners, in each host's shared folder
            (/var/lib/zoomies/shared/cache/tools), shared with the same runners
            as the cache above. Needs `enabled`, and a container backend. A job
            that can write to it can replace a tool the next job runs.

    TmpfsMount:
      type: object
      description: One runner folder kept in memory.
      required: [enabled]
      properties:
        enabled: { type: boolean, default: false }
        auto:
          type: boolean
          default: false
          description: >-
            Let each runner decide: the folder is in memory where the runner has room for it to be
            useful -- at least 2048 MB for the work folder, 1024 MB for /tmp, 4096 MB for the image
            store, or the size typed if that is smaller -- and on disk where it has not. Without it,
            an enabled folder is always in memory, fitted as small as the limit demands. Needs
            `enabled`. Where it kept a folder on disk the pool says so (`pool.tmpfs_auto_on_disk`).
        size_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The folder's ceiling in MB, at least 64. Zero sizes it from the runner's memory limit:
            the default (4096 MB for the work folder, 1024 MB for /tmp), shrunk so the folders
            together take no more than half of that limit.

    TmpfsConfig:
      type: object
      description: >-
        Which of a runner's folders are kept in memory (tmpfs) instead of on the host's disk.
        Opt-in, and off for every pool until somebody turns it on. A tmpfs is charged to the
        runner's memory limit, so what it may fill comes out of the limit rather than being
        added to it; a pool that turns it on is warned (`pool.tmpfs_memory_tight`) with the
        limit that would leave the job the room it has now. Needs the Docker or Podman backend.
        The shared pool cache is not covered: it cannot be a per-runner tmpfs because every runner
        would start with it cold. To keep that in memory, point its source at a directory the
        host mounts in memory and give it a size limit.
      properties:
        work:
          allOf:
            - $ref: "#/components/schemas/TmpfsMount"
          description: The runner's `_work` folder -- the checkout, build output and the runner's own temporary files. The one worth having.
        tmp:
          allOf:
            - $ref: "#/components/schemas/TmpfsMount"
          description: "`/tmp`. Separate because some toolchains put their heaviest traffic there and some jobs leave gigabytes in it."
        daemon:
          allOf:
            - $ref: "#/components/schemas/TmpfsMount"
          description: >-
            The Docker-in-Docker sidecar's image store, `/var/lib/docker` in the daemon's container: where every
            image a job pulls and every layer it builds is written. Needs `docker_mode: dind`. It is charged to
            the daemon's own memory limit -- its half of one slot's share for a pool sized by its host, the full
            typed limit otherwise -- and is a choice of its own because an image bigger than the mount does not
            pull. Left to size itself it is 8192 MB, fitted into half the daemon's limit.

    PoolsExport:
      type: object
      required: [export_version, exported_at, version, pools]
      properties:
        export_version: { type: integer }
        exported_at: { type: string, format: date-time }
        exported_from: { type: string, description: The address the source instance answers on. }
        version: { type: string, description: The Zoomies build that wrote it. }
        pools: { type: array, items: { $ref: "#/components/schemas/PoolDocument" } }

    PoolDocument:
      type: object
      description: One pool as a pools export carries it.
      required: [name, installation, labels, backend, platform, image, pull_policy, min_runners, max_runners, idle_timeout, ephemeral, docker_mode, resources, cpu_burst, memory_burst, runner_settings, cache, host_selector, env_keys, run_as_root, enabled]
      properties:
        name: { type: string }
        installation: { type: string, description: The organisation or owner/repository the pool's installation covers. }
        labels: { type: array, items: { type: string } }
        runner_group: { type: string }
        backend: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        image: { type: string }
        pull_policy: { type: string }
        runner_version: { type: string }
        min_runners: { type: integer }
        max_runners: { type: integer }
        repository_scale_up_limit: { type: integer }
        cost_per_runner_hour: { type: number, nullable: true }
        priority: { type: integer }
        idle_timeout: { type: string }
        ephemeral: { type: boolean }
        docker_mode: { type: string }
        resources: { $ref: "#/components/schemas/Resources" }
        cpu_burst: { $ref: "#/components/schemas/CPUBurstPolicy" }
        memory_burst: { $ref: "#/components/schemas/MemoryBurstPolicy" }
        runner_settings:
          type: object
          description: Every override, with null for one the pool does not make, so importing hands it back to the fleet.
          properties:
            provision_timeout: { type: string, nullable: true }
            drain_timeout: { type: string, nullable: true }
            max_runner_lifetime: { type: string, nullable: true }
            scale_up_delay: { type: string, nullable: true }
            docker_wait: { type: string, nullable: true }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        tmpfs: { $ref: "#/components/schemas/TmpfsConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        provider_selector:
          type: object
          additionalProperties: { type: string }
          description: >-
            Which providers may rent machines for this pool, matched against each
            provider's `name`, `kind` and machine labels, the way `host_selector` is matched
            against a host. Empty means any provider. A provider rents only where this and
            its own `pool_selector` both agree.
        env_keys:
          type: array
          items: { type: string }
          description: The environment variables the pool injects. Their values are never exported.
        run_as_root: { type: boolean }
        enabled: { type: boolean }
        no_default_labels: { type: boolean, description: The pool registers its runners with its own labels only. }
        size_from_profile: { type: boolean, description: The pool takes its runners' size from each host's runner profile. }

    PoolsImportRequest:
      type: object
      required: [document]
      properties:
        document: { type: string, description: A pools export, as text. YAML or JSON. }
        dry_run: { type: boolean, description: Plan and report; write nothing. }
        skip: { type: array, items: { type: string }, description: Names of pools in the document to leave out. }

    PoolsImportChange:
      type: object
      required: [pool, action, fields, warnings, env_keys]
      properties:
        pool: { type: string }
        action: { type: string, enum: [create, change, unchanged, refused] }
        fields:
          type: array
          description: Every setting for a create, the ones that move for a change, and none otherwise.
          items:
            type: object
            required: [field, current, incoming]
            properties:
              field: { type: string }
              current: { nullable: true, description: The pool's value here; null for a pool that does not exist yet. }
              incoming: { nullable: true, description: The document's value. }
        reason: { type: string, description: Why it is refused. }
        warnings: { type: array, items: { type: string }, description: What would not stop the import but should be known first. }
        env_keys: { type: array, items: { type: string }, description: Environment variables the source pool injected, to set by hand. }

    PoolsImport:
      type: object
      required: [applied, changes, summary]
      properties:
        applied: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/PoolsImportChange" } }
        summary:
          type: object
          required: [create, change, unchanged, refused, skipped]
          properties:
            create: { type: integer }
            change: { type: integer }
            unchanged: { type: integer }
            refused: { type: integer }
            skipped: { type: integer }

    PoolCreate:
      type: object
      required: [name, installation_id, labels, backend]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`. Beyond the brand, Zoomies' own convention is
            zoomies-<vcpu>vcpu[-<memory>gb]-<os>-<version>[-<arch>], so the name
            a workflow's runs-on carries says how much machine it is asking for.
            Any name is accepted.
          examples: [zoomies-4vcpu-ubuntu-2404]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        platform: { $ref: "#/components/schemas/Platform" }
        image:
          type: string
          description: >-
            Leave blank to follow the pool's platform, which selects a published
            zoomies-runner variant, or the instance default when the pool names
            no platform.
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, default: 0, minimum: 0 }
        max_runners: { type: integer, default: 4, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation limit, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer, default: 0 }
        idle_timeout: { allOf: [{ $ref: "#/components/schemas/Duration" }], default: "5m" }
        ephemeral: { type: boolean, default: true }
        docker_mode: { allOf: [{ $ref: "#/components/schemas/DockerMode" }], default: none }
        resources: { $ref: "#/components/schemas/Resources" }
        cpu_burst: { allOf: [{ $ref: "#/components/schemas/CPUBurstPolicy" }], default: { mode: observe, max_cpus: 0 } }
        memory_burst: { allOf: [{ $ref: "#/components/schemas/MemoryBurstPolicy" }], default: { mode: observe, max_memory_mb: 0, spill_mb: 0 } }
        runner_settings: { $ref: "#/components/schemas/RunnerSettings" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        tmpfs: { $ref: "#/components/schemas/TmpfsConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        provider_selector:
          type: object
          additionalProperties: { type: string }
          description: >-
            Which providers may rent machines for this pool, matched against each
            provider's `name`, `kind` and machine labels, the way `host_selector` is matched
            against a host. Empty means any provider. A provider rents only where this and
            its own `pool_selector` both agree.
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean, default: false }
        no_default_labels: { type: boolean, default: false, description: "Register runners with only the pool's own labels, without self-hosted, the operating system and the architecture (config.sh --no-default-labels). Only a non-ephemeral pool may set it: GitHub adds those labels to every just-in-time runner itself. A job asking for self-hosted no longer matches the pool unless the pool lists it." }
        size_from_profile: { type: boolean, default: false, description: "Size each runner from the host it lands on, as that host's runner profile says. Refused together with `resources.cpus` or `memory_mb`: a pool states its size or takes it from the host, never both." }
        enabled: { type: boolean, default: true }

    # A PATCH body: every field is optional, and only the ones present are
    # changed. It repeats PoolCreate's properties rather than composing them,
    # because `allOf` keeps the parent's `required` list however empty the
    # child's is -- which would make a one-field change (switching a blocked
    # pool's backend, say) impossible to express in a generated client.
    PoolUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The pool's name. Every pool name carries the brand, so a name sent
            without the `zoomies-` prefix is stored with one: `gpu` becomes
            `zoomies-gpu`.
          examples: [zoomies-linux-x64]
        installation_id: { type: string }
        labels: { type: array, items: { type: string }, minItems: 1 }
        runner_group: { type: string }
        backend: { $ref: "#/components/schemas/BackendKind" }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        runner_version: { type: string }
        min_runners: { type: integer, minimum: 0 }
        max_runners: { type: integer, minimum: 1 }
        repository_scale_up_limit: { type: integer, minimum: 0, description: Best-effort creation limit, not a strict execution concurrency cap. }
        cost_per_runner_hour: { type: number, minimum: 0, nullable: true }
        priority: { type: integer }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        ephemeral: { type: boolean }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        resources: { $ref: "#/components/schemas/Resources" }
        cpu_burst: { $ref: "#/components/schemas/CPUBurstPolicy" }
        memory_burst: { $ref: "#/components/schemas/MemoryBurstPolicy" }
        runner_settings: { $ref: "#/components/schemas/RunnerSettings" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        tmpfs: { $ref: "#/components/schemas/TmpfsConfig" }
        host_selector: { type: object, additionalProperties: { type: string } }
        provider_selector:
          type: object
          additionalProperties: { type: string }
          description: >-
            Which providers may rent machines for this pool, matched against each
            provider's `name`, `kind` and machine labels, the way `host_selector` is matched
            against a host. Empty means any provider. A provider rents only where this and
            its own `pool_selector` both agree.
        env: { type: object, additionalProperties: { type: string } }
        run_as_root: { type: boolean }
        no_default_labels: { type: boolean, description: "Register runners with only the pool's own labels, without self-hosted, the operating system and the architecture (config.sh --no-default-labels). Only a non-ephemeral pool may set it: GitHub adds those labels to every just-in-time runner itself. A job asking for self-hosted no longer matches the pool unless the pool lists it." }
        size_from_profile: { type: boolean, description: "Size each runner from the host it lands on, as that host's runner profile says. Refused together with `resources.cpus` or `memory_mb`: moving a pool from a stated size to one taken from the host clears them in the same request." }
        auto:
          allOf: [{ $ref: "#/components/schemas/PoolAutoUpdate" }]
          description: >-
            What an operator asks of a pool the controller keeps. Refused on a pool somebody made.
            On a pool the controller keeps, `idle_timeout`, `auto` and `memory_burst` are the only
            fields that may be changed, and any other is refused with its name.
        enabled: { type: boolean }

    # --- runners ----------------------------------------------------------
    CPUResourceState:
      type: object
      description: >-
        The live CPU state for a runner with an enforced CPU quota: lent spare CPU, held at
        its guarantee, throttled by host pressure, or -- on a pool with elastic CPU off --
        sitting exactly where it was put.
      properties:
        state: { type: string, enum: [observing, guaranteed, zoomies, maximum_zoomies, throttled, sit_and_stay] }
        label: { type: string, description: A short dog-themed operator label; clients should branch on state. }
        reason: { type: string, enum: [observe_only, base_allocation, spare_cpu_lent, host_pressure, elastic_off] }
        guaranteed_cpus: { type: number, format: double }
        current_cpus: { type: number, format: double }
        ceiling_cpus: { type: number, format: double }
        factor: { type: number, format: double }
        sized_for_cpus:
          type: integer
          description: >-
            The CPU count the runner's toolchains were told to size their workers for
            when it started (see `CPUBurstPolicy.size_for_ceiling`). Absent when they were
            told nothing.

    MemoryResourceState:
      type: object
      description: >-
        What the memory valve has done for a runner: memory lent beyond what it was created
        with, swap allowed, or what an observing valve would have done. Absent for a runner
        whose pool does not have the valve on and that holds no loan. A loan that was made stands
        after the valve is switched off, and is still reported.
      required: [state, mode, guaranteed_mb, current_mb, ceiling_mb, lent_mb]
      properties:
        state:
          type: string
          enum: [watching, observing, lent, spilled]
          description: >-
            `watching` is an automatic valve that has done nothing; `observing` is observe mode;
            `lent` is a runner holding memory beyond its guarantee; `spilled` is one that may also
            use swap beyond its limits.
        mode: { type: string, enum: [off, observe, automatic], description: What the agent was told to do. `off` for a runner whose pool has switched the valve off while a loan it made stands. }
        blocked:
          type: string
          enum: [at_ceiling, pool_empty, host_floor, unmeasured, unsupported, failed]
          description: >-
            The agent's latest word when it wanted to lend more and could not, or could not lend
            at all. Absent when nothing is in the way. Beside `state`, not instead of it: a runner
            can hold a loan and be at its ceiling.
        reason: { type: string, description: The sentence for the last decision that was not "healthy". }
        guaranteed_mb: { type: integer, format: int64, description: What the runner was created with, its containers together. }
        current_mb: { type: integer, format: int64, description: What its containers hold now. }
        ceiling_mb: { type: integer, format: int64, description: The most they may hold. }
        lent_mb: { type: integer, format: int64, description: "`current_mb` less `guaranteed_mb`. Only ever goes up while the runner lives." }
        spill_mb: { type: integer, format: int64, description: The swap the runner may use beyond its limits. }
        spill_allowed_mb: { type: integer, format: int64, description: The swap its pool allows each container. }
        would_lend_mb: { type: integer, format: int64, description: Observe mode only -- what the valve would hold if it were allowed to. }
        would_spill_mb: { type: integer, format: int64 }
        near_limit: { type: boolean, description: Whether the runner has come within a tenth of a memory limit at any point in its life. }
        raises: { type: integer, description: How many times a limit was raised for it. }

    RunnerScratch:
      type: object
      description: >-
        Which of a runner's folders its pool keeps in memory, as they were worked out when it was
        created. Recorded rather than recomputed, because a pool edited since would give a
        different answer than the one the running job was started with. Absent for a runner whose
        pool keeps none.
      required: [in_memory, folders]
      properties:
        in_memory: { type: integer, description: How many of the folders the runner was given in memory. }
        folders:
          type: array
          items: { $ref: "#/components/schemas/ScratchFolder" }

    ScratchFolder:
      type: object
      required: [kind, label, path, in_memory]
      properties:
        kind: { type: string, enum: [work, tmp, daemon] }
        label: { type: string, description: "A name for the folder: Work folder, Temporary folder, Docker image store." }
        path: { type: string, description: Where it is in the container. }
        in_memory: { type: boolean }
        size_mb: { type: integer, format: int64, description: What it was given, fitted to the runner's limit. Absent when it is on disk. }
        asked_mb: { type: integer, format: int64, description: "What the pool, or the host's standard for a folder the pool leaves to size itself, asked for." }
        auto: { type: boolean, description: The folder lets each runner decide where it lives. }
        why:
          type: string
          enum: [auto_too_small, host_off, unsupported, bound]
          description: Why a folder the pool wants in memory is on disk for this runner. Absent when it is in memory.
        note: { type: string, description: The sentence for `why`. }

    Runner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        host_id: { type: string }
        host_name: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        github_runner_id: { type: integer, format: int64 }
        container_id: { type: string }
        ephemeral: { type: boolean }
        labels: { type: array, items: { type: string } }
        image: { type: string }
        image_digest: { type: string, description: Immutable digest resolved by the host backend. }
        runner_version: { type: string }
        current_job_id: { type: string }
        current_job: { $ref: "#/components/schemas/Job" }
        message: { type: string }
        fault_kind:
          $ref: "#/components/schemas/FaultKind"
        fault_fix:
          type: string
          description: >-
            What to do about this runner's failure. Empty on a runner that did not fail. A
            runner that failed before ever taking a job is the case this exists for:
            nothing else in the system says why a pool's containers will not start, because
            the jobs it was meant for are still queued and none of them is marked failed.
        jobs_handled: { type: integer }
        resource_sample: { $ref: "#/components/schemas/WorkloadStats" }
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        allocated_cpus:
          type: number
          format: double
          description: >-
            The CPU quota this runner's workload was created with. Omitted when it has none.
            With `allocation_source` it is what tells an OOM kill or a slow job on a defaulted
            limit apart from one on a limit somebody set.
        allocated_memory_mb:
          type: integer
          format: int64
          description: The memory limit this runner's workload was created with. Omitted when it has none.
        allocation_source:
          type: string
          enum: [pool, host, profile, reduced, history, ""]
          description: >-
            Where the allocation came from: `pool` for the pool's own limits, `host` for one
            slot's share of the host it landed on (the default when the pool sets none),
            `profile` for the standard size of the host's runner profile -- or the fleet's
            default where the host names none -- for a pool that takes its size from the host,
            `reduced` for a runner no host had room for at the pool's standard size, given what
            one could spare at or above the pool's minimum, and `history` for a runner sized up
            to what the jobs waiting on its pool are known to need from their recent runs
            (`scheduler.history_sizing: on`). Omitted when the runner was created with no limit
            at all.
        cpu_resource: { $ref: "#/components/schemas/CPUResourceState" }
        memory_resource: { $ref: "#/components/schemas/MemoryResourceState" }
        scratch: { $ref: "#/components/schemas/RunnerScratch" }
        created_at: { type: string, format: date-time }
        container_started_at:
          type: string
          format: date-time
          description: >-
            When the runner's container (or process) started on its host. With registered_at
            it is what tells the two causes of a stuck runner apart: a container that never
            started is a backend or image problem on the host, and one that started and never
            registered is a credential, network or GitHub problem.
        registered_at:
          type: string
          format: date-time
          description: When the runner registered itself with GitHub.
        started_at: { type: [string, "null"], format: date-time }
        last_idle_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        cleanup_error:
          type: string
          description: >-
            Why Zoomies could not finish taking this runner away: a stop or remove the
            agent could not complete, or a registration GitHub would not delete. Empty is
            the normal case. A non-empty value means something is left behind (a container
            on its host, or a registration on the organisation) and it will not go away on
            its own. Zoomies retries, and this clears when it succeeds.
        cleanup_failed_at: { type: [string, "null"], format: date-time }
        cleanup_attempts:
          type: integer
          description: >-
            How many times cleanup has been tried. It is kept after a success, because how
            many tries it took is the difference between a blip and a host worth looking at.
        create_task_issued_at: { type: [string, "null"], format: date-time, description: "First create task delivered to the host; never overwritten by redelivery or removal. Absent for older runners." }
        host_removed_at: { type: [string, "null"], format: date-time, description: "Controller receipt of positive host removal confirmation, including the workload and work directory." }
        registration_deleted_at: { type: [string, "null"], format: date-time, description: "Controller confirmation that the GitHub registration is absent." }
        cleanup_estimated_at: { type: [string, "null"], format: date-time, description: "Historical cleanup estimate from an older build; not confirmation that both sides were removed." }
        cleaned_up_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The end of the runner's life: nothing of it left, on the host or on GitHub. The
            counterpart of `created_at` at the other end.

    RunnerDetail:
      allOf:
        - $ref: "#/components/schemas/Runner"
        - type: object
          properties:
            host: { $ref: "#/components/schemas/Host" }
            pool: { $ref: "#/components/schemas/Pool" }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
            logs_available: { type: boolean, description: False when the runner's host is unreachable, so the UI can say why rather than showing an empty log. }

    JobExplanation:
      type: object
      required: [job_id, state, summary, waiting, blocked, computed_at, class, confidence, evidence, log_excerpt, next_steps]
      properties:
        job_id: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        summary:
          type: string
          description: >-
            The sentence. Always set, including for a job that is running or finished:
            "nothing is wrong" is an answer to the question.
        detail: { type: string, description: What the summary leaves out, in the scheduler's own words where it has any. }
        fix: { type: string, description: What to do. Absent means there is nothing to do, which is different from not knowing. }
        waiting: { type: boolean, description: Whether the job is still waiting on something. }
        blocked:
          type: boolean
          description: >-
            Whether waiting will not on its own end it. A fleet that is merely busy clears;
            a pool nothing can place never will, and the two need different advice.
        pool_id: { type: string }
        runner_id: { type: string }
        host_id: { type: string }
        computed_at: { type: string, format: date-time }
        class:
          type: string
          description: >-
            The one-word answer, from a closed set. `oom`, `timeout`, `cancelled`,
            `queued-unmatched`, `queued-blocked`, `queued-capacity`, `queued`,
            `runner-startup-failure`, `host-lost`, `disk`, `workflow-failure`,
            `held-by-github`, `running`, `succeeded` or `unknown`; an `unknown` always
            says in `confidence_reason` what was missing.
          enum: [oom, timeout, cancelled, queued-unmatched, queued-blocked, queued-capacity, queued, runner-startup-failure, host-lost, disk, workflow-failure, held-by-github, running, succeeded, unknown]
        confidence:
          type: string
          enum: [high, medium, low]
          description: >-
            How far the class rests on a recorded fact: `high` is a fact the fleet wrote
            down, `medium` an inference or a fact with a gap in it, `low` a guess.
        confidence_reason: { type: string, description: What data was missing, whenever confidence is not high. }
        evidence:
          type: array
          description: The facts the class rests on, each one a person can check. Never null.
          items: { $ref: "#/components/schemas/ExplanationEvidence" }
        log_excerpt:
          nullable: true
          description: >-
            The runner's kept lines leading up to the one that decided the class. Null
            when none were asked for (`logs=0`); an excerpt with no lines and a `note`
            when the fleet kept none. Scrubbed of control characters, and untrusted: a
            workflow wrote it.
          allOf: [{ $ref: "#/components/schemas/LogExcerpt" }]
        problem_code: { type: string, description: The catalog's problem code this class is an instance of, when one applies. }
        check_code: { type: string, description: The catalog's Kennel check code, when one applies. }
        next_steps:
          type: array
          description: What to do, in the order to do it. Never null.
          items: { $ref: "#/components/schemas/ExplanationNextStep" }

    ExplanationEvidence:
      type: object
      required: [kind, label, value]
      properties:
        kind:
          type: string
          description: >-
            `exit_code`, `signal`, `memory_limit`, `memory_peak`, `queue_wait`,
            `host_state`, `plan_reason`, `fault_kind`, `conclusion`, `pool_missing`,
            `labels` or `log_line`.
        label: { type: string }
        value: { type: string }
        unit: { type: string, description: "`MB` or `s`, when the value is a figure." }
        ref: { type: string, description: "Where the evidence lives, as a path in this UI (`/hosts/{id}`) or a URL." }

    ExplanationNextStep:
      type: object
      required: [text, kind]
      properties:
        text: { type: string }
        kind:
          type: string
          enum: [read, change, rerun]
          description: Something to read, something to change, or the re-run that follows a change.
        link: { type: string, description: A path in this UI, or a documentation URL. }

    LogExcerpt:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [n, text]
            properties:
              n: { type: integer, description: The line's number, counted from the first line the fleet kept. }
              text: { type: string }
              decisive: { type: boolean, description: True on the one line that decided the class. }
        note: { type: string, description: Why there are no lines, when there are none. }

    Recovery:
      type: object
      required: [fenced]
      properties:
        fenced: { type: boolean }
        reason:
          type: string
          description: Why the fence is on -- normally the backup this database was restored from.

    TransferProgress:
      type: object
      required: [draining, ready, live_runners, busy_runners, pending_cleanup, active_jobs, machine_operations]
      properties:
        draining: { type: boolean }
        ready: { type: boolean }
        live_runners: { type: integer }
        busy_runners: { type: integer }
        pending_cleanup: { type: integer }
        active_jobs: { type: integer }
        machine_operations: { type: integer }

    TransferInfo:
      type: object
      required: [version, prepared, inventory]
      properties:
        version: { type: integer }
        prepared: { type: boolean }
        inventory:
          type: object
          additionalProperties: { type: integer, format: int64 }

    Backup:
      type: object
      description: One backup, as the Backups tab lists it. The manifest's facts are lifted out flat.
      required: [id, taken_at, source, location, bytes, total_bytes, schema_migrations, secrets, key_matches, key_included, restorable]
      properties:
        transfer: { $ref: "#/components/schemas/TransferInfo" }
        id: { type: string, description: The backup's directory name., examples: [zoomies-20260916-120000] }
        taken_at: { type: string, format: date-time }
        source:
          type: string
          enum: [cli, manual, scheduled, uploaded, fetched, pre-migration]
          description: >-
            Who took it. `pre-migration` is a copy the store took before applying
            migrations, and `fetched` one pulled back out of a backup remote.
            Neither an uploaded nor a fetched backup is counted or removed by
            retention.
        taken_by: { type: string }
        location:
          type: string
          enum: [backups, pre-migration]
          description: Which directory it is in.
        bytes: { type: integer, format: int64, description: The database's size. }
        total_bytes: { type: integer, format: int64, description: The whole directory, which is larger when the key is in it. }
        version: { type: string, description: The build that wrote it. }
        schema_latest: { type: string, description: The newest migration the copy had taken. }
        schema_migrations: { type: integer }
        integrity: { type: string }
        secrets: { type: integer, description: How many sealed credentials the key is needed for. }
        key_fingerprint: { type: string }
        key_matches:
          type: [boolean, "null"]
          description: Whether this host holds the key that sealed it. Null when the backup does not say.
        key_included: { type: boolean, description: The encryption key is in the backup, which makes it a credential. }
        restorable: { type: boolean, description: Every check a restore would make passes, from what the manifest says. }
        restore_problem: { type: string, description: Why not, or a caveat when it is. }
        problem: { type: string, description: Something wrong with the backup itself. }

    Backups:
      type: object
      required: [items, directory, database_bytes, disk_free_bytes, schedule, remotes, running, staged_restore, last_restore, restarting]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        directory: { type: string, description: Where backups are kept, resolved. }
        database_bytes: { type: integer, format: int64, description: The live database's size, which is roughly what a backup costs. }
        disk_free_bytes:
          type: [integer, "null"]
          format: int64
          description: Room beside the backup directory, when the platform can say.
        key_fingerprint: { type: string, description: This host's encryption key. }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }
        remotes:
          type: array
          items: { $ref: "#/components/schemas/BackupRemote" }
          description: >-
            Every destination `backup.remotes` configures and what became of it.
            Empty is the default: nothing leaves the host until somebody says where
            it goes.
        running: { type: boolean, description: A backup is being taken right now. }
        staged_restore:
          oneOf:
            - $ref: "#/components/schemas/StagedRestore"
            - type: "null"
        last_restore:
          oneOf:
            - $ref: "#/components/schemas/RestoreOutcome"
            - type: "null"
        restarting: { type: boolean, description: This process has been asked to stop, so wait for the next one. }

    BackupRemote:
      type: object
      required: [name, where, endpoint, encrypted, keep, disabled, source, path_style, shadowed, uploading, copies, bytes, listed_at, last_upload_at]
      properties:
        name: { type: string, description: What this destination is called, and what the API addresses it by. }
        source:
          type: string
          enum: [file, database]
          description: >-
            Where this destination is described: `file` for zoomies.yaml and the
            environment, `database` for one added on the Backups page. Only the
            stored ones can be edited over the API.
        id: { type: string, description: The stored destination's row id; absent for one the file describes. }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        access_key_id: { type: string, description: The credential's id. The secret beside it is sealed and never served. }
        path_style:
          type: [boolean, "null"]
          description: Null asks for the style to be chosen from the endpoint.
        shadowed:
          type: boolean
          description: >-
            A stored destination the file overrides by name. Nothing is sent to
            it; it is listed so that a row which quietly does nothing is visible
            rather than mysterious.
        problem:
          type: string
          description: >-
            Why this destination cannot be used at all, almost always that this
            instance's encryption key does not open its stored secrets.
        has_secret_key: { type: boolean, description: A secret key is stored for this destination. }
        where: { type: string, description: The bucket and prefix. }
        endpoint: { type: string, description: The S3-compatible service it talks to. }
        encrypted: { type: boolean, description: The archive is sealed with a passphrase before it leaves this host. }
        keep: { type: integer, description: How many copies this remote holds; 0 keeps every one. }
        disabled: { type: boolean, description: Configured and switched off, shown rather than hidden. }
        uploading: { type: boolean, description: Something is being sent right now. }
        copies: { type: integer, description: What the last listing found. }
        bytes: { type: integer, format: int64 }
        listed_at: { type: [string, "null"], format: date-time }
        last_upload_at: { type: [string, "null"], format: date-time }
        last_upload_id: { type: string }
        last_error: { type: string, description: Why the last attempt did not work, in the service's own words. }

    BackupRemoteInput:
      type: object
      description: >-
        A destination to store or change. Every field is optional on a PATCH, so
        a body carries only what somebody actually changed.
      properties:
        name: { type: string, description: Lower-case letters, digits and dashes. }
        endpoint: { type: string, description: The service's URL; its scheme decides whether the connection is encrypted. }
        region: { type: string, description: What requests are signed for. Empty is us-east-1. }
        bucket: { type: string }
        prefix: { type: string, description: The key prefix, so one bucket can hold several fleets. }
        access_key_id: { type: string }
        secret_access_key:
          type: string
          format: password
          description: Sealed with the instance key and never served back. An empty string clears it.
        passphrase:
          type: string
          format: password
          description: >-
            Seals the archive before it is uploaded. Sealed at rest and never served
            back; an empty string clears it, which sends the plain archive.
        path_style: { type: [boolean, "null"] }
        keep: { type: integer, description: How many copies this destination holds; 0 keeps every one. }
        enabled: { type: boolean }

    RemoteBackupCopy:
      type: object
      required: [remote, id, key, bytes, stored_at, taken_at, encrypted]
      properties:
        remote: { type: string }
        id: { type: string, description: The backup's own id, read back out of the object key. }
        key: { type: string, description: The object's full key, which is what finds it with any other tool. }
        bytes: { type: integer, format: int64, description: The archive's size, which is the compressed database rather than the database. }
        stored_at: { type: string, format: date-time, description: When the object was written, from the service. }
        taken_at: { type: string, format: date-time, description: When the backup was taken, from its id. }
        encrypted: { type: boolean }

    RemoteBackupCopies:
      type: object
      required: [remote, items, bytes]
      properties:
        remote: { $ref: "#/components/schemas/BackupRemote" }
        items: { type: array, items: { $ref: "#/components/schemas/RemoteBackupCopy" } }
        bytes: { type: integer, format: int64, description: What the copies add up to. }

    RemoteBackupCheck:
      type: object
      required: [name, where, ok, checked_at]
      properties:
        name: { type: string }
        where: { type: string }
        ok: { type: boolean }
        checked_at: { type: string, format: date-time }
        error: { type: string, description: The service's own refusal, worded so that a wrong secret, a missing bucket and a drifted clock read differently. }

    BackupShipment:
      type: object
      required: [sent]
      properties:
        sent: { type: array, items: { $ref: "#/components/schemas/RemoteBackupCopy" } }
        error: { type: string, description: What stopped one destination, when the others still went. }

    BackupPruning:
      type: object
      required: [keep, removed, remotes]
      description: >-
        What applying retention removed. It is reported per destination rather
        than as one total because the numbers disagree on purpose: this host keeps
        `backup.keep` copies and each bucket keeps its own.
      properties:
        keep: { type: integer, description: "`backup.keep` as the pass read it; 0 keeps every copy and removes nothing from this host." }
        removed: { type: array, items: { type: string }, description: The backups deleted from the backup directory. }
        error: { type: string, description: Why the directory could not be pruned. }
        remotes: { type: array, items: { $ref: "#/components/schemas/RemotePruning" } }

    RemotePruning:
      type: object
      required: [name, keep, removed]
      properties:
        name: { type: string }
        keep: { type: integer, description: This destination's own retention; 0 keeps every copy. }
        removed: { type: array, items: { type: string } }
        error: { type: string, description: The service's own refusal, so a bucket that would not answer reads differently from one that had nothing to remove. }

    BackupSchedule:
      type: object
      required: [enabled, interval, keep, next_due_at, last_scheduled_at]
      properties:
        enabled: { type: boolean }
        interval: { $ref: "#/components/schemas/Duration" }
        keep: { type: integer }
        next_due_at: { type: [string, "null"], format: date-time }
        last_scheduled_at: { type: [string, "null"], format: date-time }
        last_scheduled_id: { type: string }
        last_error: { type: string, description: Why the last scheduled backup failed, when it did. }

    BackupVerification:
      type: object
      required: [checked_at, ok, integrity, digest_known, digest_matches, schema_readable, migrations, problems]
      properties:
        checked_at: { type: string, format: date-time }
        ok: { type: boolean }
        integrity: { type: string, description: SQLite's own answer -- `ok`, or what it found. }
        digest_known: { type: boolean, description: The manifest recorded a digest to compare against. }
        digest_matches: { type: boolean }
        schema_readable: { type: boolean, description: This build can open it. }
        migrations: { type: integer }
        latest: { type: string }
        problems: { type: array, items: { type: string } }

    StagedRestore:
      type: object
      required: [backup_id, dir, requested_at, revoke_api_tokens, reset_agent_tokens]
      properties:
        source_stopped: { type: boolean }
        backup_id: { type: string }
        dir: { type: string }
        taken_at: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        requested_by: { type: string }
        revoke_api_tokens: { type: boolean }
        reset_agent_tokens: { type: boolean }

    RestoreOutcome:
      type: object
      required: [backup_id, attempted_at, ok]
      properties:
        backup_id: { type: string }
        attempted_at: { type: string, format: date-time }
        ok: { type: boolean }
        error: { type: string, description: "Why the restore did not finish. When it failed after the copy, the message says which database is in place and whether it is fenced." }
        report: { $ref: "#/components/schemas/RestoreReport" }

    RestoreReport:
      type: object
      required: [source, key_checked, invalidated, fenced]
      properties:
        source: { type: string }
        moved_aside: { type: string, description: Where the database that was there went. }
        moved_logs: { type: array, items: { type: string } }
        key_checked: { type: boolean }
        manifest_problem: { type: string }
        invalidated: { type: array, items: { type: string }, description: What the restore took away, one line each. }
        fenced: { type: string, description: The reason recorded on the fence. }

    Restarting:
      type: object
      required: [restarting, message]
      properties:
        restarting: { type: boolean }
        message: { type: string }

    SupportBundle:
      type: object
      required: [bundle_version, generated_at, instance, errors]
      properties:
        bundle_version:
          type: integer
          description: >-
            The shape's own number, so a reader given a bundle out of context knows what
            it is looking at. It moves when a section is removed or renamed, not when one
            is added.
        generated_at: { type: string, format: date-time }
        instance: { $ref: "#/components/schemas/BundleInstance" }
        config:
          type: object
          additionalProperties: true
          description: The effective configuration, the same key-by-key rendering /settings serves.
        findings:
          type: array
          description: The configuration validator's findings, the same list /settings carries.
          items: { $ref: "#/components/schemas/Problem" }
        problems:
          type: object
          description: Everything currently wrong, the same shape /problems serves.
          required: [ok, items]
          properties:
            ok: { type: boolean }
            items:
              type: array
              items: { $ref: "#/components/schemas/Problem" }
        stats: { $ref: "#/components/schemas/Stats" }
        installations:
          type: array
          items: { $ref: "#/components/schemas/Installation" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/Pool" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        providers:
          type: array
          description: The providers this fleet rents from, the same shape /providers serves.
          items: { $ref: "#/components/schemas/Provider" }
        machines:
          type: array
          description: The machines it is renting, newest first and excluding the ones whose resource is confirmed gone.
          items: { $ref: "#/components/schemas/Machine" }
        runners:
          type: array
          items: { $ref: "#/components/schemas/Runner" }
        jobs:
          type: array
          description: >-
            The work in flight rather than the history. A bundle is taken because
            something is stuck, and finished jobs would be most of the bytes while
            answering none of it.
          items: { $ref: "#/components/schemas/Job" }
        explanations:
          type: array
          description: The controller's own answer for each unfinished job, the same one the drawer and the CLI render.
          items: { $ref: "#/components/schemas/JobExplanation" }
        scaling_events:
          type: array
          items: { $ref: "#/components/schemas/ScalingEvent" }
        logs: { $ref: "#/components/schemas/BundleLogs" }
        errors:
          type: array
          description: Why a section is missing. A bundle with nine sections and a named failure is worth more than a 500.
          items: { $ref: "#/components/schemas/BundleError" }
        truncated:
          type: array
          items: { $ref: "#/components/schemas/BundleTruncation" }

    BundleInstance:
      type: object
      description: What this process is and how it is doing -- the half of a bug report that is never in the fleet's own rows.
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go: { type: string }
        os: { type: string }
        arch: { type: string }
        cpus: { type: integer }
        goroutines: { type: integer }
        heap_in_use_bytes: { type: integer, format: int64 }
        config_path: { type: string }
        database_path: { type: string }
        schema_applied: { type: integer }
        schema_latest: { type: string }
        event_subscribers: { type: integer }
        polling_only: { type: boolean }
        poller_enabled: { type: boolean }
        poller_last_poll_at: { type: string, format: date-time }
        loop_panics:
          type: array
          description: >-
            The one fact here that is always a bug in Zoomies. A loop that panicked was
            restarted and the fleet carried on, so nothing else in a bundle would show it.
          items:
            type: object
            properties:
              loop: { type: string }
              count: { type: integer }
              last: { type: string }
              at: { type: string, format: date-time }

    BundleLogs:
      type: object
      description: Where the logs are, rather than the logs.
      properties:
        note: { type: string, description: Why the bodies are not here. }
        runners:
          type: array
          items:
            type: object
            properties:
              runner_id: { type: string }
              name: { type: string }
              state: { $ref: "#/components/schemas/RunnerState" }
              pool_id: { type: string }
              download: { type: string, description: The route that fetches this runner's log. }

    BundleError:
      type: object
      required: [section, error]
      properties:
        section: { type: string }
        error: { type: string }

    BundleTruncation:
      type: object
      required: [section, reason]
      properties:
        section: { type: string }
        kept: { type: integer, description: How many rows survived, where the cap was a row count. }
        reason: { type: string }

    TimelineEntry:
      type: object
      properties:
        state: { $ref: "#/components/schemas/RunnerState" }
        stage:
          type: string
          description: >-
            A finer point within the state, when one was observed: the image was pulled,
            the container started, the runner registered with GitHub.
          enum: [image_pulling, container_started, registered]
        at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64, description: How long the runner stayed in this state. }
        message: { type: string }

    # --- jobs -------------------------------------------------------------
    Job:
      type: object
      properties:
        provisioning: { type: string, enum: ["", paused, deleted], description: "Operator demand control; empty means ready." }
        provision_now: { type: boolean, description: Expedite demand within pool priority and bypass scale-up delay. }
        cancel_requested_at:
          type: string
          format: date-time
          description: >-
            When an operator's cancellation of this job's workflow run was accepted by
            GitHub, absent when none was. GitHub's completion delivery still settles the
            conclusion and can be minutes behind, so until it arrives the job reads
            `queued` or `in_progress` while being neither: the queued half raises no
            demand and the running half has had its runner taken away. Once the job
            completes this is history and the conclusion says what happened.
        id: { type: string }
        github_job_id: { type: integer, format: int64 }
        github_run_id: { type: integer, format: int64 }
        repo: { type: string }
        workflow: { type: string }
        job_name: { type: string }
        labels: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/JobState" }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        installation_id:
          type: string
          description: >-
            The GitHub App installation covering this job's repository, resolved when the job
            was first recorded. Read-only. A pool only ever runs work in its own installation's
            target, so a pool whose labels fit is still not eligible unless this matches it.
            Empty when no installation here covers the repository.
        pool_id: { type: string }
        pool_name: { type: string }
        runner_id: { type: string }
        runner_name: { type: string }
        html_url: { type: string, description: The run on GitHub. }
        matched: { type: boolean, description: "False when no enabled pool claims this job's labels. On a job that is not queued this only says the job ran somewhere else." }
        eligible_at: { type: string, format: date-time, description: "When this fleet could first have acted on the job - an enabled pool claiming its labels. The start of the scheduling-latency interval, and deliberately not queued_at: the wait before anything could run the job is not this fleet's. Absent on a job nothing has claimed." }
        hosted: { type: boolean, description: "True when every label names GitHub's own runners or a hosted-runner vendor's, so a job no pool here claims is theirs to run rather than stuck." }
        head_branch: { type: string, description: The branch the run was for. }
        head_sha: { type: string }
        run_attempt: { type: integer, description: "1 for a first run; higher when the run was re-run." }
        run_number:
          type: integer
          format: int64
          description: >-
            GitHub's own sequential number for this workflow run - the "#1009" its Actions UI
            shows next to the workflow name, for cross-referencing the two. Zero until a
            workflow_run lookup backfills it, since the webhook that recorded the job never
            carries it.
        controller_version:
          type: string
          description: >-
            The controller version that claimed the job, stamped once and never rewritten,
            so jobs can be grouped by release. Absent on a job recorded before this field
            existed and on one no pool here claimed; neither is guessed at. Filter with
            `controller_version=unknown` to find them.
        controller_channel: { type: string, description: The install channel of that controller build. }
        agent_version: { type: string, description: The agent version the host reported when a runner on it took the job. }
        host_id: { type: string, description: The host the job's runner was on, as stamped when the runner took it. }
        peak_cpus:
          type: number
          description: >-
            The most CPU, in cores, the job's runner was measured using while the job ran on
            it -- the agent's usage samples, raised and never lowered. Absent when it was
            never measured: a job from before this was recorded, a backend that reports no
            usage, or a job too short to be sampled.
        peak_memory_mb:
          type: integer
          format: int64
          description: The most memory, in MB, the job's runner was measured using while the job ran. Absent when never measured.
        oom_killed:
          type: boolean
          description: >-
            True when the kernel killed the job's runner, or one of its steps (exit 137), for
            its memory limit. It is the fleet's failure rather than the workflow's, and the one
            `scheduler.history_sizing` corrects for: the next run of the job is placed for half
            as much memory again as this one's peak. Absent when false.
        granted_cpus:
          type: number
          format: double
          description: >-
            The guaranteed CPU of the machine the job ran on -- for a docker-in-docker runner
            with a typed size, the runner's and its daemon's together -- copied from the
            runner when it took the job and never rewritten. CPU lent to the runner later is
            not part of it. Absent on a job from before sizes were recorded, and on a runner
            created with no limits.
        granted_memory_mb: { type: integer, format: int64, description: The guaranteed memory of that machine, in MB, recorded the same way. }
        granted_source:
          type: string
          enum: [pool, host, profile, reduced, history]
          description: Where the granted size came from, as a runner's `allocation_source` says it.
        size_class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: >-
            The class the controller put the job in when it was queued, which says how big a
            host it should be on. Absent on a job nobody classed, which is every job while
            `scheduler.size_routing` is `off`.
        size_basis:
          type: string
          enum: [explicit, pin, history, default]
          description: >-
            How `size_class` was decided, in the order of authority: `explicit` for a size
            label in the job's own `runs-on`, `pin` for an operator's pin, `history` for what
            its earlier runs used, `default` for a job nothing is known about.
        size_reason:
          type: string
          description: >-
            Why, in a sentence that finishes "classed medium because": the measurement, the
            pin or the label. Written by the controller and worded for a person.
        size_floor_mb:
          type: integer
          format: int64
          description: The memory, in MB, the job's runs show it needing. Absent when its class did not come from its runs.
        routed_class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: >-
            The class of pool the job is routed to while it waits. It is `size_class` unless
            the job was sent elsewhere because its own class had no pool or no room, and it is
            absent while size routing is only being watched: the class is recorded and the job
            goes where it always did.
        routed_note:
          type: string
          description: Why the job was sent to a class other than its own, as a sentence. Absent on a job that was not.
        ran_class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: >-
            The class of the host whose runner took the job, stamped once when it did. Where it
            differs from `size_class` the job ran somewhere other than where it was classed,
            which for a job that only asked for the base label is GitHub choosing the runner
            and not a fault.
        throttled_share:
          type: [number, "null"]
          description: >-
            The share of its CPU periods the job's runner was held back in by its CPU limit, from
            0 to 1. It is what tells a job that wants more CPU from one that is merely busy, and
            null when the agent never sampled it.
        steps:
          type: array
          description: >-
            The job's steps as GitHub last reported them. A completed job carries every
            step with its conclusion; a running one carries them mid-flight.
          items: { $ref: "#/components/schemas/JobStep" }
        failed_step:
          description: >-
            The step a completed job stopped at: the first that did not succeed, whether the
            job failed there or was cancelled there. Null when every step succeeded or while
            the job is still running. Worked out by the server so every client names the same step.
          oneOf:
            - $ref: "#/components/schemas/JobStep"
            - type: "null"
        runner_fault:
          type: string
          description: >-
            Set when the runner of this fleet that was executing the job stopped before
            GitHub reported the job over -- the fleet's own explanation of a failure GitHub
            records like any other. Empty when the runner did nothing wrong.
        fault_kind:
          $ref: "#/components/schemas/FaultKind"
        fault_domain:
          type: string
          enum: [fleet, workflow]
          description: >-
            Whose the failure is. `fleet` means this deployment is the reason the job went
            wrong; `workflow` means the job failed on its own merits and the fleet did its
            part. Empty on a job that did not fail. GitHub records both as "failure", which
            is the whole reason this field exists: the two need completely different people.
        fault_fix:
          type: string
          description: >-
            What to do about a fault of this kind, in the words of the person who has to do
            it. Empty when there is nothing to do, which is different from not knowing.
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        queue_wait_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }

    SizeClass:
      type: string
      enum: [small, medium, large]
      description: >-
        A size of host, and of the runner a job is put on. A host is in the class its
        allocatable CPU and memory name -- the lower of the two -- unless an operator's `size`
        tag says otherwise, and a job is in the smallest class whose runner holds what its
        runs used. What each class is is in `GET /auto-pools`.

    HostTag:
      type: object
      required: [key, value, source]
      properties:
        key: { type: string }
        value: { type: string }
        source:
          type: string
          enum: [operator, automatic]
          description: >-
            `operator` for a label stored on the host, whether its join token pinned it, its
            agent declared it or an operator edited it in -- the host does not tell those apart --
            and `automatic` for one the controller derives from the machine and never stores:
            `os`, `arch` and, while a size switch is not `off`, `size`.
        overrides:
          type: string
          description: On an `operator` tag, the value the host would have had automatically, when the tag replaced it with a different one.

    HostSizeClass:
      type: object
      required: [class, source, reason]
      properties:
        class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: "The class in force: the operator's `size` tag where there is one, the class the host's measurements put it in otherwise."
        source:
          type: string
          enum: [measured, tag]
        measured:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: What the host's CPU and memory name right now, present only when it is not the class in force.
        pending:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: >-
            A different class the host's measurements have named without a break since
            `pending_since`. A host moves only after `scheduler.size_class_hold`, so a machine
            that measures either side of a limit does not hop between pools.
        pending_since: { type: string, format: date-time }
        pending_until: { type: string, format: date-time, description: "When the host moves, if its measurements keep naming `pending`." }
        reason: { type: string, description: "What put the host in `class`, as a sentence." }

    HostAutoPool:
      type: object
      required: [counted]
      properties:
        counted: { type: boolean, description: "True when the host's slots count towards an automatic pool's maximum." }
        pool: { type: string, description: "The pool's name; under `shadow`, the pool that would be made." }
        pool_id: { type: string, description: "Absent while the pool does not exist yet." }
        reason: { type: string, description: "When `counted` is false, why, as a sentence." }
        reason_code:
          type: string
          enum: [cordoned, incompatible, silent, unclassified, bad_size_label, unknown_architecture, no_backend]

    PoolAuto:
      type: object
      required: [key, arch, class, warm, cap, paused, kept, hosts, slots, summary]
      properties:
        key: { type: string, description: "The architecture and class the pool is kept for, `amd64/medium`." }
        arch: { type: string, enum: [amd64, arm64] }
        class: { $ref: "#/components/schemas/SizeClass" }
        warm: { type: integer, description: "Runners the operator asked to keep ready. The pool's minimum is this, or its maximum where that is lower. Zero is none." }
        cap: { type: integer, description: "The most runners the operator allows, however many slots the hosts give. Zero is no cap." }
        paused: { type: boolean, description: "The operator has taken the pool out of use. It stays out whatever its hosts do." }
        kept: { type: boolean, description: "Whether the controller is keeping the pool now: `scheduler.auto_pools` is `on` and the pool belongs to the installation automatic pools are kept for. A pool that is not kept holds the limits it had, takes a pause at once, applies a cap or a warm count when it is kept again, and can be deleted without being made again." }
        hosts:
          type: array
          items: { type: string }
          description: The hosts that count towards the pool, as of the last pass of the reconciler.
        slots: { type: integer, description: "The runners those hosts hold between them, before any cap." }
        summary: { type: string, description: "What the pool is and where its maximum comes from, as a sentence." }

    PoolAutoUpdate:
      type: object
      properties:
        warm: { type: integer, minimum: 0 }
        cap: { type: integer, minimum: 0 }
        paused: { type: boolean }

    AutoPoolSummary:
      type: object
      required: [key, name, hosts, slots]
      properties:
        key: { type: string }
        name: { type: string }
        pool_id: { type: string, description: "Absent while the pool does not exist yet." }
        hosts: { type: array, items: { type: string } }
        slots: { type: integer }

    AutoPoolFinding:
      type: object
      description: Something the controller could not do, and what to change.
      required: [code, subject, message, fix]
      properties:
        code: { type: string, enum: ["auto_pool.name_taken", "auto_pool.label_taken", "auto_pool.host_skipped"] }
        subject: { type: string }
        message: { type: string }
        fix: { type: string }

    AutoPoolSkip:
      type: object
      required: [host, host_id, reason, message]
      properties:
        host: { type: string }
        host_id: { type: string }
        reason: { type: string, enum: [cordoned, incompatible, silent, unclassified, bad_size_label, unknown_architecture, no_backend] }
        message: { type: string, description: "What it means for the host, as a sentence." }

    AutoPoolPending:
      type: object
      description: A change the controller would make and has not, because `scheduler.auto_pools` is `shadow`, or because it may not act.
      required: [kind, key, pool, cause]
      properties:
        kind: { type: string, enum: [create, resize, enable, disable, reshape] }
        key: { type: string }
        pool: { type: string }
        cause: { type: string }

    SizeClassLimits:
      type: object
      required: [class, label, runner_cpus, runner_memory_mb]
      properties:
        class: { $ref: "#/components/schemas/SizeClass" }
        label: { type: string, description: "The `runs-on` label that asks for the class by name, `zoomies-large`.", examples: [zoomies-large] }
        host_max_cpus: { type: number, description: "The most allocatable CPUs a host in the class has. Absent for the largest class, which has no limit above." }
        host_max_memory_mb: { type: integer, format: int64 }
        runner_cpus: { type: number, description: "The CPUs of one runner in the class where a host's profile names none." }
        runner_memory_mb: { type: integer, format: int64 }

    AutoPools:
      type: object
      required: [size_routing, auto_pools, pools, findings, skipped, pending, classes, default_class]
      properties:
        size_routing: { type: string, enum: [off, shadow, on], description: "`scheduler.size_routing`." }
        auto_pools: { type: string, enum: [off, shadow, on], description: "`scheduler.auto_pools`." }
        installation: { type: string, description: "The organisation or repository whose installation the pools belong to. Absent while there is none." }
        problem: { type: string, description: "Why there is no installation to keep pools for. Absent when there is." }
        at: { type: [string, "null"], format: date-time, description: "When the last pass ran." }
        pools:
          type: array
          items: { $ref: "#/components/schemas/AutoPoolSummary" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/AutoPoolFinding" }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/AutoPoolSkip" }
        pending:
          type: array
          items: { $ref: "#/components/schemas/AutoPoolPending" }
        classes:
          type: array
          items: { $ref: "#/components/schemas/SizeClassLimits" }
        default_class: { $ref: "#/components/schemas/SizeClass" }
        hold: { $ref: "#/components/schemas/Duration" }
        fallback_wait: { $ref: "#/components/schemas/Duration" }
        host_grace: { $ref: "#/components/schemas/Duration" }

    SizePin:
      type: object
      required: [repo, class]
      properties:
        repo: { type: string, description: "As GitHub writes it, owner/name; compared without regard to case." }
        workflow: { type: string, description: "Absent on a repository's pin." }
        job_name: { type: string, description: "Absent on a repository's pin." }
        class: { $ref: "#/components/schemas/SizeClass" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    SizePinRequest:
      type: object
      required: [repo, class]
      properties:
        repo: { type: string }
        workflow: { type: string, description: "Name this and `job_name` to pin one job, or neither to pin the repository." }
        job_name: { type: string }
        class: { $ref: "#/components/schemas/SizeClass" }

    SizePinResult:
      type: object
      required: [pin, reclassified]
      properties:
        pin: { $ref: "#/components/schemas/SizePin" }
        reclassified: { type: integer, description: "How many jobs that were already waiting changed class." }

    LabelAdvice:
      type: object
      required: [repo, workflow, job_name, kind, state, min_runs, class, recommended_class, reason, runs, labels, message, fix]
      properties:
        repo: { type: string }
        workflow: { type: string }
        job_name: { type: string }
        kind:
          type: string
          enum: [too_small, unguaranteed, too_large, ""]
          description: What is wrong. Empty for a row in the `not_enough_data` state.
        state:
          type: string
          enum: [ok, not_enough_data]
          description: >-
            `ok`, or `not_enough_data` for a job the fleet has measured fewer than `min_runs`
            runs of; such a row carries its count and figures and no advice.
        min_runs:
          type: integer
          description: How many measured runs a job needs before it is advised on, so a client can say "N of 5" from the payload.
        asked:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: The class the job names in its `runs-on`. Absent when it names none.
        class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: The class its measured runs call for.
        recommended_class:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: The same class under the name the advice gives it, the one `fix` would have the workflow write.
        reason: { type: string, description: "The class rule's own sentence for the recommended class." }
        runs: { type: integer, description: "How many measured runs the class was worked out from." }
        labels: { type: array, items: { type: string }, description: "The `runs-on` of the job's latest measured run." }
        message: { type: string, description: "What is wrong, or for a sparse row how far it is from being advised on." }
        fix: { type: string, description: "What to write instead. Empty for a sparse row." }
        observed: { $ref: "#/components/schemas/AdviceObserved" }
        fits: { $ref: "#/components/schemas/AdviceFit" }

    AdviceObserved:
      type: object
      description: >-
        What the job's measured runs did over the page's `window`: the measurement, never the
        treated figure the class rule takes a killed run as having needed. `runs` is how many
        runs the figures were taken from, which the window and the history limit bound, so it
        can differ from the count the class was kept with.
      required: [runs, cpu, memory_mb]
      properties:
        runs: { type: integer }
        cpu: { $ref: "#/components/schemas/AdviceFigures" }
        memory_mb: { $ref: "#/components/schemas/AdviceFigures" }

    AdviceFigures:
      type: object
      description: Three points of one dimension, by the nearest-rank method. Zero where no run measured it.
      required: [p50, p95, max]
      properties:
        p50: { type: number, description: The median. }
        p95: { type: number, description: What all but the heaviest twentieth of runs stayed under. }
        max: { type: number, description: The most any run used. }

    AdviceFit:
      type: object
      description: >-
        Whether any host in the fleet carries the recommended class at all, cordoned and quiet
        hosts included: the question is whether such a machine exists, not whether it is free.
      required: [ok]
      properties:
        ok: { type: boolean }
        missing:
          allOf: [{ $ref: "#/components/schemas/SizeClass" }]
          description: The recommended class, when no host carries it.

    AdviceWindow:
      type: object
      description: >-
        The span the figures behind a page of advice were read over: what was asked (the
        fourteen-day class window when nothing was), what applied, and which of the two
        bounded it. `retention.jobs` is the ceiling, because a longer window would promise
        figures over runs that were pruned.
      required: [asked, applied, bound]
      properties:
        asked: { type: string, description: A Go duration such as `336h0m0s`. }
        applied: { type: string, description: A Go duration such as `336h0m0s`. }
        bound: { type: string, enum: [asked, retention] }

    WorkflowRun:
      type: object
      description: >-
        One workflow run as this fleet has seen it: the jobs GitHub reported under it,
        summed up over the latest attempt of each job. Derived from the jobs, never
        stored, so it cannot go stale on its own.
      properties:
        repo: { type: string }
        workflow: { type: string }
        github_run_id: { type: integer, format: int64 }
        run_number:
          type: integer
          format: int64
          description: >-
            GitHub's own sequential number for the run - the "#1009" its Actions UI shows.
            Zero until a job of the run has had it backfilled.
        run_attempt: { type: integer, description: The highest attempt any job of the run reported. }
        head_branch: { type: string }
        head_sha: { type: string }
        installation_id: { type: string }
        html_url: { type: string, description: The run's page on GitHub. }
        state:
          allOf:
            - $ref: "#/components/schemas/JobState"
          description: >-
            The run's own state: in_progress while any job is, queued while any job waits
            for a runner, waiting while any is held for a review, completed once every job is.
        conclusion:
          type: string
          description: >-
            The run's conclusion once it has completed, worst outcome first: a failure on
            either side, then cancelled, then action_required, then success. Empty until then.
        managed: { type: boolean, description: Whether this fleet has a hand in any job of the run. }
        hosted: { type: boolean, description: Whether every job's labels name runners somebody else operates. }
        cancelling: { type: boolean, description: Whether a cancellation of the run has been accepted by GitHub and not yet confirmed. }
        jobs: { $ref: "#/components/schemas/RunJobCounts" }
        queued_at: { type: string, format: date-time, description: When the first job was queued. }
        started_at: { type: [string, "null"], format: date-time, description: When the first job started. }
        completed_at: { type: [string, "null"], format: date-time, description: When the last job finished; null until every job has. }
        queue_wait_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64, description: From the first job starting to the last finishing. }

    RunJobCounts:
      type: object
      description: >-
        How a run's jobs are getting on, counted over the latest attempt of each.
        `failed` counts failures on either side, so `faulted` -- the ones this fleet
        caused -- is always part of it.
      properties:
        total: { type: integer }
        waiting: { type: integer }
        queued: { type: integer }
        in_progress: { type: integer }
        completed: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        skipped: { type: integer }
        faulted: { type: integer }
        unmatched: { type: integer, description: Queued jobs no enabled pool claims and nobody else is about to run. }
        expedited: { type: integer, description: Queued jobs an operator has asked to run now. Part of `queued`, not beside it. }
        paused: { type: integer, description: Queued jobs whose provisioning demand an operator has paused. Part of `queued`. }
        removed: { type: integer, description: Queued jobs an operator removed from the queue, which a run-level action leaves alone. Part of `queued`. }

    JobSummary:
      type: object
      description: >-
        A job without its steps, which is what `GET /jobs?include_steps=false` returns.
        `pool` is the pool's name, `host` the ID of the host that ran it and `runner` the
        runner's name.
      required: [id, repo, workflow, job_name, state, queued_at, queue_wait_ms, duration_ms]
      properties:
        id: { type: string }
        repo: { type: string }
        workflow: { type: string }
        job_name: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        conclusion: { type: string }
        fault_domain: { type: string, enum: [fleet, workflow], description: Whose the failure is; absent on a job that did not fail. }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        queue_wait_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        pool: { type: string }
        host: { type: string }
        runner: { type: string }
        controller_version: { type: string, description: The controller build that claimed the job. Absent when it was never stamped. }
        controller_channel: { type: string }
        agent_version: { type: string, description: The agent version the host reported when the job was assigned to it. }
        peak_memory_mb: { type: integer, format: int64, description: "The most memory, in MB, the job was measured using. Absent when never measured." }
        oom_killed: { type: boolean, description: True when the kernel killed the job's runner or one of its steps for memory. Absent when false. }
        size_class: { allOf: [{ $ref: "#/components/schemas/SizeClass" }], description: The class the job was put in. Absent on a job nobody classed. }
        ran_class: { allOf: [{ $ref: "#/components/schemas/SizeClass" }], description: The class of the host that took the job. Absent when none was recorded. }

    JobPercentiles:
      type: object
      required: [samples, p50_ms, p95_ms]
      properties:
        samples: { type: integer, description: The jobs the figures were computed from. }
        p50_ms: { type: [integer, "null"], format: int64, description: Null when no job could be measured; zero would read as an answer. }
        p95_ms: { type: [integer, "null"], format: int64 }

    JobStatsGroup:
      type: object
      required: [keys, count, succeeded, failed, cancelled, fleet_failed, fleet_failed_by_kind, fleet_failure_rate, duration, queue_wait, startup, peak_cpus, peak_memory_mb, oom_killed]
      properties:
        keys:
          type: object
          additionalProperties: { type: string }
          description: Each `group_by` key and this group's value. Empty when nothing was grouped by.
        count: { type: integer, description: Completed jobs in the group. }
        succeeded: { type: integer }
        failed: { type: integer, description: Failures on either side, so `fleet_failed` is part of it. }
        cancelled: { type: integer, description: Cancelled and skipped jobs. }
        fleet_failed: { type: integer, description: Jobs lost to this fleet rather than to the workflow. }
        fleet_failed_by_kind:
          type: object
          additionalProperties: { type: integer }
          description: "`fleet_failed` split by fault category. `unclassified` is a failure recorded before categories existed."
        fleet_failure_rate: { type: number, description: "`fleet_failed` over `count`, from 0 to 1." }
        duration: { $ref: "#/components/schemas/JobPercentiles" }
        queue_wait: { $ref: "#/components/schemas/JobPercentiles" }
        startup: { $ref: "#/components/schemas/JobPercentiles" }
        peak_cpus: { type: [number, "null"], description: "The most CPU, in cores, any job in the group was measured using. Null when none was measured." }
        peak_memory_mb: { type: [integer, "null"], format: int64, description: "The most memory, in MB, any job in the group was measured using. Null when none was measured." }
        oom_killed: { type: integer, description: Jobs in the group whose runner, or one of its steps, the kernel killed for memory. }

    JobStats:
      type: object
      required: [since, until, group_by, duration_excludes, notes, truncated, groups]
      properties:
        since: { type: string, format: date-time, description: Start of the window, included. }
        until: { type: string, format: date-time, description: End of the window, not included. }
        group_by: { type: array, items: { type: string } }
        duration_excludes:
          type: array
          items: { type: string }
          description: The conclusions left out of every duration percentile.
        notes: { type: array, items: { type: string }, description: How to read the figures, in words. }
        truncated: { type: boolean, description: True when more than 500 groups matched and the rest were left out. }
        groups: { type: array, items: { $ref: "#/components/schemas/JobStatsGroup" } }

    JobStep:
      type: object
      properties:
        number: { type: integer }
        name: { type: string }
        status: { type: string, examples: [queued, in_progress, completed] }
        conclusion: { type: string, examples: [success, failure, cancelled, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    FaultKind:
      type: string
      description: >-
        Why the fleet, rather than the workflow, is the reason something went wrong.

        Every kind exists because something different is done about it, and the
        `fault_fix` beside it says what. `out_of_memory` is a limit to raise;
        `host_lost` is a machine or an agent to look at; `image` is a tag or a registry;
        `registration` is the GitHub App's permissions; `backend` is the container daemon
        on the host, which is the "cannot start the runner container" case; `backend_busy`
        is that daemon answering too slowly rather than not at all, which is a host carrying
        more work than it can keep up with and is fixed on the pool's limits or the host's
        capacity; `config` is a
        setting the runner itself refused, and until it is edited every runner in the pool
        will do the same thing; `out_of_disk` is a full host; `removed` is an operator who
        meant it, and needs no fixing. `runner_exited` is the unclassified case on purpose
        -- a runner that stopped for a reason nobody observed, including one reported by an
        agent newer than Zoomies. Guessing a kind would send somebody to fix
        something that is not broken.

        Empty means the fleet has nothing to confess.
      enum: [host_lost, out_of_memory, out_of_disk, removed, image, registration, backend, backend_busy, container_conflict, config, runner_exited]

    JobEventKind:
      type: string
      description: >-
        What happened. `runner_lost` is the one entry GitHub cannot produce: the runner
        stopped under the job, and GitHub will report an ordinary failure. `waiting` and
        `approved` bracket a deployment review: the time between them is GitHub's, and
        the queue wait starts at `approved`. `runner_returned` withdraws a `runner_lost`:
        the host was silent long enough to be given up on, came back with the runner
        still executing this job, and the job is being left to finish.
        `runner_start_failed` is the failure that touches no job: a runner this pool
        started died before it could take one, so the job is still queued and the next
        runner may run it -- said here because a pool that cannot start a container
        otherwise looks exactly like a pool that is merely busy. `oom_killed` is the kernel
        killing the job's runner, or one of its steps, for its memory limit -- which can be
        recorded after `completed`, because a runner whose step was killed finishes the job
        and reports the kill only when it exits.
      enum: [queued, waiting, approved, claimed, unmatched, started, completed, runner_lost, runner_returned, cancel_requested, runner_start_failed, rerun_requested, oom_killed]

    JobEvent:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        kind: { $ref: "#/components/schemas/JobEventKind" }
        source:
          type: string
          description: >-
            Who observed it. A timeline that is all `poller` is a controller no webhook reaches.
            `recovery` marks a re-run the fleet decided on rather than a person.
          enum: [webhook, poller, agent, controller, recovery]
        message: { type: string, description: One sentence, written for an operator. }
        runner_id: { type: string }
        runner_name: { type: string }
        at: { type: string, format: date-time }

    # --- hosts ------------------------------------------------------------
    HostUsage:
      type: object
      properties:
        cpu_percent: { type: number, minimum: 0, maximum: 100, description: Whole-host CPU occupied between samples, including I/O wait. Absent when unmeasured. }
        memory_available_mb: { type: integer, format: int64, minimum: 0, description: Whole-host available memory including reclaimable cache. Zero is a measured full host. }
        sampled_at: { type: string, format: date-time, description: Controller receipt time. Agent-provided timestamps are ignored. }
        cpu_high_since: { type: string, format: date-time, description: Beginning of sustained CPU pressure, owned by the controller. }
        cpu_held: { type: boolean, description: Admission held after sustained CPU pressure. Running jobs continue. Owned by the controller. }
        lent_cpu_percent: { type: number, minimum: 0, maximum: 100, description: The part of cpu_percent runners were using out of CPU elastic CPU lent them. The admission hold and the throttle judge CPU without it. Owned by the controller. }
        io_wait_percent: { type: number, minimum: 0, maximum: 100, description: The share of CPU time the machine spent idle with something waiting on disk between samples. cpu_percent counts that time as busy; this is what tells a host stalled on its disk from one hard at work. Absent when unmeasured. }
        io_wait_high_since: { type: string, format: date-time, description: When I/O wait rose to 20% and has not fallen below 10% since. A host that has been there for ten minutes is called disk-bound, which is what a pool's advice to keep its scratch folders in memory rests on. Owned by the controller. }
        load_average_1m:
          type: number
          minimum: 0
          description: >-
            The kernel's one-minute load average for the whole machine, as the agent read it
            from /proc/loadavg. Absent when unmeasured. Judged against the host's CPU count:
            a load of at least twice the CPUs is what steps the throttle up, because a
            runnable queue that deep is a machine that has stopped keeping up even when the
            CPU figure saturates at 100.
    HostSample:
      type: object
      description: One host at one minute. Absent measurements are gaps, never zero.
      required: [host_id, at, capacity, active_runners]
      properties:
        host_id: { type: string }
        at: { type: string, format: date-time }
        capacity: { type: integer, description: The slots the host was taking that minute -- its configured capacity stepped down by any throttle. }
        active_runners: { type: integer }
        cpu_percent: { type: number, minimum: 0, maximum: 100, description: Whole-host CPU occupied, as the agent measured it. Absent when unmeasured or stale. }
        load_average_1m: { type: number, minimum: 0, description: The kernel's one-minute load average. Absent when unmeasured or stale. }
        cpus: { type: integer, description: The machine's CPUs, carried on every row so the chart can draw load against size. }
        memory_mb: { type: integer, format: int64 }
        memory_available_mb: { type: integer, format: int64, minimum: 0, description: Whole-host available memory including reclaimable cache. Absent when unmeasured or stale. }
        allocatable_cpus: { type: number, description: The machine less its reserve, with the floors applied. }
        allocatable_memory_mb: { type: integer, format: int64 }
        reserved_cpus: { type: number, description: What the live runners had promised away, from the last scheduling pass. Absent before one has run. }
        reserved_memory_mb: { type: integer, format: int64 }
        disk_total_mb: { type: integer, format: int64 }
        disk_free_mb: { type: integer, format: int64 }
    HostThrottle:
      type: object
      description: >-
        The rung the controller has stepped a host down to after sustained pressure. The
        controller owns every field: a heartbeat carries the measurements and never the
        decision, and an agent cannot set or clear one. Absent from a host on no rung.
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 3
          description: >-
            The rung, 1 to 3. Each takes a quarter of the host's slots (to 75%, 50%, 25% of
            capacity, never below one slot) and lowers the CPU quota of every runner here that
            has one, down to half. Owned by the controller.
        since: { type: string, format: date-time, description: When this episode began, the first step up from none. Owned by the controller. }
        changed_at: { type: string, format: date-time, description: The last step in either direction, which the next step up is paced from. Owned by the controller. }
        calm_since: { type: string, format: date-time, description: The start of the calm streak the next step down waits on. Absent while the host is not calm. Owned by the controller. }
        reason: { type: string, description: Which measurement took the last step up, as one sentence. Owned by the controller. }
    RuntimeIncident:
      type: object
      description: >-
        A host's container-runtime cooldown as its agent last reported it: the runtime failed,
        new starts are held, and one recovery attempt is due. Kept on the host row, so it
        survives a controller restart; cleared by the first heartbeat that reports none.
      required: [failures, kind, retry_at, since, observed_at]
      properties:
        failures: { type: integer, minimum: 1, description: Runtime failures in a row. The agent counts no higher than five. }
        kind: { type: string, enum: [unavailable, timeout], description: "unavailable: the daemon could not be reached; timeout: it was reached and did not answer in time." }
        error: { type: string, description: The last failure as the backend worded it, which names the socket and how to start it. }
        retry_at: { type: string, format: date-time, description: When the agent's one recovery attempt is due, on the controller's clock. }
        since: { type: string, format: date-time, description: When the controller first heard of this episode. }
        observed_at: { type: string, format: date-time, description: When the controller last heard anything new about it. }
    ImagePullIncident:
      type: object
      description: >-
        The last runner start or prewarm on a host that failed because its pool's image could
        not be made ready. Cleared by the next start or prewarm of the same pool that succeeds
        on the host.
      required: [pool_id, pool, image, registry, source, since, observed_at]
      properties:
        pool_id: { type: string }
        pool: { type: string, description: The pool's name when the failure was recorded. }
        image: { type: string }
        registry: { type: string, description: "The registry the image is pulled from: docker.io for a bare name, otherwise the reference's host, with its port.", examples: [ghcr.io] }
        source: { type: string, enum: [start, prewarm], description: Which of the agent's results said so. }
        error: { type: string }
        since: { type: string, format: date-time, description: When this pool's image was first recorded failing here. }
        observed_at: { type: string, format: date-time, description: When the latest failure was recorded. }
    BackendInfo:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/BackendKind" }
        freshness:
          type: object
          required: [state, desired_commit, published_commit, snapshot_id, checked_at]
          properties:
            state: { type: string, enum: [awaiting_merge, unavailable, stale, ready] }
            desired_commit: { type: string }
            published_commit: { type: string }
            snapshot_id: { type: string }
            checked_at: { type: string, format: date-time }
            failure: { type: string }
        setup_state: { type: string, enum: [pending, awaiting_merge] }
        setup_pr_url: { type: string }
        available: { type: boolean }
        version: { type: string }
        rootless: { type: boolean }
        endpoint: { type: string }
        detail: { type: string, description: When unavailable, what is wrong and how to fix it. }
        supports_dind: { type: boolean }
        host_socket_path: { type: string, description: Where the host daemon's socket lives, for pools that opt into host-socket mode. }
        limits:
          type: object
          description: >-
            What the daemon said it can enforce. A runner is given a default limit only on a
            field the daemon can apply, and host.limits_unenforceable names the fields it
            cannot; `known` is false from an agent too old to have asked, which defaults nothing.
          properties:
            known: { type: boolean }
            cpu: { type: boolean, description: A CPU quota. A daemon that cannot apply one refuses the container. }
            memory: { type: boolean, description: A memory limit. A daemon that cannot apply one starts the container without it. }
            pids: { type: boolean, description: A pids limit. A daemon that cannot apply one ignores it. }
        shared_folder:
          type: string
          description: >-
            What is wrong with the host's shared folder, the one runners' caches are bound from:
            a containerised agent whose container does not mount it from the host, which keeps
            no tool cache there. Empty when nothing is. See host.shared_folder_unmounted.

    HostDoctorResult:
      type: object
      required: [id, title, tier, status, current, recommended, rationale, actionable]
      properties:
        id: { type: string }
        title: { type: string }
        tier: { type: string, enum: [safe, aggressive, dedicated] }
        status: { type: string, enum: [ok, warn, skip, error] }
        current: { type: string }
        recommended: { type: string }
        rationale: { type: string }
        reason: { type: string }
        command:
          type: string
          description: >-
            A shell command an operator can run on the host to put this finding right by hand,
            such as the `apt-get install` for the Ubuntu HWE kernel. Absent when there is none.
            Zoomies never runs it; it is for copying.
        actionable: { type: boolean }
        optional: { type: boolean }
        accepted:
          type: object
          readOnly: true
          description: >-
            Present when an operator has accepted this warning as deliberate, so it no longer
            counts. The controller stamps it when it reads the report; an agent cannot send it.
            The reason is written by a person on the controller, not by the host.
          required: [reason, by, at, expires_at]
          properties:
            reason: { type: string }
            by: { type: string, description: The name of the person who accepted it. }
            at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
        ended:
          type: object
          readOnly: true
          description: >-
            Present when an acceptance of this check no longer covers it, so the row counts again
            and can say why. `at` is the acceptance's own time, never the time of reading.
          required: [by, at, was, why]
          properties:
            by: { type: string }
            at:
              type: string
              format: date-time
              description: When it was accepted for `changed` and `worse`, and when it lapsed for `expired`.
            was: { type: string, description: What the check read when it was accepted. }
            why: { type: string, enum: [changed, expired, worse] }
        acceptable:
          type: boolean
          readOnly: true
          description: >-
            True when an operator may accept this result: a counted warning on a check that can be
            accepted and is not accepted now. Never true for an error, a skip, a suggestion, the
            pending reboot or the disk checks.
    HostDoctor:
      type: object
      description: >-
        A host's OS report, as its agent writes it. This is also the body an agent sends with
        a heartbeat, and it carries no `summary`: the controller counts the report itself, so
        a host cannot claim a count (see HostDoctorView).
      required: [checked_at, os, distro, container, results, reboot_pending]
      properties:
        work_dir: { type: string, description: Host filesystem path inspected for runner disk headroom. }
        checked_at: { type: string, format: date-time }
        os: { type: string }
        distro: { type: string }
        container: { type: boolean, description: True when only the container's view could be inspected. }
        results: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/HostDoctorResult" } }
        reboot_pending: { type: boolean }
    HostDoctorSummary:
      type: object
      description: >-
        The controller's own count of a host's OS report, worked out on every read and never
        stored. Only the checks that count are in it: the safe tier, without optional results.
        The aggressive and dedicated tiers, and anything optional, are suggestions that never
        make a host look unwell. A pending reboot is counted once, as `reboot_pending`, and
        is not also a warning here.
      required: [counted, warnings, errors, skipped, suggestions, accepted]
      properties:
        counted:
          type: integer
          minimum: 0
          description: >-
            How many checks count, whatever they found, so "every check passed" can be told
            from "every check was skipped" (`skipped` equal to `counted`).
        warnings: { type: integer, minimum: 0, description: Counted checks that found a setting below the recommendation. }
        errors:
          type: integer
          minimum: 0
          description: >-
            Counted checks that failed to read what they look at, or found a file that is not
            valid. That is different from a setting below the recommendation, which is a warning.
        skipped:
          type: integer
          minimum: 0
          description: >-
            Counted checks that did not apply to this host, or that needed access the agent does
            not have.
        suggestions:
          type: integer
          minimum: 0
          description: >-
            Warnings that do not count: the aggressive and dedicated tiers, and optional checks.
            They are on the host's page and never raise a problem.
        accepted:
          type: integer
          minimum: 0
          description: >-
            Counted warnings an operator has accepted as deliberate. They are in `counted` and in
            neither `warnings` nor `suggestions`, so they raise no problem and stay visible here.
    HostDoctorView:
      description: >-
        A host's OS report as the API returns it: the report the agent wrote, with the
        controller's count of it in `summary`. Read `summary` for how a host is doing and
        `results` for what each check found. The text in `results` is written by the host and
        is untrusted. A host that has sent no report has no `doctor` at all.
      allOf:
        - $ref: "#/components/schemas/HostDoctor"
        - type: object
          required: [summary]
          properties:
            summary: { $ref: "#/components/schemas/HostDoctorSummary" }
    RunnerSize:
      type: object
      properties:
        cpus: { type: number, format: double, minimum: 0, description: "CPUs. Zero or absent follows the fleet's setting where one applies." }
        memory_mb: { type: integer, format: int64, minimum: 0, description: "Memory in MB. Zero or absent follows the fleet's setting where one applies." }

    RunnerStandard:
      type: object
      properties:
        cpus: { type: number, format: double, minimum: 0, description: "The CPUs one runner is given here for a pool that takes its size from the host. Absent follows the fleet's `runners.default_cpus`." }
        memory_mb: { type: integer, format: int64, minimum: 0, description: "The memory, in MB. Absent follows the fleet's `runners.default_memory_mb`." }
        burst_max_cpus:
          type: number
          format: double
          minimum: 0
          description: >-
            The most CPU one runner here may use, its guaranteed share and any CPU lent to it
            together. A pool's own `cpu_burst.max_cpus` can lower it and never raise it.
            Absent is no host ceiling.
        burst_max_memory_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The most memory one runner here may hold, its guaranteed share and any memory lent to
            it together. A pool's own `memory_burst.max_memory_mb` can lower it and never raise it.
            Absent is no host ceiling.

    RunnerProfile:
      type: object
      description: >-
        An operator's answer, for one host, to "how big is a runner here?": a minimum below
        which no runner is placed on the host, and a standard size with the most CPU a
        runner may be lent. Every field is optional; one left out follows the fleet's
        `runners.*` setting. Where a standard names a size, the host's slots are what its
        allocatable machine holds of it, up to its capacity.
      properties:
        minimum:
          allOf: [{ $ref: "#/components/schemas/RunnerSize" }]
          description: >-
            The least a runner is given on this host. The larger of this and the pool's own
            minimum applies. A pool that states a size below it is not placed here at all,
            because a pool that states its size is never given more than it states.
        standard:
          allOf: [{ $ref: "#/components/schemas/RunnerStandard" }]
          description: >-
            The size of one runner here for a pool that takes its size from the host. A pool
            whose own minimum is above it is not placed here.
        tmpfs:
          allOf: [{ $ref: "#/components/schemas/HostTmpfs" }]
          description: >-
            The host's say over pools' in-memory folders: whether it keeps them off, and the
            most any one of them may be here. Absent leaves each pool's own setting as it stands.

    HostTmpfs:
      type: object
      description: >-
        A host's policy for the in-memory folders pools may ask for. Some machines have memory
        to spare for them and some do not, and a pool is one setting for every host it lands on,
        so the host's owner has the last word.
      properties:
        disabled:
          type: boolean
          description: >-
            Fall back to disk on this host: every in-memory folder is kept off it, whatever a pool
            asks for, and its runners use disk as they did before the setting existed. A tactical
            fix, for a machine that cannot spare the memory today, and not a policy: the pool is
            told (`pool.tmpfs_host_off`) for as long as it is on, so it is not forgotten. The
            lasting answers are automatic folders and per-host sizes.
        max_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The most any one in-memory folder may be on this host, in MB (at least 64), applied
            after a pool's size is fitted to the runner's limit. A pool's size can lower it and
            never raise it. Zero is no host ceiling; it cannot be combined with `disabled`.
        work_mb:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The size the work folder is asked for on this host when a pool leaves it to size itself,
            in MB (at least 64), in place of the built-in 4096. A machine with a great deal of memory
            can offer more, and one with little less. It is still fitted to the runner's limit and
            lowered to `max_mb`; a size a pool typed is not replaced. Zero is the default. Cannot be
            combined with `disabled`.
        tmp_mb:
          type: integer
          format: int64
          minimum: 0
          description: The same for /tmp (built-in 1024).
        daemon_mb:
          type: integer
          format: int64
          minimum: 0
          description: The same for the Docker-in-Docker sidecar's image store (built-in 8192).

    EffectiveSize:
      type: object
      description: One tier of a host's effective profile -- the figure in force on each field and whose it is.
      properties:
        cpus: { type: number, format: double }
        memory_mb: { type: integer, format: int64 }
        cpus_source: { type: string, enum: [host, global], description: "`host` where the host's profile sets it, `global` where the fleet's setting stands in. Absent where nobody has said and the figure is zero." }
        memory_mb_source: { type: string, enum: [host, global] }

    EffectiveStandard:
      allOf:
        - $ref: "#/components/schemas/EffectiveSize"
        - type: object
          properties:
            burst_max_cpus: { type: number, format: double, description: The host's own ceiling. Absent is none. }
            burst_max_cpus_source: { type: string, enum: [host] }
            burst_max_memory_mb: { type: integer, format: int64, description: The host's own memory ceiling. Absent is none. }
            burst_max_memory_mb_source: { type: string, enum: [host] }

    EffectiveProfile:
      type: object
      description: >-
        What a runner on a host is held to. A host's minimum that follows the fleet is shown
        as the fleet's, but a pool that sets a minimum of its own still wins over the fleet's
        for the runners it places there: the host's own figure is a floor under the pool's.
      properties:
        minimum: { $ref: "#/components/schemas/EffectiveSize" }
        standard: { $ref: "#/components/schemas/EffectiveStandard" }

    MemoryPool:
      type: object
      description: >-
        What a host can lend its runners' memory limits, as the controller last worked it out:
        what is left of the machine once every promise is kept and the host's floor is left
        alone, and how much of it has been lent already. Absent for a host with no runner the
        valve applies to.
      required: [supported, capacity_mb, lent_mb, pool_mb, floor_mb, committed_mb, idle_reserve_mb, start_reserve_mb, binding, observing, enforcing, at]
      properties:
        supported: { type: boolean, description: Whether the host's agent carries the rules out. }
        capacity_mb: { type: integer, format: int64, description: The most that may be lent on the host in all, what is lent already included. }
        lent_mb: { type: integer, format: int64 }
        pool_mb: { type: integer, format: int64, description: What is left to lend. }
        floor_mb: { type: integer, format: int64, description: "The least free memory a loan leaves the host: its reserve and a twentieth of the machine." }
        committed_mb: { type: integer, format: int64, description: Busy and starting runners' guarantees, charged in full. }
        idle_reserve_mb: { type: integer, format: int64, description: The largest idle runner's guarantee, held back for the next job. }
        start_reserve_mb: { type: integer, format: int64, description: One queued start protected. }
        binding: { type: string, enum: [ledger, measured], description: "What limited the capacity: the promises already made, or the memory the host measured as free." }
        observing: { type: integer, description: Runners on the host with a rule in observe mode. }
        enforcing: { type: integer, description: Runners on the host with a rule in automatic mode. }
        short_at: { type: string, format: date-time, description: When a runner here was last refused memory because the host had none to give. Absent after fifteen minutes. }
        short_code: { type: string, enum: [pool_empty, host_floor] }
        at: { type: string, format: date-time, description: When the pool was last worked out. }

    HostHealthCheck:
      type: object
      description: >-
        The last "Check now" asked of this host's agent. It lives in the controller's
        memory only, so it is lost on a restart, and it is absent when there is nothing
        to say: no request, or one old enough that the page has no use for it.
      required: [state, asked_at]
      properties:
        state: { type: string, enum: [asked, done, failed], description: "asked while the agent has not answered; failed also covers an agent that did not answer in time." }
        asked_at: { type: string, format: date-time }
        outcome: { type: string, enum: [first, changed, unchanged, not_newer], description: "When done: whether the report was the first, changed the findings, matched the last, or carried a clock no later than the last report's." }
        message: { type: string, description: "When failed: a sentence for a person saying what to check." }
        next_at: { type: string, format: date-time, description: "When the host may be asked again. Only present while that is in the future." }
    HostUpdate:
      type: object
      description: >-
        The host's part in updating Zoomies from the web UI: whether it can be updated
        from here, why in a sentence, and its latest attempt while that attempt still says
        something about the host. Nothing in it moves with the clock or with a heartbeat.
      required: [state, reason, can_update, attempt_id]
      properties:
        state:
          type: string
          enum: [none, unsupported, requested, succeeded, failed, timed_out, cancelled]
          description: >-
            The latest attempt's state: `requested` until the host reports the release or 90
            minutes pass, then `succeeded`, `failed`, `timed_out`, or `cancelled` when the host
            was removed. `none` when there is no attempt to show, including one that failed
            before the host reached its release some other way. `unsupported` in place of `none`
            for a host behind the controller that the update helper can never be installed on
            (not Linux, no systemd, or a container under a rootless runtime): `reason` says
            which, and the host is updated with `upgrade_command`.
        reason:
          type: string
          description: >-
            The card's sentence: why the host can or cannot be updated, or how its attempt
            stands. For a failed, timed-out or cancelled attempt only the `platform` role is
            given the reason recorded for it, which can be the update helper's own and name a
            path on the host; every other role is given a fixed sentence for the state, in
            every response and on the event stream alike.
          examples:
            - "This host's agent does not offer to update itself, which it does only once the update helper is installed on the host. Run sudo zoomies updates helper install there, or update it with the command below."
        can_update:
          type: boolean
          description: >-
            Whether asking for an update now would be taken: `updates.mode` is `manual` or
            `auto`, the host's agent offers it, the host is behind the controller's release, the
            controller runs a release, it is not the agent inside the controller, and no attempt
            is open. With the mode `off` it is false, and `reason` says that updating is off
            wherever turning it on would let the host be asked; where it would not, as for a host
            the update helper can never be installed on, `reason` says what is in the way instead.
        attempt_id: { type: string, description: The attempt `state` describes, and empty with none., examples: [upd_k3fqz2mx7abcd] }
    Host:
      type: object
      properties:
        health_check: { $ref: "#/components/schemas/HostHealthCheck" }
        doctor: { $ref: "#/components/schemas/HostDoctorView" }
        usage: { $ref: "#/components/schemas/HostUsage" }
        usage_fresh: { type: boolean, description: Usage is less than 90 seconds old. Unknown or stale readings retain reservation-based placement. }
        admission_reason: { type: string, description: Why current host pressure is holding new runner starts. Empty when no pressure hold applies. }
        throttle:
          allOf:
            - $ref: "#/components/schemas/HostThrottle"
          description: The throttle the controller has this host on. Absent when it is on none.
        runtime_recovering:
          allOf:
            - $ref: "#/components/schemas/RuntimeIncident"
          description: The container-runtime cooldown the agent last reported. Absent when there is none.
        runtime_reason:
          type: string
          description: >-
            The host card's sentence for the runtime cooldown, without its times: the card
            renders the retry and the report's age against the viewer's clock. Absent when
            there is none.
          examples:
            - "Runtime recovering: third failure in a row, the container runtime could not be reached. New starts here are held until one recovery attempt; running jobs continue."
        image_pull_failed:
          allOf:
            - $ref: "#/components/schemas/ImagePullIncident"
          description: The last start or prewarm here whose image could not be made ready. Absent when there is none.
        throttle_reason:
          type: string
          description: >-
            The operator sentence for the throttle: what it took, why, what it is doing to the
            jobs already running, and how it ends. Empty when the host is not throttled.
          examples:
            - "throttled to 2 of 4 slots (step 2 of 3) after sustained pressure: the 1-minute load average is 30.0, at least twice the host's 8 CPUs; running jobs continue, the 1 runner with a CPU limit at 50% of it, and the throttle lifts one step after 5m of calm"
        effective_capacity:
          type: integer
          description: >-
            The slots this host takes right now: `slots` stepped down by the throttle, and
            `slots` itself when there is none. `free` is measured against it, so a throttled
            host never advertises a slot the next pass would refuse.
        slots:
          type: integer
          description: >-
            How many runners this host takes before any throttle: its `capacity`, or -- where
            its runner profile names a standard size -- what its allocatable machine holds of
            that size, never more than `capacity`. A capacity of zero still takes nothing,
            whatever the standard says.
        slots_limited_by:
          type: string
          enum: [cpu, memory, capacity]
          description: >-
            What sets `slots` where the host has a standard size: `cpu` or `memory` when the
            machine does, `capacity` when the operator's number is below what the machine
            holds. Absent when the two agree, and when there is no standard.
        runner_profile:
          allOf: [{ $ref: "#/components/schemas/RunnerProfile" }]
          description: What the operator has said about how big a runner is on this host, as they said it. Absent when they have said nothing, which is every host until somebody does.
        effective_profile:
          allOf: [{ $ref: "#/components/schemas/EffectiveProfile" }]
          description: What a runner on this host is held to, with the fleet's settings standing in for every field the host leaves out, and where each figure came from.
        tags:
          type: array
          items: { $ref: "#/components/schemas/HostTag" }
          description: >-
            What can be said about this host in the terms a pool's `host_selector` asks in: the
            labels stored on it, and the automatic ones no label has taken the place of. Always
            present, and empty for a host with none. The `size` tag is listed only while
            `scheduler.size_routing` or `scheduler.auto_pools` is not `off`.
        size_class:
          allOf: [{ $ref: "#/components/schemas/HostSizeClass" }]
          description: >-
            The size class this host is in, and why. Absent until the controller has worked one
            out, which is never while both `scheduler.size_routing` and `scheduler.auto_pools`
            are `off`.
        auto_pool:
          allOf: [{ $ref: "#/components/schemas/HostAutoPool" }]
          description: >-
            Which automatic pool this host counts towards, or why it counts towards none.
            Absent while `scheduler.auto_pools` is `off`.
        unlimited_runners:
          type: integer
          description: >-
            How many of the live runners here were created with no CPU quota -- a pool with
            none and default limits off, a process pool, a daemon that cannot apply one, or a
            runner from before allocations were recorded. Omitted when zero. They are the
            runners a CPU hold can mean something about, since a throttle cannot slow them.
        id: { type: string }
        name: { type: string }
        address: { type: string }
        connection: { type: string, enum: [direct, tailcat], description: Connection observed by the controller at enrolment or the latest heartbeat. }
        embedded: { type: boolean, description: True for the agent running inside the controller process. }
        capacity: { type: integer }
        active_runners: { type: integer }
        free: { type: integer }
        backends: { type: array, items: { type: string } }
        backend_info: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        features:
          type: array
          items: { type: string }
          description: >-
            What the agent says it can do beyond running a backend, re-read from every
            heartbeat. `elastic-cpu` means it can move a live runner's CPU quota, and
            `elastic-memory` that it can raise a live runner's memory limit.
        elastic_cpu:
          type: boolean
          description: >-
            Whether this host honours an elastic pool: true when its agent advertises
            `elastic-cpu`. A runner of such a pool placed where this is false is held at its
            guaranteed share, and the host's card says so.
        elastic_memory:
          type: boolean
          description: >-
            Whether this host's agent carries out the memory valve's rules, which is when it
            advertises `elastic-memory`. A pool with the valve on is lent nothing, and observes
            nothing, on a host where this is false.
        memory_pool: { $ref: "#/components/schemas/MemoryPool" }
        labels: { type: object, additionalProperties: { type: string } }
        os: { type: string, description: The kernel, as Go names it - linux, darwin, windows. }
        distro: { type: string, description: The distribution, e.g. ubuntu. Empty when the host has not said. }
        os_version: { type: string, description: The distribution's release, e.g. "24.04". }
        arch: { type: string }
        cpus: { type: integer, description: How much machine this host is. An agent in a container sees its cgroup's share, but a container runner runs beside it rather than inside that cgroup, so the daemon's larger view of the machine is the one reported. }
        memory_mb: { type: integer, format: int64 }
        disk_total_mb: { type: integer, format: int64, description: The filesystem holding the agent's work directory, where a runner's checkout and caches land. Zero means the agent did not measure it, which is not a full disk. }
        disk_free_mb: { type: integer, format: int64, description: What a runner may write to, which is less than what is unused by the reserve the filesystem keeps for root. }
        reserve_cpus: { type: integer, description: What the operator holds back from placement for the machine's own sake. Set through PATCH /hosts; a heartbeat never writes it. }
        reserve_memory_mb: { type: integer, format: int64 }
        reserve_disk_mb: { type: integer, format: int64 }
        allocatable_cpus:
          type: number
          description: >-
            The machine less its reserve: what the scheduler may place onto. The documented
            floors under the reserve -- half a core or a twentieth of the machine, whichever is
            larger, 512 MB of memory and 2 GB of disk -- are applied here, so what is shown is
            what is used. The CPU floor is what keeps the daemon, the agent and the kernel a
            core the runners' quotas can never take.
        allocatable_memory_mb: { type: integer, format: int64 }
        allocatable_disk_mb: { type: integer, format: int64 }
        reserved_cpus:
          type: number
          description: >-
            What the live runners already on this host have promised away, as of the last
            scheduling pass and from the snapshot that pass decided on. Disk is absent on
            purpose: free disk already contains what those runners have written, so charging
            their reservations too would count the same bytes twice.
        reserved_memory_mb: { type: integer, format: int64 }
        reserved_known:
          type: boolean
          description: >-
            False until a pass has run, because zero would read as an idle machine rather
            than as a question nobody has answered yet.
        resources_known:
          type: boolean
          description: >-
            Whether this host has reported what machine it is at all. An agent too old to say
            is placed by slots alone, which is what keeps an upgrade from emptying a fleet.
        platform: { $ref: "#/components/schemas/Platform" }
        platform_label: { type: string, examples: ["Ubuntu 24.04, arm64"] }
        canonical_name:
          type: string
          description: The name this machine would be given today, for a host called something that says nothing.
          examples: [zoomies-16vcpu-32gb-ubuntu-2404-build01]
        version: { type: string }
        version_channel: { type: string, examples: ["v1.0.0", "dev"], description: The published image and binary tag carrying this agent build. }
        cordoned: { type: boolean }
        protocol_version:
          type: integer
          description: >-
            The agent protocol this host reported speaking. Absent from an agent old enough
            not to send one, which is not the same as incompatible -- it is the one case the
            controller cannot judge.
        incompatible:
          type: boolean
          description: >-
            Whether this host's agent speaks a protocol the controller does not. An
            incompatible host is excluded from placement exactly as a cordoned one is, and
            nothing else: its runners keep working and are drained as normal. Refusing its
            heartbeat instead would restart every agent in the fleet at once.
        incompatible_reason: { type: string, description: What to do about it, naming both protocol versions. }
        version_skew:
          type: string
          enum: [behind, ahead, differs]
          description: >-
            How this host's release stands to the controller's, absent when they match.
            `differs` is the honest answer for a pair the controller cannot order -- a
            development build, a fork's tag -- because a wrong order would send an operator
            to upgrade the wrong side. Two builds of one tag are the same release and are
            not skew.
        upgrade_command:
          type: string
          description: >-
            Copyable `sudo zoomies upgrade --mode agent --version <tag>` command for an older or
            different remote agent, targeting the controller's published release or dev channel.
            An operator runs it on the host. The controller asks the host's agent to update itself
            instead, with `POST /hosts/{id}/update`, only when `update.can_update` is true; for every
            other host this command is how it is upgraded. Absent for embedded, matching or newer
            agents, and for unpublished controller builds. Contains no credentials.
        upgrade_version:
          type: string
          description: Controller build the upgrade is intended to match.
        upgrade_note:
          type: string
          description: What the command does, or why no safe published command can be offered.
        update: { $ref: "#/components/schemas/HostUpdate" }
        healthy: { type: boolean }
        last_heartbeat: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    JoinToken:
      type: object
      properties:
        id: { type: string }
        prefix: { type: string }
        created_by: { type: string }
        capacity: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        used_by_id: { type: string }
        usable: { type: boolean }

    # --- providers and machines -------------------------------------------
    ProviderKindName:
      type: string
      description: Which infrastructure a provider rents from. It is CHECKed in the schema, so a kind this build cannot speak cannot be stored.
      enum: [proxmox, fake]
    MachineState:
      type: string
      description: >-
        A machine's life, from a row that names nothing to a host that runs jobs. Deleted
        is the only terminal one: failed and quarantined still need attention, and a
        failed machine may still have a resource behind it.
      enum: [planned, creating, starting, bootstrapping, enrolling, ready, draining, deleting, deleted, failed, quarantined]

    Provider:
      type: object
      required: [id, kind, name, credentials_configured, enabled, paused, machines, owned]
      properties:
        id: { type: string, examples: [prv_k3f9qz2mx7ab] }
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string, examples: [proxmox-lab] }
        endpoint:
          type: string
          description: Where Zoomies reaches the provider. Not a secret - it is the address an operator typed - and showing it is how somebody tells two clusters apart on a page listing both.
          examples: ["https://pve.example.com:8006"]
        insecure_skip_verify: { type: boolean, description: Certificate verification is off for this provider, which the validator warns about rather than refusing. }
        connection:
          type: string
          enum: [direct, tailcat]
          description: >-
            How the controller reaches the endpoint: over the network, or through a
            `zoomies gateway` running beside the provider, for a hypervisor on a home
            network with no address the controller can route to. The gateway's address
            is sealed on the row and never returned, for the credential's reason.
        settings:
          type: object
          additionalProperties: { type: string }
          description: The non-secret answers to this driver's own settings, keyed as GET /providers/kinds describes them.
        credentials_configured:
          type: boolean
          description: >-
            Whether a credential is sealed in the row. The value itself never leaves the
            controller and has no field here: an audit row and a screenshot both outlive
            the person who took them.
        machine_labels: { type: object, additionalProperties: { type: string } }
        machine_capacity: { type: integer, description: How many runners one of this provider's machines may run at once. }
        machine_backend: { $ref: "#/components/schemas/BackendKind" }
        machine_platform: { $ref: "#/components/schemas/Platform" }
        machine_cpus: { type: number }
        machine_memory_mb: { type: integer, format: int64 }
        machine_disk_mb: { type: integer, format: int64 }
        pool_selector:
          type: object
          additionalProperties: { type: string }
          description: >-
            Which pools this provider will rent machines for. Each entry must be satisfied
            by the pool: a key with no value asks for a pool carrying that label, `key: value`
            asks for the label `key=value`, and `name` and `backend` match the pool's own.
            Empty means every pool. A provider rents only where this and the pool's own
            `provider_selector` both agree. It decides what is bought, not where a runner is
            placed once a machine is a host: use the pool's `host_selector` for that.
        max_machines:
          type: integer
          description: >-
            The ceiling on machines this provider may own at once. Zero rents nothing,
            exactly as a pool's max_runners of zero runs nothing.
        max_creates_in_flight: { type: integer, description: How many machines may be being built at once. }
        idle_timeout_ms: { type: integer, format: int64, description: How long a machine may sit with nothing to do before it is drained. }
        cost_per_machine_hour: { type: number }
        enabled: { type: boolean }
        paused: { type: boolean, description: The operator's kill switch. It blocks new machines only. }
        paused_reason: { type: string }
        paused_until: { type: string, format: date-time, description: The breaker's own pause, which never un-presses the operator's. }
        held:
          type: string
          description: >-
            Why no new machine may be bought right now, in one sentence, or absent when one
            may. Computed rather than stored because it answers for the fence, the
            configuration and the row at once.
        consecutive_failures: { type: integer }
        last_check_at: { type: string, format: date-time }
        last_check_error: { type: string, description: The worst thing the last preflight found, in one sentence. }
        last_check:
          allOf: [{ $ref: "#/components/schemas/ProviderCheck" }]
          description: >-
            The whole of the last preflight, findings with their detail and fix, so a page
            can show what `last_check_error` is the title of without running it again.
            Absent for a provider never checked, and for one last checked before the report
            was kept.
        last_sweep_at: { type: string, format: date-time, description: When this provider was last asked for everything it believes it is running. }
        machines:
          type: object
          additionalProperties: { type: integer }
          description: How many machines this provider has, by state.
        owned:
          type: integer
          description: How many still believe they hold a resource, which is the number the ceiling and the bill are both counted in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProxmoxSetupTemplate:
      type: object
      required: [vmid, name, node]
      properties:
        vmid: { type: integer, minimum: 100 }
        name: { type: string }
        node: { type: string }

    ProviderSetup:
      type: object
      required: [id, expires_at, ready]
      properties:
        id: { type: string }
        expires_at: { type: string, format: date-time }
        ready: { type: boolean }
        name: { type: string }
        endpoint: { type: string }
        templates: { type: array, items: { $ref: "#/components/schemas/ProxmoxSetupTemplate" }, description: QEMU templates detected by the setup command. }
        command: { type: string, description: Returned only at creation; the whole setup script, contains the short-lived setup capability. }
        short_command: { type: string, description: Returned only at creation; the same setup as two lines that fetch the hosted connect-proxmox.sh. Contains the short-lived setup capability. }

    ProviderInput:
      type: object
      description: >-
        Creating and editing a provider take the same body. On a PATCH every field is
        optional and independent; what is not named is left alone.
      properties:
        setup_id: { type: string, description: Ready Proxmox setup whose sealed connection settings replace the connect fields. Expires after one hour. }
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string }
        endpoint: { type: string }
        ca_pem: { type: string, description: The certificate to trust for this endpoint, instead of turning verification off. }
        insecure_skip_verify: { type: boolean }
        connection:
          type: string
          enum: [direct, tailcat]
          description: >-
            Direct, or through a `zoomies gateway` beside the provider. Choosing direct on a
            provider that had a private connection clears its stored address.
        tailcat_address:
          type: string
          description: >-
            The address `zoomies gateway` printed. Sealed with the instance key and never
            returned; an empty string on a PATCH leaves the stored one alone. Giving one
            without naming a connection means tailcat.
        settings: { type: object, additionalProperties: { type: string } }
        credential:
          type: string
          description: >-
            Sealed with the instance key and never returned. An empty string leaves the
            stored credential alone, so a form with a blank password box does not erase it.
        machine_labels: { type: object, additionalProperties: { type: string } }
        machine_capacity: { type: integer, minimum: 1, default: 2 }
        machine_backend: { $ref: "#/components/schemas/BackendKind" }
        machine_platform: { $ref: "#/components/schemas/Platform" }
        machine_cpus: { type: number, minimum: 0 }
        machine_memory_mb: { type: integer, format: int64, minimum: 0 }
        machine_disk_mb: { type: integer, format: int64, minimum: 0 }
        pool_selector: { type: object, additionalProperties: { type: string } }
        max_machines: { type: integer, minimum: 0, default: 0 }
        max_creates_in_flight: { type: integer, minimum: 0, default: 1 }
        idle_timeout: { $ref: "#/components/schemas/Duration" }
        cost_per_machine_hour: { type: number, minimum: 0 }
        enabled: { type: boolean, default: true }

    ProviderSetting:
      type: object
      required: [key, label, kind, required, advanced]
      properties:
        key: { type: string, examples: [node] }
        label: { type: string, examples: [Node] }
        kind: { type: string, enum: [text, number, bool, choice, list, secret] }
        required: { type: boolean }
        advanced: { type: boolean, description: Put behind a disclosure, because a form that asks eleven questions to do the common thing gets abandoned. }
        help: { type: string, description: One operator-facing sentence. }
        consequence: { type: string, description: What choosing it means, in the voice the pool form uses for a choice that costs something. }
        discovers:
          type: string
          description: Which discovery list fills the choices, e.g. nodes.
        default: { type: string }
        source:
          type: string
          description: >-
            Where the answer is found when discovery cannot offer it: which page of the
            provider's own console, or which command on one of its machines. `help` says
            what the setting is; this says where to look.

    ProviderGuideStep:
      type: object
      required: [title]
      description: One thing to do before a provider of this kind can rent anything.
      properties:
        title: { type: string, examples: [An API token that can clone, start and delete guests] }
        detail: { type: string, description: What to do and why, shown as written. }
        command: { type: string, description: A shell snippet to copy, when the step is done in a terminal. }

    ProviderKind:
      type: object
      required: [kind, label, bootstrap, guide, settings]
      properties:
        kind: { $ref: "#/components/schemas/ProviderKindName" }
        label: { type: string, examples: [Proxmox VE] }
        endpoint_example:
          type: string
          description: What an address for this kind looks like, scheme and port included, so the form can show one and fill the port in.
          examples: ["https://pve.example.com:8006"]
        endpoint_source: { type: string, description: Where the address is found, in the provider's own console's terms. }
        credential_source: { type: string, description: Where the credential is made, and what shape to paste it in. }
        ca_source: { type: string, description: Where the certificate to trust is found, and when to leave it empty. }
        guide:
          type: array
          description: >-
            What has to exist before this kind can rent a machine, in the order it is done.
            The wizard shows it before its first question, because each step is done
            somewhere other than the form.
          items: { $ref: "#/components/schemas/ProviderGuideStep" }
        bootstrap:
          type: string
          enum: [guest_agent, metadata, none]
          description: >-
            How the enrolment payload reaches a guest. "metadata" means it is readable by
            anyone who can read the machine's metadata, which is worth knowing before
            anything is bought.
        can_start_stop: { type: boolean }
        can_discover: { type: boolean }
        can_mark_ownership: { type: boolean, description: Whether the driver can write Zoomies' marks onto the resource itself. }
        async_operations: { type: boolean }
        cost_unit: { type: string, examples: [machine-hour] }
        settings:
          type: array
          items: { $ref: "#/components/schemas/ProviderSetting" }

    ProviderValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        warnings:
          type: array
          description: Answers that are legal and still cost something.
          items: { $ref: "#/components/schemas/Problem" }

    AssistantProviderKind:
      type: string
      enum: [fake, openai_compatible, anthropic, openai]
      description: >-
        Which protocol the provider speaks. `openai_compatible` covers Ollama, LM Studio,
        vLLM, llama.cpp, OpenRouter and the gateways; `fake` is the demo's built-in model
        and cannot be created elsewhere.

    AssistantProviderCheck:
      type: object
      required: [ok, latency_ms, usage_reported, checked_at]
      properties:
        ok: { type: boolean }
        model: { type: string, description: The model that answered. }
        latency_ms: { type: integer, format: int64 }
        usage_reported: { type: boolean, description: Whether the provider counts tokens, which is what the limits in a later slice rest on. }
        error: { type: string, description: Why the check failed, written for a person and never carrying the request. }
        checked_at: { type: string, format: date-time }

    AssistantChatRequest:
      type: object
      required: [messages]
      properties:
        provider_id:
          type: string
          description: The provider to ask. Omit for the default. A disabled provider is not one to ask.
        messages:
          type: array
          description: The conversation so far, oldest first, ending in a `user` message. At most 40 messages, 8 KiB each and 32 KiB in all.
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }

    AssistantProvider:
      type: object
      required: [id, name, kind, base_url, model, key_configured, enabled, is_default, local, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AssistantProviderKind" }
        base_url: { type: string, description: Empty for a hosted kind means the kind's own address. }
        model: { type: string }
        key_configured: { type: boolean, description: A key is sealed on the row. The key itself never leaves this process. }
        enabled: { type: boolean }
        is_default: { type: boolean }
        local: { type: boolean, description: The address names this machine or a private network. }
        last_check: { $ref: "#/components/schemas/AssistantProviderCheck" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssistantProviderInput:
      type: object
      description: >-
        Creating, editing and checking a provider take the same body. On a PATCH every
        field is optional; what is not named is left alone.
      properties:
        id:
          type: string
          description: >-
            On a draft check only: the saved provider this draft is an edit of, so a blank
            `api_key` borrows the sealed key that row holds. Ignored elsewhere.
        name: { type: string }
        kind: { $ref: "#/components/schemas/AssistantProviderKind" }
        base_url: { type: string, description: Required for openai_compatible; optional for the hosted kinds, whose own address is used when it is empty. }
        model: { type: string }
        enabled: { type: boolean }
        api_key:
          type: string
          description: >-
            Sealed with the instance key and never returned. An empty string leaves the
            stored key alone, so a form with a blank key box does not erase it.

    ProviderCheck:
      type: object
      required: [provider_id, ok, reachable, findings, checked_at]
      properties:
        provider_id: { type: string }
        ok:
          type: boolean
          description: Nothing found stops this provider being used. Warnings do not - they weaken the posture and say so.
        reachable:
          type: boolean
          description: >-
            Whether an answer came back at all. Separate from the findings because a
            provider that cannot be reached has one problem, not eleven.
        version: { type: string, description: The provider's own version, kept because "it worked" is worth little without "against what". }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        checked_at: { type: string, format: date-time }

    ProviderPairing:
      type: object
      required: [provider_id, provider_name, pool_id, pool_name, serves, agrees, fits]
      properties:
        provider_id: { type: string }
        provider_name: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        serves: { type: boolean, description: This provider would rent a machine for this pool. }
        agrees: { type: boolean, description: Both selectors allow it. }
        by:
          type: string
          enum: [provider, pool]
          description: Which side's selector refused, when `agrees` is false.
        fits: { type: boolean, description: The machine this provider builds is one the pool's runners could be placed on. }
        fit_why: { type: string, description: What about the machine does not suit the pool, when `fits` is false. }
        why: { type: string, description: The first thing standing in the way, in the setting's own terms. Absent when `serves`. }
        fix: { type: string, description: What to change, for a selector's refusal. }

    ProviderChoice:
      type: object
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
        consequence: { type: string, description: What picking it means, because a list of identifiers with no consequences is a list somebody guesses at. }

    ProviderDiscovery:
      type: object
      required: [nodes, storages, bridges, templates]
      description: What a credential can actually see. A provider with no such concept leaves a list empty rather than inventing one.
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        storages: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        bridges: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        templates: { type: array, items: { $ref: "#/components/schemas/ProviderChoice" } }
        unavailable:
          type: string
          description: >-
            Why the lists are empty, when the provider could not be asked: the address did
            not answer, the credential was refused. Only a draft's discovery sets it; the
            saved provider's route answers with an error instead.

    Orphan:
      type: object
      required: [name, note]
      properties:
        name: { type: string, examples: [zoomies-mach-k3f9q] }
        note: { type: string, description: What to do about it, which for an untracked resource is always to look at it yourself. }

    ProviderOrphans:
      type: object
      required: [provider_id, provider_name, untracked, no_resource, unverified]
      properties:
        provider_id: { type: string }
        provider_name: { type: string }
        last_sweep_at: { type: string, format: date-time, description: When the untracked list was gathered, so a stale answer says so. }
        untracked:
          type: array
          description: Resources wearing this fleet's naming that no row accounts for. Zoomies never deletes one.
          items: { $ref: "#/components/schemas/Orphan" }
        no_resource:
          type: array
          description: Rows that hold nothing, which can be released without anything being lost.
          items: { $ref: "#/components/schemas/Machine" }
        unverified:
          type: array
          description: Machines whose ownership nothing has confirmed, including every quarantined one.
          items: { $ref: "#/components/schemas/Machine" }

    MachineTimelineEntry:
      type: object
      required: [phase, at]
      properties:
        phase: { type: string, examples: [bootstrapped] }
        at: { type: string, format: date-time }

    Machine:
      type: object
      required: [id, provider_id, name, state, labels, safe_to_delete, timeline, created_at, updated_at]
      properties:
        id: { type: string, examples: [mach_k3f9qz2mx7ab] }
        provider_id: { type: string }
        provider_name: { type: string }
        provider_kind: { $ref: "#/components/schemas/ProviderKindName" }
        name: { type: string, examples: [zoomies-mach-k3f9q] }
        state: { $ref: "#/components/schemas/MachineState" }
        message: { type: string, description: Why it is where it is, in one sentence. }
        pool_id: { type: string, description: Which pool's unmet demand asked for this machine. Not ownership - a machine serves every pool its labels match. }
        pool_name: { type: string }
        resource_zone: { type: string, examples: [pve-1] }
        resource_id: { type: string, examples: ["143"] }
        address: { type: string }
        ownership_verified_at: { type: string, format: date-time, description: The last time a fresh observation agreed this resource is ours. }
        ownership_error: { type: string, description: What disagreed. A machine with one is never deleted by anything but a person. }
        host_id: { type: string }
        host_name: { type: string }
        capacity: { type: integer }
        labels: { type: object, additionalProperties: { type: string } }
        operation: { type: string, enum: [create, start, stop, bootstrap, delete], description: The operation in flight, if any. }
        operation_id: { type: string, examples: [mop_k3f9qz2mx7ab] }
        operation_handle: { type: string, description: The provider's own handle for the call, which is what an operator pastes into its task log. }
        operation_holder: { type: string, description: The controller taking the step, so a machine stuck mid-create names the controller to go and look at. }
        operation_since: { type: string, format: date-time }
        outcome_unknown: { type: boolean, description: A call that went out and was never answered, which is the one thing a retry must not treat as a failure. }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        provider_error: { type: string, description: What the hypervisor complained about, in its own words. }
        bootstrap_error: { type: string, description: What went wrong inside the guest, in its own words. }
        safe_to_delete: { type: boolean, description: Whether the row alone says a delete would be safe. The delete itself asks the provider again. }
        safe_to_delete_why: { type: string, description: Why not, when it is not. }
        timeline:
          type: array
          description: The phases this machine actually reached. A phase it skipped is absent rather than zero.
          items: { $ref: "#/components/schemas/MachineTimelineEntry" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        idle_since: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, description: When the provider confirmed the resource was gone, by an inspect that could not find it. }

    # --- audit and administration ----------------------------------------
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        actor_kind: { type: string, enum: [user, token, connection, client, agent, system, webhook] }
        action: { type: string, examples: ["pool.create", "runner.drain"] }
        target_kind: { type: string }
        target_id: { type: string }
        before: { type: string, description: JSON, with secrets redacted. }
        after: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        oidc_subject: { type: string }
        disabled: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        two_step_enabled: { type: boolean, description: Whether the account signs in with a code after its password. }

    SignInChallenge:
      type: object
      required: [two_step, username, expires_at]
      properties:
        two_step: { type: string, enum: [verify, enrol] }
        username: { type: string }
        expires_at: { type: string, format: date-time }

    TwoStepCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Six digits from the authenticator app, or a recovery code. Spaces and hyphens are ignored.

    TwoStepReauth:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string }

    TwoStepSignIn:
      type: object
      required: [identity, recovery_code_used]
      properties:
        identity: { $ref: "#/components/schemas/Identity" }
        recovery_code_used: { type: boolean }
        recovery_codes_left: { type: integer, description: Set when a recovery code was used. }
        recovery_codes:
          type: array
          items: { type: string }
          description: Set when the sign-in enrolled an authenticator. Shown this once.

    TwoStepStatus:
      type: object
      required: [available, enabled, recovery_codes_left, required]
      properties:
        available: { type: boolean, description: False for an account that signs in through single sign-on. }
        enabled: { type: boolean }
        enabled_at: { type: string, format: date-time }
        recovery_codes_left: { type: integer }
        required: { type: boolean, description: "security.require_two_step." }

    TwoStepSetup:
      type: object
      required: [secret, otpauth_uri, qr_svg]
      properties:
        secret: { type: string, description: The key in base32, for typing into an app by hand. }
        otpauth_uri: { type: string }
        qr_svg: { type: string, description: The otpauth address as a QR code, an SVG document drawn by the controller. }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string } }

    Identity:
      type: object
      properties:
        kind: { type: string, enum: [user, token, agent, system] }
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        must_change_password: { type: boolean }

    UserPreferences:
      type: object
      description: Private, account-scoped interface choices. Unknown tables and columns are harmless.
      properties:
        table_layouts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TableLayoutPreference"

    ProblemDismissal:
      type: object
      required: [key, severity]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 300
          description: >-
            The UI's identity for one problem, or `type:<code>` for every problem of one
            kind. Opaque to the controller.
        severity:
          type: string
          enum: [error, warning, info]
          description: The severity that was read. A problem that has become worse is not covered.
        at:
          type: string
          format: date-time
          description: When it was put away. Defaults to now on a patch.
        until:
          type: [string, "null"]
          format: date-time
          description: When a snooze ends. Absent or null is a dismissal until the problem resolves.

    ProblemDismissals:
      type: object
      required: [stored, items]
      properties:
        stored:
          type: boolean
          description: Whether this identity has an account to keep dismissals on.
        items:
          type: array
          items: { $ref: "#/components/schemas/ProblemDismissal" }

    ProblemDismissalsPatch:
      type: object
      properties:
        set:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProblemDismissal" }
        remove:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 300 }

    TableLayoutPreference:
      type: object
      properties:
        widths:
          type: object
          additionalProperties: { type: number, minimum: 40, maximum: 1000 }
        order:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 100 }

    APIToken:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes: { type: array, items: { type: string } }
        prefix: { type: string }
        revoked: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        user_id: { type: string, description: The account that minted the token. }

    MCPClient:
      type: object
      required: [id, client_id, kind, name, redirect_uris, confidential, created_at, connections]
      properties:
        id: { type: string, examples: ["oac_abcdefghijklm"] }
        client_id: { type: string, description: What the client sends. The row ID, or the document URL for a metadata client. }
        kind: { type: string, enum: [dynamic, metadata, admin] }
        name: { type: string }
        client_uri: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        confidential: { type: boolean }
        secret_prefix: { type: string, description: The first characters of the secret, to recognise it by. }
        secret_rotated_at: { type: [string, "null"], format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        connections: { type: integer, description: Live connections this client holds. }
        client_secret: { type: string, description: Present once, in the response that creates or rotates it. }

    MCPConnection:
      type: object
      required: [id, client_id, client_name, client_kind, user_id, username, role, scope, created_at]
      properties:
        id: { type: string, examples: ["ocg_abcdefghijklm"] }
        client_id: { type: string }
        client_name: { type: string }
        client_kind: { type: string, enum: [dynamic, metadata, admin] }
        user_id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scope: { type: string, examples: ["mcp:read mcp:operate"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    MCPConsent:
      type: object
      required: [id, client, redirect_uri, redirect_host, loopback_only, resource, requested_scope, roles, suggested_role, your_role, expires_at]
      properties:
        id: { type: string, examples: ["oar_abcdefghijklm"] }
        client:
          type: object
          required: [id, client_id, name, kind]
          properties:
            id: { type: string }
            client_id: { type: string }
            name: { type: string }
            kind: { type: string, enum: [dynamic, metadata, admin] }
            client_uri: { type: string }
        redirect_uri: { type: string }
        redirect_host: { type: string, description: Where approving sends you, which the consent screen shows plainly. }
        loopback_only: { type: boolean, description: Every redirect the client registered is on your own machine, where any program could listen. }
        resource: { type: string, examples: ["https://zoomies.example.com/mcp"] }
        requested_scope: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        suggested_role: { $ref: "#/components/schemas/Role" }
        your_role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }

    MCPDecision:
      type: object
      required: [redirect_to]
      properties:
        redirect_to: { type: string, description: The client's redirect URI with the code or the error, for the browser to follow. }

    Setting:
      type: object
      description: >-
        One configuration key: what it is, what Zoomies is running, where
        that value came from, and whether an administrator may change it here.
      required: [key, label, section, kind, summary, secret, configured, source, env, stored, editable, scope, live, pending]
      properties:
        key: { type: string, description: The dotted key, spelled as it is in zoomies.yaml., examples: ["scheduler.interval"] }
        label: { type: string, description: The setting's name in prose, for a person reading a form., examples: ["Scheduler interval"] }
        section: { type: string, description: The part before the first dot, which the UI groups under., examples: ["scheduler"] }
        kind:
          type: string
          enum: [string, enum, bool, optional_bool, int, float, duration, strings, labels]
          description: >-
            How to parse and render the value. `duration` is carried as the text an
            operator writes (30s, 5m, 168h) rather than as a number. `optional_bool`
            has three states, because unset means the value is derived from another
            setting. `float` is the one figure that is genuinely fractional, a
            share of a CPU.
        choices:
          type: array
          items: { type: string }
          description: The permitted values, when the kind is `enum`.
        summary: { type: string, description: One line saying what the setting does. }
        value:
          nullable: true
          description: What Zoomies is running. Absent for a secret.
        default:
          nullable: true
          description: What Zoomies uses when nothing says otherwise. Absent for a secret.
        secret: { type: boolean, description: A credential. Its value is never sent; `configured` says whether one is set. }
        configured: { type: boolean, description: Whether the effective value is non-empty. }
        source:
          $ref: "#/components/schemas/SettingSource"
        env: { type: string, description: The ZOOMIES_* variable that overrides this key., examples: ["ZOOMIES_SCHEDULER_INTERVAL"] }
        stored: { type: boolean, description: Whether this fleet's database holds a value for this key. }
        editable: { type: boolean, description: Whether an administrator may change it through this API. }
        scope:
          type: string
          enum: [instance, platform, bootstrap, local]
          description: >-
            `instance` lives in the fleet's database. `platform` lives there too but
            belongs to whoever runs the controller rather than the fleet -- what the
            process binds, trusts, stores, logs or dials from its own machine -- and
            is omitted entirely for a caller below the `platform` role. `bootstrap`
            is read before that database can be opened, so it cannot. `local`
            belongs to a standalone agent's own host.
        reason: { type: string, description: Why it is not editable, written for the person reading it. }
        live: { type: boolean, description: Whether a change is in force by the time the response is written. }
        restart_reason: { type: string, description: Why a change waits for a restart. }
        pending: { type: boolean, description: A stored value is waiting for that restart. }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    Settings:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
          description: >-
            The effective configuration as a nested object, shaped like the file.
            A secret never appears; each one contributes a `<key>_configured`
            boolean instead.
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }
          description: Every configuration key, in the order the documentation lists them.
        findings:
          type: array
          items: { $ref: "#/components/schemas/Problem" }
        pending_restart:
          type: array
          items: { type: string }
          description: Settings stored since this process started that it cannot apply to itself.
        pinned_by_environment:
          type: array
          items: { type: string }
          description: >-
            Settings an environment variable is holding. A change to one of these
            would be stored and then overridden at the next restart, so it is refused.
        config_path: { type: string }
        restart_required_keys:
          type: array
          items: { type: string }
          description: Every key whose change waits for a restart, whether or not one is waiting now.
        version: { type: string }
        database_path: { type: string }
        event_subscribers: { type: integer }

    SettingsExport:
      type: object
      required: [export_version, exported_at, version, settings, secrets_configured]
      properties:
        export_version: { type: integer }
        exported_at: { type: string, format: date-time }
        exported_from: { type: string, description: The address the source instance answers on. }
        version: { type: string, description: The Zoomies build that wrote it. }
        settings:
          type: object
          additionalProperties: true
          description: The nested tree, shaped like zoomies.yaml.
        secrets_configured:
          type: array
          items: { type: string }
          description: Credentials that were set on the source and are not in this document.

    SettingsImportRequest:
      type: object
      required: [document]
      properties:
        document: { type: string, description: An export, or a zoomies.yaml, as text. YAML or JSON. }
        dry_run: { type: boolean, description: Plan and report; write nothing. }
        skip: { type: array, items: { type: string }, description: Keys in the document to leave out. }

    SettingsImportChange:
      type: object
      required: [key, current, incoming, action, live, secret]
      properties:
        key: { type: string }
        label: { type: string }
        section: { type: string }
        current: { nullable: true, description: The running value, as the settings page renders it. Never a secret's. }
        incoming: { nullable: true, description: The document's value, parsed. Never a secret's. }
        action: { type: string, enum: [change, unchanged, unset, refused] }
        live: { type: boolean, description: A change is in force at once; false waits for a restart. }
        secret: { type: boolean }
        reason: { type: string, description: Why it is refused. }

    SettingsImport:
      type: object
      required: [applied, changes, summary, secrets_configured]
      properties:
        applied: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/SettingsImportChange" } }
        summary:
          type: object
          required: [change, unchanged, unset, refused, skipped]
          properties:
            change: { type: integer }
            unchanged: { type: integer }
            unset: { type: integer }
            refused: { type: integer }
            skipped: { type: integer }
        secrets_configured: { type: array, items: { type: string } }
        settings: { $ref: "#/components/schemas/Settings" }

    # --- updates -----------------------------------------------------------
    UpdatesRunning:
      type: object
      required: [version, release]
      properties:
        version:
          type: string
          description: >-
            The build as it reports itself. A release binary says `1.3.5`, without the v its
            tag has; any other says something like `main-sha-abc1234` or `dev`.
          examples: ["1.3.5"]
        release:
          type: boolean
          description: >-
            Whether the build came from a release. Only one that did is offered an update,
            because a build from main is usually ahead of the newest release and taking it
            there would be a downgrade.
    UpdatesRelease:
      type: object
      required: [tag, url, published_at]
      properties:
        tag: { type: string, examples: [v1.3.5] }
        url:
          type: string
          description: >-
            The release's page, where its notes are. Empty when GitHub's address is not an
            absolute https URL.
        published_at:
          type: string
          format: date-time
          description: When GitHub published it, which is where the soak starts.
    UpdatesTarget:
      type: object
      required: [tag, newer, due_at]
      properties:
        tag: { type: string, examples: [v1.3.5] }
        newer: { type: boolean, description: Whether the release is a later one than the build that is running. Only then is there anything to take. }
        due_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The earliest time the mode takes the release: the end of the soak in `auto`. Null in
            `manual`, where the person asking is the only wait, and whenever `newer` is false.
    UpdatesHelper:
      type: object
      required: [state, reason, install_command, upgrade_command]
      properties:
        state:
          type: string
          enum: [ready, missing, unsupported]
          description: >-
            Whether the update helper is installed on the controller's host. Only a helper,
            installed by somebody with root there, can replace the controller's binary, so
            without one the controller cannot update itself. `unsupported` is a host it can
            never be installed on: not Linux, no systemd, a container that runs no runners and so
            has no shared folder, or a container under a rootless runtime.
        reason:
          type: string
          description: A sentence that says what the state means, and for `unsupported` which cause it is. It names no path.
        install_command:
          type: string
          description: The command that installs the helper, for a person with root on the host to run. Empty when it is ready, and when it is `unsupported`.
          examples: [sudo zoomies updates helper install]
        upgrade_command:
          type: string
          description: The command that updates the controller by hand on its host, for a person to copy. Set only when the state is `unsupported`, where it is the way, and empty on Windows, which has no service `zoomies upgrade` can update, where `reason` says what to do by hand instead.
          examples: [sudo zoomies upgrade]
    UpdatesAttempt:
      type: object
      required: [id, state, from, to, trigger, requested_at, finished_at, error]
      properties:
        id: { type: string, examples: [upd_k3fqz2mx7abcd] }
        state:
          type: string
          enum: [requested, succeeded, failed, timed_out, cancelled]
          description: >-
            `requested` until it ends. It ends once: `succeeded` when the controller runs the
            release or a later one, `failed` when the helper refused or the upgrade failed,
            `timed_out` after 90 minutes with neither, or `cancelled`.
        from: { type: string, description: The build that asked, as it reports itself., examples: ["1.3.4"] }
        to: { type: string, description: The release tag it asked for., examples: [v1.3.5] }
        trigger:
          type: string
          enum: [manual, auto]
          description: "`manual` for a person, `auto` for the update mode."
        requested_at: { type: string, format: date-time }
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When it ended. Null while it is `requested`.
        error:
          type: string
          description: >-
            Why it did not succeed, often the helper's own sentence. Empty when it succeeded or
            is still in flight. Only the `platform` role is given the text, which can name a
            folder on the controller's host; every other role is given a fixed sentence for the
            state in its place, and an empty string where there was nothing to say.
    UpdateControllerRequest:
      type: object
      additionalProperties: false
      properties:
        tag:
          type: string
          description: >-
            The release to take, such as `v1.3.5`. Left out, it is the newest release that can be
            installed on this system. A tag that is not of that form, is not in the list the
            controller last read, or is not newer than the running build is refused with
            `update.nothing_newer`.
          examples: [v1.3.5]
    StartHostRolloutRequest:
      type: object
      additionalProperties: false
      properties:
        host_ids:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: >-
            The hosts to take, by id. Left out, it is every host behind the controller's release.
            A host named twice is taken once. An empty list is refused rather than read as every
            host.
          examples: [[hst_k3f9qz2m]]
    UpdatesStatus:
      type: object
      required: [mode, soak, running, latest, target, reason, checked_at, helper, controller, rollout]
      properties:
        mode:
          type: string
          enum: [off, manual, auto]
          description: >-
            `updates.mode` as the controller acts on it. `off` offers nothing, `manual` offers
            the newest release to a person, and `auto` takes it once it has been public for the soak.
        soak:
          allOf: [{ $ref: "#/components/schemas/Duration" }]
          description: >-
            `updates.soak` as the Settings page writes it. `auto` waits this long after a release is
            published; `manual` ignores it.
        running: { $ref: "#/components/schemas/UpdatesRunning" }
        latest:
          description: >-
            The newest release that could be installed on this system, whether or not the build is
            behind it. Null while updating is off, until the list of releases has been read, and
            when nothing in it can be installed here.
          oneOf:
            - $ref: "#/components/schemas/UpdatesRelease"
            - type: "null"
        target:
          description: What the mode would do about `latest`. Null whenever `latest` is.
          oneOf:
            - $ref: "#/components/schemas/UpdatesTarget"
            - type: "null"
        reason:
          type: string
          description: >-
            A sentence or two, in an operator's words, that says what happens next and why: the
            planner's sentence, which is the release rule's own unless an update in flight, a
            rollout or the helper decides what happens next. It always says something: it is what
            to show when there is nothing to offer. It moves with the clock only by the hour or
            the minute of a wait, and never with a heartbeat.
        checked_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the list of releases `latest` was chosen from was read. Null while updating is
            off, and until a list has been read.
        helper: { $ref: "#/components/schemas/UpdatesHelper" }
        controller:
          description: >-
            The controller's latest update attempt, in flight or ended, in every mode: one that
            was in flight when updating was switched off still ends, and says how. Null when it
            has never had one.
          oneOf:
            - $ref: "#/components/schemas/UpdatesAttempt"
            - type: "null"
        rollout:
          description: >-
            The open rollout, or the last one that ended, so that a page can say how it went.
            Null when there has never been one.
          oneOf:
            - $ref: "#/components/schemas/UpdatesRollout"
            - type: "null"
    UpdatesRollout:
      type: object
      required: [id, target, state, halted_reason, done, total, current]
      properties:
        id: { type: string, examples: [rol_k3fqz2mx7abcd] }
        target: { type: string, description: The release tag it takes hosts to., examples: [v1.3.5] }
        state:
          type: string
          enum: [running, halted, done, cancelled]
          description: >-
            `running` while it moves one host at a time, `halted` after a host's update failed or
            timed out (nothing moves until an administrator resumes or cancels it), then `done` or
            `cancelled`.
        halted_reason:
          type: string
          description: >-
            The sentence it halted with, naming the host and the release; empty unless it halted.
            It never carries the helper's text, so every role reads it.
        done: { type: integer, description: Hosts it has updated. }
        total:
          type: integer
          description: >-
            Hosts it has updated and hosts it would still update. For one that has ended, the
            hosts it asked.
        current: { type: string, description: The name of the host being updated now, and empty with none. }

    # --- agent protocol (internal) ------------------------------------------
    # The wire types of the agent routes. internal/agent/protocol.go owns them;
    # these describe what it sends so the document is whole.
    AgentJoinRequest:
      type: object
      required: [protocol_version, join_token, name, capacity, os, arch, version, backends]
      properties:
        protocol_version: { type: integer }
        join_token: { type: string, format: password }
        name:
          type: string
          maxLength: 128
          description: >-
            What the host asks to be called. Refused with 422, before the join token is
            redeemed, when it is empty, over 128 characters or holds a control character
            or a backtick. A host re-joining under the name its row already carries is
            exempt, so one enrolled before the rule keeps working.
        address: { type: string, description: How the host reports itself. The controller never dials it. }
        capacity: { type: integer, description: Concurrent runners the host accepts. 0 lets the join token or the CPU count decide. }
        os: { type: string }
        arch: { type: string }
        version: { type: string, description: The agent's build version, for skew warnings. }
        labels: { type: object, additionalProperties: { type: string } }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
    AgentJoinResponse:
      type: object
      properties:
        host_id: { type: string }
        agent_token: { type: string, description: Shown once. The controller keeps only its hash. }
        controller_version: { type: string }
        heartbeat_interval: { $ref: "#/components/schemas/Duration" }
    AgentHeartbeatRequest:
      type: object
      properties:
        doctor: { $ref: "#/components/schemas/HostDoctor" }
        usage: { $ref: "#/components/schemas/HostUsage" }
        protocol_version: { type: integer }
        capacity: { type: integer, description: The agent's configured value, sent for the log. The controller does not write it. }
        version: { type: string }
        features: { type: array, items: { type: string }, description: Additive runtime capabilities understood by this agent. }
        backends: { type: array, items: { $ref: "#/components/schemas/BackendInfo" } }
        runners: { type: array, items: { $ref: "#/components/schemas/RunnerReport" } }
        update: { $ref: "#/components/schemas/AgentUpdateReport" }
        update_unsupported:
          type: string
          enum: [os, no-systemd, rootless, no-shared-folder]
          description: >-
            Why the update helper can never be installed on this host: not Linux, no systemd, a
            container under a rootless runtime, or a container without the shared folder. Absent
            where it could be, where it is installed, where the agent cannot tell, and from an
            older agent, all of which the controller reads as a helper not yet installed. A word
            the controller does not know is read the same way.
    AgentUpdateReport:
      type: object
      description: >-
        The outcome of an `update_agent` task, sent on the heartbeat of the agent that replaced
        the one that took it, because the task's own result cannot be sent by a process that
        restarted. Repeated until the controller has recorded it. Absent when there is nothing to
        report, and from an agent that cannot update itself (one that does not advertise `self-update`).
      required: [id, ok, tag, finished_at]
      properties:
        id: { type: string, description: The `update_id` of the task this answers. }
        ok: { type: boolean, description: True when the host now runs `tag`. }
        tag: { type: string, description: The release the attempt was for, such as `v1.3.5`. }
        from: { type: string, description: The agent's build version before the attempt, without the leading `v`. }
        to: { type: string, description: The build version after it. Absent when the attempt never reached a new binary. }
        error: { type: string, description: Why the attempt failed, as a sentence for the operator. Absent on success. }
        finished_at: { type: string, format: date-time, description: When the attempt ended, in UTC, by the agent's clock. }
    AgentHeartbeatResponse:
      type: object
      properties:
        mutations_paused: { type: boolean, description: Preserve workloads and quotas while controller authority is paused. }
        ok: { type: boolean }
        cordoned: { type: boolean, description: Mirrors the host's cordon flag so the agent stops asking for work at once. }
        controller_version: { type: string }
        resync_requested: { type: boolean, description: Send a full runner report next time. Set after the controller restarts. }
        throttle: { $ref: "#/components/schemas/ThrottleDirective" }
        elastic_cpu: { type: array, items: { $ref: "#/components/schemas/ElasticCPUDirective" }, description: Complete boosted-runner set; omission restores a previous boost to its guarantee. }
        elastic_memory: { $ref: "#/components/schemas/ElasticMemoryDirective" }
    ElasticMemoryDirective:
      type: object
      description: >-
        The memory valve's rules for one host. Unlike `elastic_cpu` it is not a plan to carry out
        and replace on the next beat but limits to work within, because a memory limit that is
        raised cannot be taken back and the agent has to act between two heartbeats. An agent
        keeps working on the last it was given if the controller goes quiet. Absent means no
        runner here is lent anything.
      required: [capacity_mb, floor_mb]
      properties:
        capacity_mb: { type: integer, format: int64, description: The most that may be lent on this host in all, what has been lent already included. }
        floor_mb: { type: integer, format: int64, description: The least free memory a loan may leave the host. }
        runners:
          type: array
          items: { $ref: "#/components/schemas/ElasticMemoryRunner" }
    ElasticMemoryRunner:
      type: object
      required: [runner_id, mode, guarantee_mb, ceiling_mb]
      properties:
        runner_id: { type: string }
        mode: { type: string, enum: [observe, automatic] }
        guarantee_mb: { type: integer, format: int64, description: What the runner was created with, every container together. }
        ceiling_mb: { type: integer, format: int64, description: The most those containers may hold between them. }
        spill_mb: { type: integer, format: int64, description: The swap each container may be allowed beyond its limit. Absent is none. }
    ThrottleDirective:
      type: object
      properties:
        level: { type: integer, minimum: 0, maximum: 3 }
        cpu_factor: { type: number, format: double, description: Below one reduces every limited runner on this host; pressure always overrides elastic CPU. }
    ElasticCPUDirective:
      type: object
      required: [runner_id, cpu_factor, base_cpus, target_cpus]
      properties:
        runner_id: { type: string }
        cpu_factor: { type: number, format: double, minimum: 1 }
        base_cpus: { type: number, format: double }
        target_cpus: { type: number, format: double }
        reason: { type: string, enum: [squirrel_spotted] }
    RunnerReport:
      type: object
      required: [runner_id, observed_at]
      properties:
        host_removed: { type: boolean, description: "Positive confirmation that backend removal completed, including its work directory; process exit alone is insufficient." }
        cleanup_error: { type: string, description: "Failure of autonomous host cleanup; retained until its retry succeeds." }
        runner_id: { type: string }
        state:
          description: >-
            The state the agent asserts, or empty once the workload is up: whether GitHub has
            handed the runner a job is not the agent's call.
          oneOf:
            - $ref: "#/components/schemas/RunnerState"
            - { type: string, const: "" }
        handle: { type: string, description: The backend's own name for the workload, such as a container ID. }
        phase: { type: string, enum: [starting, running, exited, exit_unknown, failed, gone] }
        exit_code: { type: integer }
        message: { type: string }
        stats: { $ref: "#/components/schemas/WorkloadStats" }
        github_runner_id: { type: integer, format: int64, description: Filled in once the runner has registered. }
        observed_at: { type: string, format: date-time }
    WorkloadStats:
      type: object
      properties:
        sampled_at: { type: string, format: date-time, description: Time of the last successful sample. Absence means freshness is unknown. Retained samples keep their original timestamp. }
        cpu_throttling:
          type: object
          description: Cumulative cgroup CPU quota counters. Absent when unsupported; resets on workload recreation.
          properties:
            periods: { type: integer, format: int64 }
            throttled_periods: { type: integer, format: int64 }
            throttled_nanoseconds: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64 }
        cpu_allocation_factor: { type: number, format: double, description: One is the guaranteed creation quota; above one is elastic CPU and below one is host-pressure throttling. }
        busiest_half_percent: { type: number, format: double, description: For a docker-in-docker pair, how much of its own creation quota the busier container is using, in percent. Absent for a single container. }
        memory_valve:
          type: object
          description: What the memory valve has done for this runner, as its agent saw it. Absent for a runner the agent is not watching.
          required: [mode, code]
          properties:
            mode: { type: string, enum: [off, observe, automatic] }
            code: { type: string, enum: [healthy, raised, spilled, at_ceiling, pool_empty, host_floor, unmeasured, unsupported, failed], description: The guard's latest decision. }
            reason: { type: string, description: The sentence for the last decision that was not "healthy". }
            lent_bytes: { type: integer, format: int64, description: What the runner's containers hold beyond what they were created with. }
            spill_bytes: { type: integer, format: int64, description: The swap they may use beyond their limits. }
            would_lend_bytes: { type: integer, format: int64 }
            would_spill_bytes: { type: integer, format: int64 }
            near_limit: { type: boolean }
            raises: { type: integer }
        halves:
          type: object
          description: For a docker-in-docker pair, what each container used on its own, beside the limits it was created with. Absent for a single container and from an agent that predates it. The controller judges how the pair's slot is divided from it (`pool.daemon_share_suggested`).
          properties:
            runner: { $ref: '#/components/schemas/WorkloadHalfUse' }
            daemon: { $ref: '#/components/schemas/WorkloadHalfUse' }
    WorkloadHalfUse:
      type: object
      properties:
        cpus: { type: number, format: double, description: Cores in use at the sample. }
        cpu_limit: { type: number, format: double, description: The CPU quota the container was created with, in cores. Absent when it had none. }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64, description: Absent when the container had no limit. }
    AgentTaskKind:
      type: string
      description: >-
        `update_agent` is queued only for a host whose agent advertises the `self-update` feature;
        an older agent would report it failed as an unknown kind.
      enum: [create_runner, stop_runner, remove_runner, stream_logs, cancel_logs, prewarm_image, fill_tool_cache, update_agent]
    AgentTask:
      type: object
      description: One unit of work for an agent. Tasks are idempotent; the controller may redeliver one after a restart.
      required: [id, kind, issued_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        spec: { $ref: "#/components/schemas/RunnerSpec" }
        backend: { $ref: "#/components/schemas/BackendKind" }
        pool_id: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        stop_timeout: { type: integer, format: int64, description: Nanoseconds. Bounds a graceful stop. }
        stream_id: { type: string, description: The log relay a stream_logs or cancel_logs task concerns. }
        log_options: { $ref: "#/components/schemas/LogOptions" }
        tools:
          type: array
          description: What a fill_tool_cache task puts in the tool cache of the pool its spec names.
          items:
            type: object
            required: [tool, version]
            properties:
              tool: { type: string }
              version: { type: string }
              distribution: { type: string }
        update_id: { type: string, description: "For an update_agent task: the update attempt the controller recorded, which the agent echoes in its heartbeat's `update` report." }
        update_tag: { type: string, description: "For an update_agent task: the release to move to, exactly vMAJOR.MINOR.PATCH. It is the whole instruction; no URL, path or flag travels with it." }
        issued_at: { type: string, format: date-time }
        attempt: { type: integer, description: "Deliveries of this task so far, from 1. A create that cannot tell whether its runner already exists fails a first delivery promptly and leaves a redelivery for the lease. Absent from older controllers." }
    RunnerSpec:
      type: object
      description: >-
        Everything a backend needs to create one runner. The one place a JIT config crosses
        the wire, which is why the agent transport requires TLS off loopback.
      properties:
        name: { type: string, description: The runner name GitHub will know it by. It doubles as the container name. }
        runner_id: { type: string }
        pool_id: { type: string }
        pool_name: { type: string }
        image: { type: string }
        pull_policy: { $ref: "#/components/schemas/PullPolicy" }
        start_before: { type: string, format: date-time, description: Do not create a new workload at or after this provisioning deadline; existing workloads are still adopted. }
        credentials:
          type: object
          description: The runner's registration credentials. Never logged, never shown.
          properties:
            jit_config: { type: string, format: password }
            registration_token: { type: string, format: password }
            expires_at: { type: string, format: date-time, description: GitHub token expiry when known. }
            url: { type: string, description: The organisation or repository URL the runner registers against. }
            runner_group: { type: string }
            labels: { type: array, items: { type: string } }
            no_default_labels: { type: boolean, description: Pass --no-default-labels to config.sh on the registration-token path. }
        env: { type: object, additionalProperties: { type: string } }
        ephemeral: { type: boolean }
        resources: { $ref: "#/components/schemas/Resources" }
        cache: { $ref: "#/components/schemas/CacheConfig" }
        tmpfs: { $ref: "#/components/schemas/TmpfsConfig" }
        repository: { type: string }
        docker_mode: { $ref: "#/components/schemas/DockerMode" }
        run_as_root: { type: boolean }
        network: { type: string }
        work_dir: { type: string }
        runner_version: { type: string, description: The actions/runner release the process backend downloads. }
    LogOptions:
      type: object
      description: How a log relay reads the workload's output. The names are capitalised on the wire, as the Go type carries no JSON tags.
      properties:
        Follow: { type: boolean }
        Tail: { type: integer, description: Lines of backlog to send first. 0 means everything. }
        Since: { type: string, format: date-time }
        Timestamps: { type: boolean }
    AgentTaskResult:
      type: object
      required: [task_id, ok, completed_at]
      properties:
        task_id: { type: string }
        kind: { $ref: "#/components/schemas/AgentTaskKind" }
        runner_id: { type: string }
        ok: { type: boolean }
        error: { type: string }
        handle: { type: string }
        startup_wait: { type: integer, format: int64, description: Nanoseconds waiting for host startup admission. }
        dind_ready_duration: { type: integer, format: int64, description: Nanoseconds creating and awaiting a healthy sidecar after its image is available. }
        image_pull_duration: { type: integer, format: int64, description: Nanoseconds. Absent when the backend cannot tell pulling from creation. }
        create_duration: { type: integer, format: int64, description: Nanoseconds. }
        container_started_at: { type: string, format: date-time }
        digest: { type: string }
        state: { $ref: "#/components/schemas/RunnerState" }
        tool_fills: { type: array, items: { $ref: "#/components/schemas/ToolFill" }, description: What a fill_tool_cache task did with each request. }
        completed_at: { type: string, format: date-time }
    AgentTaskBatch:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/AgentTask" } }
        backoff: { type: integer, format: int64, description: Nanoseconds to wait before polling again, when the controller sheds load. }
