<div class="zoomies-brand" data-zoomies-brand>
  <div
    class="zoomies-brand__art"
    role="img"
    aria-label="Zoomies: a happy cocker spaniel in a circular swish, above the Zoomies wordmark"
  >

         of pixels below the fold, and a 180 KB image fetched first competes
         with the page's first paint. The SVG's <image> layers below carry no
         address on purpose -- an SVG <image> ignores loading="lazy", so ten of
         them pointing at this file would fetch it while the page is still being
         parsed. The script hands them this image's address once it has loaded. -->
    <img
      class="zoomies-brand__fallback off-glb"
      src="brand/logo-white-transparent.png"
      width="1254"
      height="1254"
      alt=""
      loading="lazy"
      decoding="async"
    />

      aria-hidden="true"
