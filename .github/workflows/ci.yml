name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where CI runs. github is the recovery path for every job."
        type: choice
        default: zoomies
        options: [zoomies, github]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request only needs its newest result. Main is also the publisher for
  # the moving :dev channel, though: cancelling it before Images has pushed can
  # leave every successful merge unavailable to `zoomies upgrade`. Queue main
  # runs so the newest one always gets a chance to publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "22"

# CI defaults to the Zoomies pool. Forks use GitHub-hosted runners, and a
# manual dispatch with runner=github recovers every job, including image builds.
# Pin the pool to an already published runner image digest; advance that pin
# separately after validating new images so builds do not require their output.
jobs:
  # Which jobs a change needs. A docs-only change used to run the whole suite:
  # an hour of the Go packages under the race detector, the Playwright suite,
  # five cross-compiles and the image builds, every one of them on a fleet
  # slot another pull request was queueing for. Now a change runs what its
  # files can affect -- on main as well as on a pull request. Main used to run
  # everything on every merge, so a README edit rebuilt and republished every
  # binary and image on the dev channel with nothing in them different.
  #
  # Main still publishes, but only a commit that changes something shipped:
  # Go, the UI the binary embeds, or what the images are made of. A commit that
  # changes only prose, the install script or the workflows leaves the dev
  # channel where it was, which keeps its promise -- every binary and image on
  # it names one commit -- because none of them moves. CI still starts for
  # every commit on main, and finishes in the time the first job takes when
  # there is nothing to do, because the dev watchdog reads a commit with no
  # finished CI run as one the fleet is starving. A manual dispatch runs
  # everything, because it is the recovery path.
  #
  # This is a shell case statement rather than an action so that it stays a
  # single read: what a path triggers is written next to the path, and an
  # unknown path falls through to the Go set, which is the largest -- a new
  # kind of file runs too much rather than too little.
  changes:
    name: What changed
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    outputs:
      go: ${{ steps.filter.outputs.go }}
      shards: ${{ steps.filter.outputs.shards }}
      web: ${{ steps.filter.outputs.web }}
      deploy: ${{ steps.filter.outputs.deploy }}
      installer: ${{ steps.filter.outputs.installer }}
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # Main publishes the dev channel from any commit that changes what
          # is shipped. Nothing else publishes from CI.
          on_main=false
          if [ "$EVENT" != "pull_request" ] && [ "$REF" = "refs/heads/main" ]; then
            on_main=true
          fi
          everything() {
            {
              echo "go=true"; echo "web=true"; echo "deploy=true"; echo "installer=true"
              echo 'shards=["controller","api","store","rest"]'
              echo "publish=$on_main"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            everything
          fi
          # A pull request's checkout is the merge into its base, so its diff
          # against the base commit is exactly what it changes; a push's is
          # the diff against the commit main was at before. A base that cannot
          # be fetched -- a force push, a new branch's all-zero "before", a
          # base that moved on -- says nothing about what changed, so run
          # everything rather than guess.
          case "$BASE" in ''|0000000000000000000000000000000000000000) everything ;; esac
          if ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            everything
          fi
          go=false; web=false; deploy=false; installer=false; rest=false; docs=false
          for f in $(git diff --name-only "$BASE" HEAD); do
            case "$f" in
              # The build and the tests themselves: every job is downstream.
              .github/workflows/ci.yml|Makefile|go.mod|go.sum) everything ;;
              # The UI, and the spec its client is generated from. The spec is
              # embedded in the binary too, so it is a Go change as well.
              api/openapi.yaml) go=true; web=true ;;
              # The controller image runs npm ci, so its inputs are the
              # image's too.
              web/package.json|web/package-lock.json) web=true; deploy=true; docs=true ;;
              # internal/docs reads the UI's source for the pages it names.
              web/*) web=true; docs=true ;;
              # What the images are made of. The runner scripts are also read
              # by the installer job's shell checks, and every deploy/ file by
              # tests in internal/backend, internal/installer and internal/docs,
              # which are in the rest shard.
              deploy/runner-*.sh) deploy=true; installer=true; rest=true ;;
              deploy/*|docker-compose.yml|.dockerignore) deploy=true; rest=true ;;
              # The check each built runner image is run through.
              test/runner-image/*) deploy=true; installer=true ;;
              # The script people curl is checked by the install.sh job and
              # exercised by the upgrade test. No Go test reads it, and no
              # binary or image carries it: the site serves it, and the site's
              # own workflow rebuilds when it changes.
              install.sh|test/install/*|test/upgrade/*) installer=true ;;
              # Prose, and the workflows. internal/docs tests the problem-code
              # table, the README, the workflows and the roadmap against the
              # code, and internal/naming the image table; those two packages
              # are the docs shard, a minute rather than the hour the rest of
              # the suite takes. Nothing heavier runs.
              docs/*|roadmap/*|overrides/*|hooks/*|mkdocs.yml|*.md|.github/*) docs=true ;;
              # Files that neither ship nor are read by a test.
              .gitignore|.gitattributes|.editorconfig|LICENSE|NOTICE|.claude/*|.devcontainer/*|nixpacks.toml) ;;
              # Everything else is Go, or something Go embeds.
              *) go=true ;;
            esac
          done
          if [ "$go" = true ]; then
            shards='["controller","api","store","rest"]'
          elif [ "$rest" = true ]; then
            shards='["rest"]'
          elif [ "$docs" = true ]; then
            shards='["docs"]'
          else
            shards='[]'
          fi
          # A binary carries Go and the UI; the images carry the binary and
          # what deploy/ says. Any of the three changes what the dev channel
          # would ship.
          publish=false
          if [ "$on_main" = true ] && { [ "$go" = true ] || [ "$web" = true ] || [ "$deploy" = true ]; }; then
            publish=true
          fi
          {
            echo "go=$go"; echo "web=$web"; echo "deploy=$deploy"; echo "installer=$installer"
            echo "shards=$shards"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "go=$go web=$web deploy=$deploy installer=$installer shards=$shards publish=$publish"

  # The Go suite, split by package across runners. Three packages are most of
  # it -- on the fleet the controller has taken 45 minutes, the API 29 and the
  # store 22, single-threaded under the race detector -- so each is a shard of
  # its own and everything else shares the fourth, along with the checks that
  # read the whole tree. The wall-clock is now the slowest shard, and a shard
  # can be tuned on its own.
  #
  # Coverage is measured on main and on a manual dispatch, not on a pull
  # request: -coverpkg=./... with atomic counters is the most expensive
  # instrumentation Go offers, and the number it produces is the one Codecov
  # tracks on main. A pull request still runs every test under the race
  # detector.
  go:
    name: Go (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.shards != '[]'
    permissions:
      contents: read
    # On the fleet the controller shard takes 45 to 50 minutes when the runner
    # has a host to itself, more with coverage on main, and a busy evening's
    # backlog stretches it. The limit is here to catch a hang, not a slow
    # machine, so it sits well above the slowest shard seen.
    timeout-minutes: 120
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go:embed needs the directory to exist even when the UI is not built.
      # The docs shard tests two packages that import nothing of ours, so it
      # has no embedded UI to stub. Writing the stub compiles nothing: this
      # step used to build the whole binary, which on a cold fleet runner was
      # minutes of compiling and, when the module proxy stalled, a step that
      # never finished.
      - name: Stub the embedded UI
        if: matrix.shard != 'docs'
        timeout-minutes: 1
        run: make ui-stub

      # Fetching modules is the one step here that waits on the network, so it
      # is on its own with a bound: a stalled proxy fails in minutes and says
      # so, rather than eating the job's two hours inside go vet or go test.
      - name: Download modules
        if: matrix.shard != 'docs'
        timeout-minutes: 10
        run: go mod download

      # The checks that read the whole tree run once, in the shard that is
      # otherwise the lightest.
      - name: gofmt
        if: matrix.shard == 'rest'
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        if: matrix.shard == 'rest'
        run: go vet ./...

      - name: go mod tidy is clean
        if: matrix.shard == 'rest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Pick the shard's packages
        id: pkgs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          case "$SHARD" in
            controller) pkgs=./internal/controller/ ;;
            api) pkgs=./internal/api/ ;;
            store) pkgs=./internal/store/ ;;
            rest) pkgs=$(go list ./... | grep -vE '/internal/(controller|api|store)$' | tr '\n' ' ') ;;
            # Only a change to prose, the workflows or the UI's source: the two
            # packages that read those files against the code. The rest shard
            # carries them too, so they never run twice.
            docs) pkgs="./internal/docs/ ./internal/naming/" ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"

      # Coverage is main's record of the whole suite, so it is measured only
      # when the whole suite runs. A shard run for a deploy or docs change on
      # main is tested the way a pull request is, and uploads nothing that
      # would read as the project's coverage falling to one package's.
      - name: Test
        if: github.event_name == 'pull_request' || needs.changes.outputs.go != 'true'
        # The timeout is per package, not per test. The API and controller
        # suites repeatedly migrate pure-Go SQLite under race instrumentation
        # and exceed Go's default ten-minute budget many times over on the
        # fleet runner; the Makefile carries the bounded budget so local
        # make test shares it.
        run: make test TEST_PKGS="${{ steps.pkgs.outputs.list }}"

      - name: Test with coverage
        if: github.event_name != 'pull_request' && needs.changes.outputs.go == 'true'
        run: make cover-shard TEST_PKGS="${{ steps.pkgs.outputs.list }}" COVERDIR="$RUNNER_TEMP/covdata"

      - name: Preserve the shard's coverage
        if: github.event_name != 'pull_request' && needs.changes.outputs.go == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covdata-${{ matrix.shard }}
          path: ${{ runner.temp }}/covdata
          if-no-files-found: error
          retention-days: 3

  # One coverage number from four shards. Each shard instrumented every
  # package, so their counters are merged rather than concatenated -- see
  # cover-merge in the Makefile -- and the merged profile is what Codecov and
  # the job summary see.
  ai-context-workflow:
    name: AI Context generator and publication contract
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the exact managed generator toolchain
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/zoomies-tools"
          cp internal/aicontext/templates/package-lock.json "$RUNNER_TEMP/zoomies-tools/package-lock.json"
          printf '%s\n' '{"name":"zoomies-ai-context","private":true,"dependencies":{"repomix":"1.18.1"}}' > "$RUNNER_TEMP/zoomies-tools/package.json"
          npm ci --prefix "$RUNNER_TEMP/zoomies-tools" --ignore-scripts --no-audit --no-fund
      - name: Verify real Repomix generation and publication boundaries
        env:
          ZOOMIES_TEST_REPOMIX_CLI: ${{ runner.temp }}/zoomies-tools/node_modules/.bin/repomix
        run: go test -race ./internal/aicontext -count=1

  coverage:
    name: Coverage
    needs: [changes, go]
    if: github.event_name != 'pull_request' && needs.changes.outputs.go == 'true'
    permissions:
      contents: read
      id-token: write # Codecov authenticates uploads without a stored secret.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download coverage shards
        id: download-covdata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: covdata-*
          path: ${{ runner.temp }}/covdata
      # The artifact backend occasionally answers a self-hosted runner with a
      # 403 "Error from intermediary" that clears itself on a second attempt --
      # only one leg of an otherwise identical matrix fails this way, so it is
      # the request that is flaky, not the artifact.
      - name: Retry coverage shard download
        if: steps.download-covdata.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: covdata-*
          path: ${{ runner.temp }}/covdata
      - name: Merge the shards
        run: |
          set -eu
          dirs=$(ls -d "$RUNNER_TEMP"/covdata/covdata-* | tr '\n' ',' | sed 's/,$//')
          make cover-merge COVERDIRS="$dirs"
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true

  drill:
    name: Drill
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    # The drill uses two local processes and no Docker daemon. Keep it off the
    # project runner pool so a lost runner cannot discard its evidence or block
    # this independent integration check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The runtime tier runs the built binary as two real processes. It needs
      # no Docker daemon and no GitHub credentials: the backend is `process`
      # with a stub runner staged on disk, and GitHub is a fake in the test
      # process. That is what makes it something every pull request can afford.
      # Where the record ends before this run appends to it, so the summary and
      # the commit below carry this run's rows rather than the whole history.
      - name: Note where the drill record ends
        id: record
        run: echo "lines=$(wc -l < roadmap/validation/drills.md 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Run the lifecycle drill
        run: make test-drill

      # The load measurement runs here too, for its assertions rather than its
      # figures: every read still answers, and a deep page is still a page of
      # rows, with a month of history under it. The timings go to the job
      # summary and nowhere else -- a runner's p95 is not a gate, and the
      # recorded evidence is written by `make measure` on a known machine.
      - name: Measure the reads a page makes
        run: make measure LOAD_RECORD=$RUNNER_TEMP/load.md

      - name: Load record
        if: always()
        run: cat "$RUNNER_TEMP/load.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # The record is the deliverable, not just the exit code: it says what was
      # observed and whether anything was left for a person to clean up. The
      # summary carries this run's rows only -- the history belongs in the file.
      - name: Drill record
        if: always()
        run: |
          if [ -f roadmap/validation/drills.md ]; then
            tail -n +$(( ${{ steps.record.outputs.lines }} + 1 )) roadmap/validation/drills.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Keep evidence per commit without letting test code write to main.
      - name: Preserve drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drill-evidence-${{ github.sha }}
          path: roadmap/validation/drills.md
          if-no-files-found: error
          retention-days: 90

  # Linux arm64 is the other architecture every release ships for, and until
  # this job existed nothing had run a test on it: the support matrix recorded
  # it as cross-compiled and no more. The Go suite and the runtime drill on
  # GitHub's hosted arm64 runner are what move that row. Hosted rather than the
  # Zoomies pool because the pool has no arm64 host to dogfood on yet; a
  # public repository pays nothing for the label.
  arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The drill needs the real binary, so this one builds; the bound turns
      # a stalled module fetch into a failure that names this step.
      - name: Build the binary
        timeout-minutes: 15
        run: make build-nogui
      - name: Test
        run: make test
      - name: Note where the drill record ends
        id: record
        run: echo "lines=$(wc -l < roadmap/validation/drills.md 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Run the lifecycle drill
        run: make test-drill
      # This run's rows go to the summary only. The file on main is written by
      # the Drill job, and two jobs appending the same drills to one file
      # would double every row.
      - name: Drill record
        if: always()
        run: |
          if [ -f roadmap/validation/drills.md ]; then
            echo "Drills on $(uname -m):" >> "$GITHUB_STEP_SUMMARY"
            tail -n +$(( ${{ steps.record.outputs.lines }} + 1 )) roadmap/validation/drills.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Windows is the platform the agent learnt to run on last, and this is the
  # only place anything runs on it. The whole tree builds and vets, and the
  # packages the Windows agent is made of run their tests here without the
  # race detector, which needs a C toolchain the stock runner does not pair
  # with CGO_ENABLED=0. The rest of the suite is Linux-shaped (shell stubs,
  # signals, unit files) and skips or does not apply; the support matrix says
  # which row this leg backs.
  windows:
    name: Windows
    runs-on: windows-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # go:embed needs the directory to exist even when the UI is not built,
      # and the stock Windows runner has no make.
      - name: Stub the embedded UI
        run: |
          mkdir -p internal/api/webdist
          printf '<!doctype html><title>Zoomies</title><p>The UI was not built.' > internal/api/webdist/index.html
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o zoomies.exe ./cmd/zoomies
      - name: Test the packages the Windows agent is made of
        run: go test -count=1 -timeout 20m ./internal/backend/ ./internal/machine/ ./internal/agent/ ./internal/installer/ ./internal/config/ ./internal/naming/ ./cmd/zoomies/
      # The database lock is a byte-range lock here rather than flock, and it
      # is the one thing in the store that has a Windows implementation of its
      # own; the test proves it holds across processes.
      - name: The database lock holds between processes
        run: go test -count=1 -run TestTheDatabaseLock ./internal/store/

  upgrade:
    name: Upgrade
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.installer == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # This is the one job that runs two builds of Zoomies: the last published
      # release, installed the way an operator installs it, and the build under
      # test on top of it. It is also the only check that install.sh can still
      # find a release at all -- everything else about the installer is a syntax
      # check.
      - name: Pick the latest installable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 - <<'PY'
          import os
          import json
          import urllib.request

          repo = "eyupio/zoomies"
          asset = "zoomies_linux_amd64"
          token = os.environ.get("GITHUB_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = "token " + token
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  releases = json.load(resp)
              if not releases:
                  break
              for release in releases:
                  # The rolling dev prerelease carries binaries too, but this
                  # job exercises upgrading from a versioned release.
                  if not str(release.get("tag_name", "")).startswith("v"):
                      continue
                  names = {a.get("name") for a in release.get("assets", [])}
                  if asset in names:
                      print(release["tag_name"])
                      raise SystemExit(0)
              page += 1
          raise SystemExit(f"no published release has the {asset} asset")
          PY
          )
          echo "ZOOMIES_VERSION=$tag" >> "$GITHUB_ENV"
      - name: Upgrade the last published release to this build
        run: make test-upgrade

  staticcheck:
    name: staticcheck
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Stub the embedded UI
        timeout-minutes: 1
        run: make ui-stub
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: latest
          install-go: false

  ui:
    name: UI
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      # The generated client must match api/openapi.yaml. If it does not, the
      # UI is typed against an API that no longer exists.
      - name: The generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api/schema.d.ts \
            || { echo "::error::src/lib/api/schema.d.ts is stale. Run 'make openapi' and commit the result."; exit 1; }
        working-directory: web
      - run: npm run check
        working-directory: web
      # The build fails on its own if the gzipped shell exceeds the 200 KB
      # budget documented in docs/ui-guidelines.md.
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webdist
          path: internal/api/webdist
          retention-days: 3

  playwright:
    name: Playwright
    # Not gated on sudo the way the runner image's passwordless entry
    # promises (see deploy/Dockerfile.runner): a pool running the process
    # backend gives its agent's systemd unit NoNewPrivileges=yes, which
    # makes sudo refuse to escalate no matter what the sudoers file says --
    # see the installer job below. Unlike dash/shellcheck, Chromium's shared
    # libraries cannot be fetched as a standalone binary, so the install step
    # below unpacks them into a private prefix instead of installing them
    # system-wide when sudo is not available.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    # The suite drives the real binary, so a Go change can break it as
    # surely as a web one.
    needs: [changes, ui]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download webdist artifact
        id: download-webdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: webdist
          path: internal/api/webdist
      # See the coverage job's comment above: this is the same transient
      # intermediary 403, not a broken artifact.
      - name: Retry webdist download
        if: steps.download-webdist.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webdist
          path: internal/api/webdist
      - run: go build -o zoomies ./cmd/zoomies
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Playwright Chromium
        # The browser itself needs no privilege; only the shared libraries it
        # links against do. Where sudo actually works, install-deps puts them
        # where every other package on the system lives -- run unprivileged,
        # not under sudo itself: it shells out to `sudo -- sh -c "apt-get
        # ..."` on its own for just the package install, and wrapping the
        # whole npx invocation in sudo instead drops it onto root's
        # sudoers-restricted PATH, which does not carry the Node version
        # actions/setup-node put on this job's own PATH. Where sudo does not
        # work (see the job comment above), the .debs are downloaded with
        # apt's own cache and state redirected into a writable prefix --
        # `download` and `dpkg -x` need no root either way -- and the browser
        # is pointed at the unpacked libraries with LD_LIBRARY_PATH instead.
        # The package list is what `playwright install-deps --dry-run
        # chromium` prints on the runner image's own Ubuntu 24.04, minus
        # Xvfb and the font packages, which only matter for a display
        # chrome-headless-shell never opens.
        run: |
          npx playwright install chromium
          if sudo -n true >/dev/null 2>&1; then
            npx playwright install-deps chromium
          else
            prefix="${RUNNER_TEMP}/chromium-deps"
            mkdir -p "${prefix}/lists/partial" "${prefix}/cache/archives/partial" "${prefix}/debs" "${prefix}/root"
            apt_opts=(-o "Dir::State::Lists=${prefix}/lists" -o "Dir::Cache=${prefix}/cache" -o "Acquire::Retries=3")
            apt-get "${apt_opts[@]}" update
            (cd "${prefix}/debs" && apt-get "${apt_opts[@]}" download \
              libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
              libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
              libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
              libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2)
            for deb in "${prefix}"/debs/*.deb; do dpkg -x "${deb}" "${prefix}/root"; done
            echo "LD_LIBRARY_PATH=${prefix}/root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          fi
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  build-matrix:
    name: Cross-compile
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    needs: [changes, ui]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download webdist artifact
        id: download-webdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: webdist
          path: internal/api/webdist
      # See the coverage job's comment above: this is the same transient
      # intermediary 403, not a broken artifact.
      - name: Retry webdist download
        if: steps.download-webdist.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webdist
          path: internal/api/webdist
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/zoomies ./cmd/zoomies

  # The dev channel is installable, not just pullable. The image and binary
  # carry the same main-sha-* stamp, and the rolling prerelease gives
  # install.sh --version dev a stable URL whose bytes are replaced on every
  # successful push to main.
  dev-binaries:
    name: Publish dev binaries
    # Only a commit on main that changes what ships (see changes). The jobs it
    # waits on are skipped when their inputs did not change, and a skipped job
    # is not a failed one, so the condition says "none failed" rather than
    # leaving GitHub to skip this one because a job it waits on did not run.
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && needs.changes.outputs.publish == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [changes, go, ui, installer]
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: build
        run: |
          echo "version=main-sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.build.outputs.version }} COMMIT=${{ github.sha }} DATE=${{ steps.build.outputs.date }}
      - id: binary-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/zoomies_*"
      # Two files from one attestation. The Sigstore bundle is what
      # `gh attestation verify` reads: the signed statement plus the
      # certificate and transparency-log entry that prove who signed it. The
      # .intoto.jsonl beside it is the same signed statement on its own, in
      # the DSSE envelope the SLSA tooling and the OpenSSF Scorecard look for;
      # a release carrying only the bundle scores as signed but unattested.
      - name: Attach verifiable provenance to the release
        env:
          BUNDLE: ${{ steps.binary-provenance.outputs.bundle-path }}
        run: |
          set -eu
          cp "$BUNDLE" dist/zoomies-provenance.sigstore.json
          jq -c '.dsseEnvelope' "$BUNDLE" > dist/zoomies-provenance.intoto.jsonl
          # A bundle without an envelope is not provenance; refuse it here
          # rather than attach an empty file that verifies nothing.
          test "$(jq -r '.payloadType' dist/zoomies-provenance.intoto.jsonl)" = "application/vnd.in-toto+json"

      - name: Move the dev tag to this build
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev
      # Published with gh rather than an action, because what this has to
      # survive is GitHub's own asset upload being slow: each of these
      # binaries is about 50 MB, and a publish has taken nine minutes a file
      # and then failed on the next one with "Error saving asset" -- an error
      # with no status, no name and no retry behind it.
      #
      # Three properties answer that, and no action offers them together. An
      # asset the release already holds with the same digest is not sent
      # again, so a re-run after a failure carries on where it stopped instead
      # of spending ten minutes arriving back where it started. An upload that
      # fails is retried, because a transfer that long has more chances to be
      # interrupted than to be wrong. And the release is checked at the end,
      # because a channel missing a binary is a channel `zoomies upgrade`
      # breaks on, and the whole point of this job is that it does not.
      - name: Publish the dev release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Rolling development build from `main`. Assets and the `dev` tag move on every successful push.

            Use a versioned release for production or reproducible installs.
        run: |
          set -euo pipefail
          files="dist/zoomies_linux_amd64 dist/zoomies_linux_arm64 dist/zoomies_darwin_amd64 dist/zoomies_darwin_arm64 dist/zoomies_windows_amd64.exe dist/checksums.txt dist/zoomies-provenance.sigstore.json dist/zoomies-provenance.intoto.jsonl"
          for f in $files; do
            test -f "$f" || { echo "::error::make dist did not produce $f"; exit 1; }
          done

          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title "Development build" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create dev --title "Development build" --notes "$NOTES" --prerelease --latest=false
          fi

          # name and digest of what is up there already. A release from before
          # GitHub recorded digests reports none, and an asset with no digest
          # is one we cannot vouch for, so it is replaced.
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.assets[] | "\(.name) \(.digest // "")"')

          for f in $files; do
            name=$(basename "$f")
            want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
            if printf '%s\n' "$have" | grep -qxF "$name $want"; then
              echo "= $name is already published"
              continue
            fi
            for attempt in 1 2 3; do
              if gh release upload dev "$f" --clobber; then
                echo "+ $name"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::$name could not be uploaded after three attempts"
                exit 1
              fi
              sleep $((attempt * 30))
            done
          done

          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.assets[].name')
          missing=""
          for f in $files; do
            name=$(basename "$f")
            printf '%s\n' "$published" | grep -qxF "$name" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the dev release is missing:$missing"
            exit 1
          fi

  installer:
    name: install.sh
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    # Not gated on sudo: a pool running the process backend gives its agent's
    # systemd unit NoNewPrivileges=yes (the job tree hangs off that same
    # process), which makes sudo refuse to escalate, passwordless entry in
    # the sudoers file or not. Both tools below are fetched without root
    # instead, which also works unchanged on a GitHub-hosted runner.
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: POSIX shell syntax
        run: |
          # dash is the strictest POSIX sh most users will have; install.sh must
          # parse under it, not just under bash. Debian and Ubuntu require it
          # as the /bin/sh provider, so it is already here on both a Zoomies
          # runner and a GitHub-hosted one -- nothing to install.
          command -v dash >/dev/null || { echo "::error::dash is not on PATH"; exit 1; }

          # shellcheck carries no such guarantee, and fetching the pinned
          # static binary needs no root at all.
          SHELLCHECK_VERSION=0.10.0
          SHELLCHECK_SHA256=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
          export PATH="$HOME/.local/bin:$PATH"

          dash -n install.sh
          shellcheck -s sh install.sh
          dash -n test/install/install-check.sh
          shellcheck -s sh test/install/install-check.sh
          shellcheck deploy/runner-entrypoint.sh
          dash -n test/upgrade/upgrade-check.sh
          shellcheck -s sh test/upgrade/upgrade-check.sh
          dash -n test/runner-image/check.sh
          shellcheck -s sh test/runner-image/check.sh
          dash -n test/runner-image/dnf-check.sh
          shellcheck -s sh test/runner-image/dnf-check.sh
          # Both image workflows and make invoke this directly. Shell syntax
          # checks alone accepted mode 0644 and every release leg then failed.
          test -x test/runner-image/check.sh || { echo "::error::test/runner-image/check.sh must be executable"; exit 1; }
          # The runner image's own scripts run under whatever /bin/sh the base
          # image has, which on Debian is not bash. Globbed rather than listed,
          # so a new one is covered by existing.
          for f in deploy/runner-*.sh; do
            # The entrypoint is bash and is checked as bash, above.
            case "$f" in deploy/runner-entrypoint.sh) continue ;; esac
            dash -n "$f"
            shellcheck -s sh "$f"
          done

      - name: RPM package install recovery
        run: dash test/runner-image/dnf-check.sh

      - name: What install.sh does on a host that already has the binary
        run: |
          # Syntax checking is not behaviour checking, and the difference is why
          # a re-run of the controller's own join command used to drop the join.
          # Run under dash as well as sh, since that is what most hosts have.
          TEST_SH=dash test/install/install-check.sh install.sh

  images:
    name: Images
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    needs: [changes, dev-binaries]
    # Main pushes and manual recovery publish matching binaries before images.
    # Pull requests and checks on other branches do not publish dev binaries,
    # and only build the images when something that goes into them changed:
    # the binary and the UI inside are built and tested by their own jobs.
    # A pull request builds the images when their inputs change. Main builds
    # them whenever it publishes binaries, whatever changed: a Go-only commit
    # still changes the binary inside the controller image, and the dev
    # channel's binaries and images must name the same commit.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || needs.dev-binaries.result == 'success') && (needs.changes.outputs.deploy == 'true' || needs.changes.outputs.publish == 'true') }}
    # Publishing needs to write packages; everything else here only reads.
    permissions:
      contents: read
      packages: write
    env:
      CONTROLLER_IMAGE: ghcr.io/eyupio/zoomies
      AGENT_IMAGE: ghcr.io/eyupio/zoomies-agent
      RUNNER_IMAGE: ghcr.io/eyupio/zoomies-runner
      RUNNER_DOCKER_IMAGE: ghcr.io/eyupio/zoomies-runner-docker
    # The runner-images job below repeats none of these decisions; it reads them
    # from here, so a change to what publishes only has to be made once.
    outputs:
      publish: ${{ steps.publish.outputs.value }}
      runner: ${{ steps.changed.outputs.runner }}
      sha: ${{ steps.tags.outputs.sha }}
      version: ${{ steps.tags.outputs.version }}
      date: ${{ steps.tags.outputs.date }}
    steps:
      # Full history: the "what changed" step below diffs against a base commit
      # that a shallow clone does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      # Whether this run publishes anything. Only main does. A pull request --
      # from a fork especially -- is untrusted code carrying a read-only token,
      # and has no business writing to the registry: it builds the images to
      # prove the Dockerfiles still work, and pushes nothing.
      - id: publish
        name: Decide whether to publish
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # main publishes :dev, :main and :sha-<commit>.
      #
      # Not :latest. That tag is the release workflow's, and while both wrote it
      # the last one to run won: a merge to main overwrote the :latest a release
      # had just published, so an operator who pulled it got an unreleased build
      # and a controller stamped main-sha-abc1234 -- which no installer can
      # match a host to, because agents are installed from release assets.
      #
      # :dev says what it is. Someone who wants main asks for main; :latest
      # means the newest release, which is what everyone else expects it to
      # mean.
      - id: tags
        name: Work out the tags
        run: |
          short=$(git rev-parse --short HEAD)
          echo "sha=sha-$short" >> "$GITHUB_OUTPUT"
          echo "version=main-sha-$short" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - if: steps.publish.outputs.value == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}

      # Pull requests build amd64; main publishes both architectures. The
      # controller and agent cross-compile natively, so neither needs an arm64
      # machine; the runner images, which install packages, build each
      # architecture on its own kind of machine in runner-images below.
      - id: platforms
        name: Decide the platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests only need to prove a changed runner Dockerfile still
      # builds. Every push to main rebuilds every runner variant even when its
      # inputs did not change, because :dev is a build channel: its labels and
      # embedded build stamp must identify the same commit as the controller,
      # agent image and binary.
      #
      # Runs after the builder is set up, because deciding needs a registry
      # lookup.
      - id: changed
        name: Work out what changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLISH: ${{ steps.publish.outputs.value }}
        run: |
          set -eu
          build_it() { echo "runner=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$PUBLISH" = "true" ]; then
            build_it
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_it
          fi

          # A base we cannot resolve -- a force push, a branch's first commit --
          # tells us nothing about what changed, so assume the worst.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            build_it
          fi

          if git diff --name-only "$BASE" HEAD |
             grep -qE '^(deploy/(Dockerfile\.runner|runner-entrypoint\.sh|runner-[a-z-]+\.sh)|test/runner-image/.*)$'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ steps.publish.outputs.value }}
          # Export intermediate layers for the next ephemeral builder. Each
          # target has its own scope; cache export is optional and bounded.
          cache-from: type=gha,version=2,scope=ci-controller
          cache-to: type=gha,version=2,scope=ci-controller,mode=max,timeout=5m,ignore-error=true
          # Without these, `zoomies version` inside a published image reports
          # the Dockerfile's "dev" default, and nothing in the image says which
          # commit it came from.
          build-args: |
            RUNNER_IMAGE_TAG=dev
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.tags.outputs.date }}
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:dev
            ${{ env.CONTROLLER_IMAGE }}:main
            ${{ env.CONTROLLER_IMAGE }}:${{ steps.tags.outputs.sha }}

      # The agent image, which nothing built until now.
      #
      # deploy/Dockerfile has carried an `agent` target all along and no
      # workflow named it, so the only way to run an agent in a container was to
      # run the controller image and override its command. An agent host that
      # wants a container now has one that says what it is.
      - name: Build the agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ steps.publish.outputs.value }}
          cache-from: type=gha,version=2,scope=ci-agent
          cache-to: type=gha,version=2,scope=ci-agent,mode=max,timeout=5m,ignore-error=true
          build-args: |
            RUNNER_IMAGE_TAG=dev
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.tags.outputs.date }}
          tags: |
            ${{ env.AGENT_IMAGE }}:dev
            ${{ env.AGENT_IMAGE }}:main
            ${{ env.AGENT_IMAGE }}:${{ steps.tags.outputs.sha }}

      - name: Say what happened
        env:
          PUBLISH: ${{ steps.publish.outputs.value }}
          RUNNER_BUILT: ${{ steps.changed.outputs.runner }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          set -eu
          {
            if [ "$RUNNER_BUILT" != "true" ]; then
              echo "The runner images were not rebuilt: nothing under deploy/ that goes into them changed."
              echo
            fi
            if [ "$PUBLISH" != "true" ]; then
              echo "Nothing was published: images are pushed from main only."
            else
              echo "Published:"
              echo
              echo "- \`$CONTROLLER_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
              echo "- \`$AGENT_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
              if [ "$RUNNER_BUILT" = "true" ]; then
                echo "- \`$RUNNER_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
                echo "- \`$RUNNER_DOCKER_IMAGE:dev\`, \`:main\`, \`:$SHA_TAG\`"
              else
                echo "- The runner images were checked but not published."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # One build per operating system in internal/naming's catalogue and per
  # architecture, each building both of deploy/Dockerfile.runner's targets.
  #
  # It is a separate job from `images` because it is the expensive half -- five
  # variants, each downloading the ~200 MB actions/runner archive and a build
  # toolchain. Pull requests run it only for relevant changes; main runs it for
  # every published dev build so all artifacts carry one commit stamp.
  #
  # Each architecture builds on a machine of its own kind: amd64 on the x64
  # pool, arm64 on GitHub's hosted arm64 runner, as the arm64 test job does.
  # They used to share an x64 builder with QEMU emulating arm64, which was slow
  # and could not build Ubuntu 22.04 at all -- the emulator segfaulted inside
  # ldconfig. A leg pushes its image by digest only, and runner-manifests below
  # joins the legs into the tags a pool pulls. A pull request builds both
  # architectures, because the arm64 leg is the half an emulator used to hide,
  # and publishes nothing.
  #
  # TestWorkflowMatricesCoverTheCatalogue keeps this list and internal/naming's
  # catalogue in step, so a new operating system cannot be half-added.
  runner-images:
    name: Runner image (${{ matrix.tag }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || (((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64') }}
    needs: [images]
    if: needs.images.outputs.runner == 'true'
    permissions:
      contents: read
      packages: write
    env:
      RUNNER_IMAGE: ghcr.io/eyupio/zoomies-runner
      RUNNER_DOCKER_IMAGE: ghcr.io/eyupio/zoomies-runner-docker
      RUNNER_FULL_IMAGE: ghcr.io/eyupio/zoomies-runner-full
      PUBLISH: ${{ needs.images.outputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        # Generated from internal/naming's catalogue by `make generate`. Adding
        # or swapping an operating system is a row there, not here.
        # zoomies:catalogue-begin
        include:
          - { tag: ubuntu-2404, arch: amd64, base: "ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254",            family: apt, os: ubuntu, version: "24.04", platforms: "linux/amd64,linux/arm64", default: true, full: true }
          - { tag: ubuntu-2404, arch: arm64, base: "ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254",            family: apt, os: ubuntu, version: "24.04", platforms: "linux/amd64,linux/arm64", default: true, full: true }
          - { tag: ubuntu-2604, arch: amd64, base: "ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78",            family: apt, os: ubuntu, version: "26.04", platforms: "linux/amd64,linux/arm64", full: true }
          - { tag: ubuntu-2604, arch: arm64, base: "ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78",            family: apt, os: ubuntu, version: "26.04", platforms: "linux/amd64,linux/arm64", full: true }
          - { tag: ubuntu-2204, arch: amd64, base: "ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7",            family: apt, os: ubuntu, version: "22.04", platforms: "linux/amd64,linux/arm64", full: true }
          - { tag: ubuntu-2204, arch: arm64, base: "ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7",            family: apt, os: ubuntu, version: "22.04", platforms: "linux/amd64,linux/arm64", full: true }
          - { tag: debian-13,   arch: amd64, base: "debian:13-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a",          family: apt, os: debian, version: "13",    platforms: "linux/amd64,linux/arm64" }
          - { tag: debian-13,   arch: arm64, base: "debian:13-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a",          family: apt, os: debian, version: "13",    platforms: "linux/amd64,linux/arm64" }
          - { tag: debian-12,   arch: amd64, base: "debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171",          family: apt, os: debian, version: "12",    platforms: "linux/amd64,linux/arm64" }
          - { tag: debian-12,   arch: arm64, base: "debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171",          family: apt, os: debian, version: "12",    platforms: "linux/amd64,linux/arm64" }
          - { tag: fedora-42,   arch: amd64, base: "fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814",               family: dnf, os: fedora, version: "42",    platforms: "linux/amd64,linux/arm64" }
          - { tag: fedora-42,   arch: arm64, base: "fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814",               family: dnf, os: fedora, version: "42",    platforms: "linux/amd64,linux/arm64" }
          - { tag: rocky-9,     arch: amd64, base: "rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f", family: dnf, os: rocky,  version: "9",     platforms: "linux/amd64,linux/arm64" }
          - { tag: rocky-9,     arch: arm64, base: "rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f", family: dnf, os: rocky,  version: "9",     platforms: "linux/amd64,linux/arm64" }
        # zoomies:catalogue-end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.images.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only the default variant carries the unqualified tags. Anything else
      # would mean a pool that named no operating system got whichever variant
      # this matrix happened to finish last.
      #
      # Written to a file rather than applied here: this leg holds one
      # architecture, and a tag pointing at it alone would hand the other
      # architecture's hosts an image they cannot run. runner-manifests applies
      # them once every leg has pushed.
      - id: tags
        name: Work out the tags
        env:
          IS_DEFAULT: ${{ matrix.default && 'true' || 'false' }}
          IS_FULL: ${{ matrix.full && 'true' || 'false' }}
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
          PLATFORMS: ${{ matrix.platforms }}
          SHA_TAG: ${{ needs.images.outputs.sha }}
        run: |
          set -eu
          out="$RUNNER_TEMP/digests/$TAG"
          mkdir -p "$out"
          echo "$PLATFORMS" > "$out/platforms"
          images="$RUNNER_IMAGE $RUNNER_DOCKER_IMAGE"
          # runner-full exists for the catalogue's Full rows only; the marker
          # is how runner-manifests knows to publish it for this variant.
          if [ "$IS_FULL" = "true" ]; then
            images="$images $RUNNER_FULL_IMAGE"
            touch "$out/full"
          fi
          for image in $images; do
            key="${image##*/}"
            {
              echo "$image:$TAG-dev"
              echo "$image:$TAG-main"
              echo "$image:$TAG-$SHA_TAG"
              if [ "$IS_DEFAULT" = "true" ]; then
                echo "$image:dev"
                echo "$image:main"
                echo "$image:$SHA_TAG"
              fi
            } > "$out/$ARCH-$key.tags"
          done

      - id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/${{ matrix.arch }}
          # Pushed by digest and named by nothing yet; see the tags step.
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.RUNNER_IMAGE) || 'type=cacheonly' }}
          # Separate variants, architectures and targets so matrix jobs cannot
          # replace one another's cache. GitHub also isolates PR caches from main.
          cache-from: type=gha,version=2,scope=ci-runner-${{ matrix.tag }}-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=ci-runner-${{ matrix.tag }}-${{ matrix.arch }},mode=max,timeout=5m,ignore-error=true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}

      # The variant with a Docker CLI, for pools whose docker_mode gives jobs a
      # daemon. Everything below the client is a layer the step above just
      # built, so this costs one package install rather than another image.
      - id: runner-docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.RUNNER_DOCKER_IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,version=2,scope=ci-runner-docker-${{ matrix.tag }}-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=ci-runner-docker-${{ matrix.tag }}-${{ matrix.arch }},mode=max,timeout=5m,ignore-error=true
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}

      # The language toolchains on top of runner-docker, for the Ubuntu rows.
      # Its layers are several gigabytes of downloads, so they are not written
      # to the Actions cache, whose limit they would fill by themselves and
      # push everything else out of; everything beneath them is the
      # runner-docker build above, from the same builder.
      - id: runner-full
        if: matrix.full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-full
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.RUNNER_FULL_IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,version=2,scope=ci-runner-docker-${{ matrix.tag }}-${{ matrix.arch }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}

      # Check each finished image holds what the rest of Zoomies assumes of it:
      # the runner user's uid, the files the entrypoint execs, the pinned
      # actions/runner release, the tools workflows expect, the Docker client
      # on exactly one of the two targets, and an operating system that is the
      # one this catalogue row names. test/runner-image/check.sh says where
      # each expectation comes from.
      #
      # The same build arguments, platform and cache scope as the build above,
      # so each load is a cache hit rather than a rebuild -- and each leg checks
      # the image of its own architecture, natively. These steps once named
      # linux/amd64 outright, from when every leg shared an x64 builder; once
      # the arm64 legs moved to arm64 runners that meant rebuilding the amd64
      # image under emulation there, where git-lfs's installer crashes, and
      # then failing to run it at all (exec format error).
      - name: Load the runner image to check it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          cache-from: type=gha,version=2,scope=ci-runner-${{ matrix.tag }}-${{ matrix.arch }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}
          tags: zoomies-runner-check:${{ matrix.tag }}

      - name: The runner image has what Zoomies relies on
        run: test/runner-image/check.sh "zoomies-runner-check:${{ matrix.tag }}" "${{ matrix.os }}" "${{ matrix.version }}" runner

      - name: Load the runner-docker image to check it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          cache-from: type=gha,version=2,scope=ci-runner-docker-${{ matrix.tag }}-${{ matrix.arch }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}
          tags: zoomies-runner-docker-check:${{ matrix.tag }}

      - name: The runner-docker image has what Zoomies relies on
        run: test/runner-image/check.sh "zoomies-runner-docker-check:${{ matrix.tag }}" "${{ matrix.os }}" "${{ matrix.version }}" runner-docker

      # EXTRA_PACKAGES is a documented way to bake a fleet's own toolchain into
      # a variant without forking the Dockerfile, and nothing above exercises
      # it: it could stop reaching the image entirely and every build in this
      # workflow would still pass. So each variant is built once more with it
      # set, and the result is run.
      #
      # That is cheap because deploy/runner-extra.sh is the image's last layer:
      # everything beneath it is a cache hit from the build above. Doing it on
      # every row rather than one covers both package families, which is the
      # only thing that script branches on, and both architectures, now that
      # each leg's machine can run what it built.
      - name: Build the variant with an extra package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          # Reuse the base, but do not replace its cache with this temporary
          # image.
          cache-from: type=gha,version=2,scope=ci-runner-${{ matrix.tag }}-${{ matrix.arch }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            EXTRA_PACKAGES=tree
          tags: zoomies-runner-extra-packages:${{ matrix.tag }}

      - name: The extra package is in the image
        env:
          IMAGE: zoomies-runner-extra-packages:${{ matrix.tag }}
        run: |
          set -eu
          # `tree` is in no variant's own package list, so finding it on PATH
          # can only mean the build argument arrived.
          docker run --rm --entrypoint tree "$IMAGE" --version

      # The pushed full image is durable even after its builder cache is gone.
      # Loading it through Buildx keeps another copy of the multi-gigabyte
      # toolchains beside the checked image, exhausting the DinD runner's disk.
      # Finish all other builds first, then validate the exact digest that will
      # receive the published tag. PRs have no pushed digest, so keep their
      # local Buildx load and do not discard the cache it depends on.
      - name: Make room to check the published runner-full image
        if: matrix.full && matrix.arch == 'amd64' && env.PUBLISH == 'true'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          DIGEST: ${{ steps.runner-full.outputs.digest }}
          TAG: ${{ matrix.tag }}
        run: |
          set -eu
          test -n "$DIGEST"
          docker image rm "zoomies-runner-check:$TAG" "zoomies-runner-docker-check:$TAG" "zoomies-runner-extra-packages:$TAG"
          docker buildx prune --builder "$BUILDER" --all --force
          ref="$RUNNER_FULL_IMAGE@$DIGEST"
          docker pull --platform linux/amd64 "$ref"
          docker tag "$ref" "zoomies-runner-full-check:$TAG"

      # On its own architecture only: under an emulator this would be
      # gigabytes of toolchains unpacked and run through QEMU. The arm64 leg's
      # build above already runs every toolchain's own version check.
      - name: Load the runner-full image to check it
        if: matrix.full && matrix.arch == 'amd64' && env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-full
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha,version=2,scope=ci-runner-docker-${{ matrix.tag }}-${{ matrix.arch }}
          build-args: |
            BASE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_ID=${{ matrix.os }}
            OS_VERSION=${{ matrix.version }}
            VERSION=${{ needs.images.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.images.outputs.date }}
          tags: zoomies-runner-full-check:${{ matrix.tag }}

      - name: The runner-full image has what Zoomies relies on
        if: matrix.full && matrix.arch == 'amd64'
        run: test/runner-image/check.sh "zoomies-runner-full-check:${{ matrix.tag }}" "${{ matrix.os }}" "${{ matrix.version }}" runner-full

      # Only a matrix leg that passed every image check may hand its pushed
      # digests to the manifest publisher. A failed validation must not move a
      # user-facing image tag.
      - if: needs.images.outputs.publish == 'true'
        name: Record the digests
        env:
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
          IS_FULL: ${{ matrix.full && 'true' || 'false' }}
          RUNNER_DIGEST: ${{ steps.runner.outputs.digest }}
          RUNNER_DOCKER_DIGEST: ${{ steps.runner-docker.outputs.digest }}
          RUNNER_FULL_DIGEST: ${{ steps.runner-full.outputs.digest }}
        run: |
          set -eu
          test -n "$RUNNER_DIGEST" && test -n "$RUNNER_DOCKER_DIGEST"
          echo "$RUNNER_DIGEST" > "$RUNNER_TEMP/digests/$TAG/$ARCH-zoomies-runner.digest"
          echo "$RUNNER_DOCKER_DIGEST" > "$RUNNER_TEMP/digests/$TAG/$ARCH-zoomies-runner-docker.digest"
          if [ "$IS_FULL" = "true" ]; then
            test -n "$RUNNER_FULL_DIGEST"
            echo "$RUNNER_FULL_DIGEST" > "$RUNNER_TEMP/digests/$TAG/$ARCH-zoomies-runner-full.digest"
          fi

      - if: needs.images.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-digests-${{ matrix.tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  # Joins each variant's per-architecture digests into the tags a pool pulls.
  # A variant goes out only when every architecture it is published for
  # pushed: a tag missing one would be a runner that cannot start on that
  # architecture's hosts, which is worse than the previous tag it would have
  # replaced. One variant failing leaves the others to publish, as it did when
  # a matrix row built both architectures itself.
  runner-manifests:
    name: Runner image manifests
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)) && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    needs: [images, runner-images]
    if: ${{ !cancelled() && needs.images.outputs.publish == 'true' && needs.images.outputs.runner == 'true' && needs.runner-images.result != 'skipped' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runner-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish the tags
        env:
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -eu
          shopt -s nullglob
          dirs=("$DIGESTS"/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::Runner images were expected, but no validated digest artifacts were produced."
            exit 1
          fi
          failed=0
          for dir in "${dirs[@]}"; do
            variant=$(basename "$dir")
            images="zoomies-runner zoomies-runner-docker"
            [ -f "$dir/full" ] && images="$images zoomies-runner-full"
            for image in $images; do
              refs="" missing=""
              for platform in $(tr ',' ' ' < "$dir/platforms"); do
                arch="${platform#linux/}"
                if [ -s "$dir/$arch-$image.digest" ]; then
                  refs="$refs ghcr.io/eyupio/$image@$(cat "$dir/$arch-$image.digest")"
                else
                  missing="$missing $arch"
                fi
              done
              if [ -n "$missing" ]; then
                echo "::error::$image for $variant was not published: nothing was built for$missing"
                failed=1
                continue
              fi
              tags=$(sort -u "$dir"/*-"$image".tags | sed 's/^/-t /' | tr '\n' ' ')
              # Both lists are split into words on purpose.
              # shellcheck disable=SC2086
              docker buildx imagetools create $tags $refs
            done
          done
          exit "$failed"
