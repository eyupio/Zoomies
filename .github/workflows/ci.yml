name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go:embed needs the directory to exist even when the UI is not built.
      - name: Stub the embedded UI
        run: make build-nogui

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  staticcheck:
    name: staticcheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make build-nogui
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  ui:
    name: UI
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      # The generated client must match api/openapi.yaml. If it does not, the
      # UI is typed against an API that no longer exists.
      - name: The generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api/schema.d.ts \
            || { echo "::error::src/lib/api/schema.d.ts is stale. Run 'make openapi' and commit the result."; exit 1; }
        working-directory: web
      - run: npm run check
        working-directory: web
      # The build fails on its own if the gzipped shell exceeds the 200 KB
      # budget documented in docs/ui-guidelines.md.
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: webdist
          path: internal/api/webdist
          retention-days: 3

  playwright:
    name: Playwright
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: webdist
          path: internal/api/webdist
      - run: go build -o zoomies ./cmd/zoomies
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  build-matrix:
    name: Cross-compile
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: webdist
          path: internal/api/webdist
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/zoomies ./cmd/zoomies

  installer:
    name: install.sh
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: POSIX shell syntax
        run: |
          # dash is the strictest POSIX sh most users will have; install.sh must
          # parse under it, not just under bash.
          sudo apt-get update -qq && sudo apt-get install -y -qq dash shellcheck
          dash -n install.sh
          shellcheck -s sh install.sh
          shellcheck deploy/runner-entrypoint.sh

  images:
    name: Images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # Which images actually need building. The runner image is by far the
      # most expensive thing in this workflow -- it apt-installs a desktop's
      # worth of build dependencies and downloads the ~200 MB actions/runner
      # tarball -- so it is built only when something that goes into it changed.
      - id: changed
        name: Work out what changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "${BASE:-}" ]; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^deploy/(Dockerfile\.runner|runner-entrypoint\.sh)$'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

      # arm64 is emulated, and emulated apt plus an emulated 200 MB download is
      # the difference between a two-minute job and a twenty-minute one. A pull
      # request proves the Dockerfiles still build; main proves they still build
      # for both architectures. Releases publish multi-arch either way, from
      # release.yml.
      - id: platforms
        name: Decide the platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is only needed for the architecture this machine is not.
      - if: steps.platforms.outputs.list != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build the controller image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: ${{ steps.platforms.outputs.list }}
          push: false

      - name: Build the runner image
        if: steps.changed.outputs.runner == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile.runner
          platforms: ${{ steps.platforms.outputs.list }}
          push: false

      - name: Say when the runner image was skipped
        if: steps.changed.outputs.runner != 'true'
        run: |
          echo "The runner image was not rebuilt: nothing under deploy/ that goes into it changed." >> "$GITHUB_STEP_SUMMARY"
