name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  binaries:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache: true }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make dist VERSION=${GITHUB_REF_NAME#v}
      # install.sh verifies the checksum of what it downloads, so this file is
      # part of the security story, not just a convenience.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zoomies_*
            dist/checksums.txt
          generate_release_notes: true
          draft: true

  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token rather than secrets.GITHUB_TOKEN: the same value, but
          # GitHub reserves the GITHUB_ prefix for secret names, so referring to
          # it this way keeps the workflow clear of that namespace entirely.
          password: ${{ github.token }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile
          target: controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/eyupio/zoomies:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies:latest
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eyupio/zoomies-runner:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies-runner:latest

      # The same file's other target: the runner plus a Docker CLI, for pools
      # whose docker_mode gives jobs a daemon to talk to. It shares every layer
      # below the client, so the second build is cheap.
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/Dockerfile.runner
          target: runner-docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/eyupio/zoomies-runner-docker:${{ github.ref_name }}
            ghcr.io/eyupio/zoomies-runner-docker:latest
