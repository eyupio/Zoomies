name: Label
on: pull_request_target
permissions: {}
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./label.sh
